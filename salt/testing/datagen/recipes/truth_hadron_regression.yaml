# truth_hadron_regression (GN2X_qcdsplit) -- flavour_tagger minus Electrons plus
# a LINK-FREE truth_hadrons constituent stream (distinct from the inserter).
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.core.testing.datagen.modules.Jets
    init_args:
      fields: jet_features.yaml
  - class_path: salt.core.testing.datagen.modules.Tracks
    init_args:
      max_items: 40
      min_valid: 1
      fields: track_features.yaml
  - class_path: salt.core.testing.datagen.modules.Flows
    init_args:
      max_items: 40
      fields: flow_features.yaml
  - class_path: salt.core.testing.datagen.modules.TruthHadrons
    init_args:
      max_items: 5
      min_valid: 1
      fields: hadron_features.yaml
  - class_path: salt.core.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/truth_hadron_regression.h5" }
  - class_path: salt.core.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
  - class_path: salt.core.testing.datagen.modules.ClassDictWriter
    init_args: { path: "${OUTPUT_DIR}/class_dict.yaml" }
