# event_objects (event_classifier) -- the `event_vars` global object + the
# `objects_vars` constituent stream, named as event_classifier.yaml reads them.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.testing.datagen.modules.GlobalObject
    init_args:
      name: event_vars
      fields:
        - { name: mBB,  type: distribution, dtype: f4, dist: lognormal }
        - { name: nJet, type: distribution, dtype: f4 }
        - { name: HT,   type: distribution, dtype: f4, dist: lognormal }
  - class_path: salt.testing.datagen.modules.Constituents
    init_args:
      name: objects_vars
      max_items: 20
      min_valid: 1
      # Superset of event_classifier.yaml objects {type,pt,eta,phi,mass,btag,tauId}.
      fields:
        - { name: type,  type: distribution, dtype: f4 }
        - { name: pt,    type: distribution, dtype: f4, dist: lognormal }
        - { name: eta,   type: distribution, dtype: f4, dist: normal }
        - { name: phi,   type: distribution, dtype: f4 }
        - { name: mass,  type: distribution, dtype: f4, dist: lognormal }
        - { name: btag,  type: distribution, dtype: f4 }
        - { name: tauId, type: distribution, dtype: f4 }
  - class_path: salt.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/event_objects.h5" }
