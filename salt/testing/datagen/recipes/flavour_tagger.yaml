# flavour_tagger -- the dominant topology. A VARIABLE-SUPERSET for every
# test-suite config mapped to it: GN2, GN2_muP, GN2emu, GN2XE, GN3V00, GN3V01,
# dips, regression, nan_regression, regression_gaussian, regression_multi_target,
# regression_weighted, flow, no_global_inputs, param_concat, param_featurewise.
#
# Streams emitted (matching salt/utils/inputs.py write_dummy_file groups):
#   jets, tracks, tracks_dr, tracks_ghost (GN3 input_map remaps tracks->tracks_ghost),
#   flows AND flow (GN3 uses 'flows', flow.yaml uses 'flow'), electrons.
# The jets group carries the union of plain-jet / global-block (softMuon_*) /
# parameters ('mass') / regression-targets / classification-labels (see
# jet_features.yaml). is_gn3 / make_xbb / inc_taus flags fan out to the Jets
# flavour_label resolution + ClassDictWriter.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.testing.datagen.modules.Jets
    init_args:
      fields: jet_features.yaml
  - class_path: salt.testing.datagen.modules.Tracks
    init_args:
      name: tracks
      max_items: 40
      min_valid: 1
      fields: track_features.yaml
  # tracks_dr / tracks_ghost: identical-schema duplicate groups the dummy writer
  # emits (inputs.py:676-677) and the GN3 input_map remaps `tracks`->`tracks_ghost`.
  - class_path: salt.testing.datagen.modules.Tracks
    init_args:
      name: tracks_dr
      max_items: 40
      min_valid: 1
      fields: track_features.yaml
  - class_path: salt.testing.datagen.modules.Tracks
    init_args:
      name: tracks_ghost
      max_items: 40
      min_valid: 1
      fields: track_features.yaml
  - class_path: salt.testing.datagen.modules.Flows
    init_args:
      name: flows
      max_items: 40
      fields: flow_features.yaml
  # 'flow' (singular): flow.yaml declares group 'flow'; the dummy writer
  # duplicates flows->flow (inputs.py:681). Both names must be present.
  - class_path: salt.testing.datagen.modules.Flows
    init_args:
      name: flow
      max_items: 40
      fields: flow_features.yaml
  - class_path: salt.testing.datagen.modules.Electrons
    init_args:
      max_items: 10
      mask_invalid: false
      fields: electron_features.yaml
  - class_path: salt.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/flavour_tagger.h5" }
  - class_path: salt.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
  - class_path: salt.testing.datagen.modules.ClassDictWriter
    init_args: { path: "${OUTPUT_DIR}/class_dict.yaml" }
