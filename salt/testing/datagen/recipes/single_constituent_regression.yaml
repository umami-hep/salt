# single_constituent_regression (Dipz, hitz) -- jets + a single constituent
# stream (super_tracks / hits). Gaussian-regression head -> NO ClassDictWriter.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.testing.datagen.modules.Jets
    init_args:
      fields: jet_features.yaml
  - class_path: salt.testing.datagen.modules.Constituent
    init_args:
      name: super_tracks
      max_items: 40
      min_valid: 1
      fields:
        - { name: pt,         type: distribution, dtype: f4, dist: lognormal }
        - { name: d0,         type: distribution, dtype: f4, dist: normal }
        - { name: z0SinTheta, type: distribution, dtype: f4, dist: normal }
  - class_path: salt.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/single_constituent_regression.h5" }
  - class_path: salt.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
