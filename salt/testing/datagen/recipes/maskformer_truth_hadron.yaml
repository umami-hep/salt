# maskformer_truth_hadron -- the only full object<->constituent link recipe.
# TruthHadronInserter sits AFTER Tracks (its requires: ["tracks"]); moving it
# before Tracks raises RecipeError at Pipeline.__init__. It owns both link sides:
# truth_hadrons.barcode and tracks.ftagTruthParentBarcode.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.core.testing.datagen.modules.Jets
    init_args:
      fields: jet_features.yaml
  - class_path: salt.core.testing.datagen.modules.Tracks
    init_args:
      max_items: 40
      min_valid: 1
      fields: track_features.yaml
  - class_path: salt.core.testing.datagen.modules.TruthHadronInserter
    init_args:
      max_items: 5
      min_valid: 1
      required_match: false        # MaskFormer.yaml link: unmatched allowed, -1 sentinel
      unmatched_fraction: 0.0
      unmatched_value: -1
      hadron_fields: hadron_features.yaml
  - class_path: salt.core.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/maskformer_truth_hadron.h5" }
  - class_path: salt.core.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
  - class_path: salt.core.testing.datagen.modules.ClassDictWriter
    init_args: { path: "${OUTPUT_DIR}/class_dict.yaml" }
