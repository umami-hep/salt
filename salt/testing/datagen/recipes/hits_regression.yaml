# hits_regression (hitz) -- jets + a `hits` constituent stream. The sibling
# single_constituent_regression recipe serves Dipz with `super_tracks`.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.testing.datagen.modules.Jets
    init_args:
      fields: jet_features.yaml
  - class_path: salt.testing.datagen.modules.Constituent
    init_args:
      name: hits
      max_items: 40
      min_valid: 1
      fields:
        - { name: layer, type: distribution, dtype: f4 }
        - { name: j,     type: distribution, dtype: f4, dist: normal }
        - { name: a,     type: distribution, dtype: f4, dist: normal }
        - { name: b,     type: distribution, dtype: f4, dist: normal }
  - class_path: salt.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/hits_regression.h5" }
  - class_path: salt.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
