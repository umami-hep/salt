    dtype: f4
  - name: R10TruthLabel_R22v1_TruthJetMass
    type: distribution
    dtype: f4
    dist: lognormal
  - name: R10TruthLabel_R22v1_TruthJetPt
    type: distribution
    dtype: f4
    dist: lognormal
  - name: GN2Xv00_phbb
    type: distribution
    dtype: f4
  - name: GN2Xv00_phcc
    type: distribution
    dtype: f4
  - name: GN2Xv00_ptop
    type: distribution
    dtype: f4
  - name: GN2Xv00_pqcd
    type: distribution
    dtype: f4
  - name: GN2XWithMassv00_phbb
    type: distribution
    dtype: f4
  - name: GN2XWithMassv00_phcc
    type: distribution
    dtype: f4
  - name: GN2XWithMassv00_ptop
    type: distribution
    dtype: f4
  - name: GN2XWithMassv00_pqcd
    type: distribution
    dtype: f4
  - name: Xbb2020v3_Higgs
    type: distribution
    dtype: f4
  - name: Xbb2020v3_Top
    type: distribution
    dtype: f4
  - name: Xbb2020v3_QCD
    type: distribution
    dtype: f4
  - name: flavour_label
    type: label
    dtype: i4
    classes:
    - 0
    - 1
    - 2
    - 3
    sample_classes:
    - 0
    - 1
    - 2
    class_names:
    - bjets
    - cjets
    - ujets
    class_names_append_if:
      inc_taus:
      - taus
    classes_by_flag:
      make_xbb:
      - 0
      - 1
      - 2
      - 3
      is_gn3:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
    class_names_by_flag:
      make_xbb:
      - hbb
      - hcc
      - top
      - qcd
      is_gn3:
      - ghostsplitbjets
      - ghostsplitcjets
      - ghostsplitsjets
      - ghostsplitudjets
      - ghostsplitgjets
      - ghostsplittaujets
  - name: HadronConeExclTruthLabelID
