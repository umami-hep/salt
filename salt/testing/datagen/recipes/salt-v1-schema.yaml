# salt-v1-schema.yaml -- SCHEMA-FORMAT doc (n_samples/seed/groups/fields),
# consumed by parity.py via salt.testing.datagen.schema.load_schema
# (plain yaml.safe_load + parse_schema -- NOT the pipeline recipe loader, so the
# feature lists are INLINED here rather than referenced).
#
# It reconstructs salt.utils.inputs.write_dummy_file as a SUPERSET supporting all
# flag combinations the parity gate uses: make_xbb / inc_taus / inc_params /
# is_gn3. Field lists are the same variable-supersets the pipeline recipes encode
# (recipes/feature_lists/*.yaml) -- the faithful source of truth -- but here they
# live in ONE flat schema the engine's generate_data() drives directly.
#
# Distinct from the pipeline recipes (flavour_tagger.yaml / maskformer_truth_hadron.yaml):
# those drive the modular Pipeline; this drives the schema engine for the parity
# drop-in. AUTO-GENERATED from the feature_lists by tools; edit the feature_lists
# and regenerate, or edit here directly.
#
# Group map -> write_dummy_file:
#   jets         : global; jet_vars f4 + flavour_label/HadronConeExclTruthLabelID/
#                  HadronGhostInitialTruthLabelPdgId labels; HadronConeExclTruthLabelLxy
#                  NaN where flavour_label==0; sample_weight uniform.
#   tracks       : constituent max 40, min_valid 1; TRACK_VARS f4 + 3 labels +
#                  ftagTruthParentBarcode LINK -> truth_hadrons.barcode (maskformer).
#   tracks_dr / tracks_ghost : alias_of tracks (dummy writer duplicates them).
#   flows        : constituent max 40; FLOW_VARS.   flow : alias_of flows.
#   electrons    : constituent max 10, mask_invalid false; ELECTRON_VARS + 2 labels.
#   truth_hadrons: constituent max 5, min_valid 1; HADRON_VARS + barcode id + flavour label.
#   parameters   : global, emit_if inc_params; carries ['mass'].
n_samples: 1000
seed: 42
fill:
  float: .nan
  int: -1
file_attrs:
  config: '{}'
groups:
- name: jets
  kind: global
  fields:
  - name: pt
    type: distribution
    dtype: f4
    dist: lognormal
  - name: eta
    type: distribution
    dtype: f4
    dist: normal
  - name: mass
    type: distribution
    dtype: f4
    dist: lognormal
  - name: pt_btagJes
    type: distribution
    dtype: f4
    dist: lognormal
  - name: eta_btagJes
    type: distribution
    dtype: f4
    dist: normal
  - name: ptFromTruthDressedWZJet
    type: distribution
    dtype: f4
    dist: lognormal
  - name: HadronConeExclTruthLabelPt
    type: distribution
    dtype: f4
    dist: lognormal
  - name: HadronConeExclTruthLabelLxy
    type: distribution
    dtype: f4
    nan_where: flavour_label == 0
  - name: n_tracks
    type: distribution
    dtype: f4
  - name: n_truth_promptLepton
    type: distribution
    dtype: f4
  - name: sample_weight
    type: distribution
    dtype: f4
    dist: uniform
  - name: softMuon_pt
