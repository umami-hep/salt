    dtype: f4
  - name: softMuon_scatteringNeighbourSignificance
    type: distribution
    dtype: f4
  - name: softMuon_pTrel
    type: distribution
    dtype: f4
  - name: softMuon_ip3dD0
    type: distribution
    dtype: f4
  - name: softMuon_ip3dZ0
    type: distribution
    dtype: f4
  - name: softMuon_ip3dD0Significance
    type: distribution
    dtype: f4
  - name: softMuon_ip3dZ0Significance
    type: distribution
    dtype: f4
  - name: softMuon_ip3dD0Uncertainty
    type: distribution
    dtype: f4
  - name: softMuon_ip3dZ0Uncertainty
