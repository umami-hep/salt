# flavour_tagger_charged_neutral (3 configs) -- swaps Tracks for TracksLoose +
# separate Charged + Neutral constituent streams.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.testing.datagen.modules.Jets
    init_args:
      fields: jet_features.yaml
  - class_path: salt.testing.datagen.modules.TracksLoose
    init_args:
      max_items: 40
      min_valid: 1
      fields: track_features.yaml
  - class_path: salt.testing.datagen.modules.Charged
    init_args:
      max_items: 40
      fields:
        - { name: pt,   type: distribution, dtype: f4, dist: lognormal }
        - { name: deta, type: distribution, dtype: f4 }
        - { name: dphi, type: distribution, dtype: f4 }
  - class_path: salt.testing.datagen.modules.Neutral
    init_args:
      max_items: 40
      fields:
        - { name: pt,     type: distribution, dtype: f4, dist: lognormal }
        - { name: energy, type: distribution, dtype: f4, dist: lognormal }
        - { name: deta,   type: distribution, dtype: f4 }
  - class_path: salt.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/flavour_tagger_charged_neutral.h5" }
  - class_path: salt.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
  - class_path: salt.testing.datagen.modules.ClassDictWriter
    init_args: { path: "${OUTPUT_DIR}/class_dict.yaml" }
