# lepton_tagger (PLITel, TPLTmu) -- global lepton object + its constituent
# tracks. The global group is named `electrons` (the reader's global_object);
# the constituent stream is `electron_tracks`.
seed: 42
n_samples: 1000
flags: {}
modules:
  - class_path: salt.testing.datagen.modules.GlobalObject
    init_args:
      name: electrons
      fields:
        - { name: pt,      type: distribution, dtype: f4, dist: lognormal }
        - { name: eta,     type: distribution, dtype: f4, dist: normal }
        - { name: ptfrac,  type: distribution, dtype: f4 }
        - name: iffClass
          type: label
          dtype: i4
          classes: [0, 1, 2, 3, 4, 5]
          sample_classes: [0, 1, 2, 3]
          class_names: [prompt, nonprompt, photon, fake]
  - class_path: salt.testing.datagen.modules.Constituents
    init_args:
      name: electron_tracks
      max_items: 20
      min_valid: 1
      fields:
        - { name: pt,         type: distribution, dtype: f4, dist: lognormal }
        - { name: d0,         type: distribution, dtype: f4, dist: normal }
        - { name: z0SinTheta, type: distribution, dtype: f4, dist: normal }
  - class_path: salt.testing.datagen.modules.H5Writer
    init_args: { path: "${OUTPUT_DIR}/lepton_tagger.h5" }
  - class_path: salt.testing.datagen.modules.NormWriter
    init_args: { path: "${OUTPUT_DIR}/norm_dict.yaml" }
  - class_path: salt.testing.datagen.modules.ClassDictWriter
    init_args: { path: "${OUTPUT_DIR}/class_dict.yaml" }
