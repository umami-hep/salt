# regression_weighted.yaml — per-sample-weighted RegressionTaskModule in the v2
# schema (M5 sub-wave A3). The v2-native port of legacy
# salt/configs/regression_weighted.yaml: an encoder-less DiPS body (init_nets +
# pool_net, NO encoder — v1 saltmodel.py:90-93) feeding pooled regression heads,
# each with a `sample_weight:` label that multiplies the per-element loss inside
# the composed v1 nan_loss (unsqueeze + multi-target expand; v1
# task.py:379-382,429-435). Every weighted head MUST use loss reduction: none
# (the per-element loss must survive to the weight multiply + nanmean).
#
#   - reg_weighted        : single-target, mean/std norm_params, weighted
#   - reg_weighted_multi  : two targets, vector norm_params, weighted (the
#                           weight is expanded across targets, task.py:433-434)
#   - reg_weighted_ratio  : target_denominators ratio + custom_output_names,
#                           weighted; pt_btagJes is a declared input Feature so
#                           ONNX de-scaling gathers it by name (FD §3.3)
#
# NO machine paths committed (design §5 placeholder policy). From the REPO ROOT:
#   python -m salt.core.main graph validate -c salt/core/configs/regression_weighted.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: regression_weighted

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {vector: true}
          tracks: {vector: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs_config: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks # requires normed.tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      reg_weighted:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          norm_params: {mean: 1.0, std: 1.0}
          sample_weight: sample_weight # labels.jets.sample_weight (FIT|VAL)
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_weighted_multi:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          norm_params: {mean: [1.0, 2.0], std: [3.0, 4.0]}
          sample_weight: sample_weight # expanded across targets (task.py:433-434)
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_weighted_ratio:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          target_denominators: pt_btagJes # a declared input Feature (ONNX source)
          custom_output_names: pt
          sample_weight: sample_weight
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

writers:
  modules:
    # no sequence-stream task -> no pad mask to write; delete the base2.yaml
    # default (design §5.3 null-deletion). TaskWriter columns: <run>_<suffix>
    # f4 per target.
    pad_mask: null

export: # export-ONLY half (design §5.1, §7); inert during fit/test
  model_name: regressionWeighted # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features} # [1, F] global
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks} # [L, F]
  # outputs: NONE — derived from the writers (M4.5 unified manifest). The
  # sample_weight is a FIT|VAL-only label, absent from the export graph.

trainer:
  max_epochs: 2
