# gn2v2-opendata.yaml — GN2v2 at the v1 GN2 nominal scale (256/128, 4 layers,
# 8 heads — salt/configs/GN2/GN2.yaml), on the ATLAS open-data ttbar sample
# produced by umami-preprocessing (4 jet classes incl. taujets; the IP3D_*
# track significances are named lifetimeSigned* in this sample).
#
# Data paths are REQUIRED overrides — NO machine paths are committed (design
# §5 placeholder policy). A typical invocation FROM THE REPO ROOT (use
# `python -m salt.core.main` when the salt2 script is not installed):
#
#   salt2 fit --config salt/core/configs/gn2v2-opendata.yaml \
#     --data.train_file $DATA/pp_output_train.h5 \
#     --data.val_file   $DATA/pp_output_val.h5 \
#     --model.modules.norm.init_args.norm_dict $DATA/norm_dict.yaml \
#     --model.modules.jets_classification.init_args.weight_source='{"from_class_dict": "'$DATA'/class_dict.yaml"}' \
#     --model.modules.track_origin.init_args.weight_source='{"from_class_dict": "'$DATA'/class_dict.yaml"}'
#
# Optional (recommended): --data.modules.reader.init_args.schema $DATA/schema.yaml
# (from `salt2 schema dump`, design §2.6). The weight_source overrides
# reproduce v1 use_class_dict (GN2.yaml:50,64 — design §5.1); leave them null
# for unweighted CE losses. attn_type stays torch-math here: flash-varlen is
# the M6 cluster follow-up (plan 05 hardware note).

name: GN2v2_opendata

data:
  batch_size: 1000
  num_workers: 8
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {vector: true}
          tracks: {vector: false, truncate: 40}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              lifetimeSignedD0Significance,
              lifetimeSignedZ0SinThetaSignificance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    # lrs_config: == design §5.1 'lrs:' (the v1 ModelWrapper kwarg name is
    # kept in M2; the rename to 'lrs' is an M3 cleanup)
    lrs_config: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 256
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks]} # registers live in the encoder in M2
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: torch-math} # flash-varlen: M6
          dense: {activation: ReLU, gated: false}
      split:
        class_path: salt.core.nn.Split # production task path (design §3.3)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, ujets, taujets] # open-data label order
          weight_source: null # v1 use_class_dict — override (see header)
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          weight_source: null # v1 use_class_dict — override (see header)
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency (design §3.3)
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
          # origin_weighting takes integer origin IDS in M2 (default
          # heavy: [3, 4, 5], fake: [1] == v1 hardcoded); the design §5.1
          # name-based form ({heavy: [FromB, ...]}) lands in M3
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

trainer:
  max_epochs: 40
  precision: 32-true # 16-mixed on GPU clusters (M6 follow-up)
