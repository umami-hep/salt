# GN2v2 at the v1 GN2 nominal scale (256/128, 4 layers, 8 heads) on the ATLAS
# open-data ttbar sample from umami-preprocessing (4 jet classes incl.
# taujets; IP3D_* track significances are named lifetimeSigned* here).

name: GN2v2_opendata

data:
  batch_size: 1000
  num_workers: 8
  modules:
    input_samples:
      class_path: salt.core.data.InputSamples
      init_args:
        # ${DATA_*} placeholders — override per stage. num: -1 = all rows.
        files:
          train: ${DATA_TRAIN_PATH}
          val: ${DATA_VAL_PATH}
          test: ${DATA_TEST_PATH}
        num: {train: -1, val: -1, test: -1}
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, truncate: 40}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              lifetimeSignedD0Significance,
              lifetimeSignedZ0SinThetaSignificance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          norm_dict: ${DATA_NORM_DICT_PATH}
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: 256
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      split:
        class_path: salt.core.nn.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, ujets, taujets] # open-data label order
          weight_source: null
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          weight_source: null
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
          # origin_weighting takes integer origin IDs (default heavy: [3,4,5], fake: [1])
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

export:
  model_name: GN2v2opendata # Athena name: no '_'/'-'
  inputs:
    - { port: inputs.jets, name: jet_features }
    - { port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks }

trainer:
  max_epochs: 40
  precision: 32-true
