# gn2v2-opendata.yaml — GN2v2 at the v1 GN2 nominal scale (256/128, 4 layers,
# 8 heads — salt/configs/GN2/GN2.yaml), on the ATLAS open-data ttbar sample
# produced by umami-preprocessing (4 jet classes incl. taujets; the IP3D_*
# track significances are named lifetimeSigned* in this sample).
#
# Data paths are REQUIRED overrides — NO machine paths are committed (design
# §5 placeholder policy / plan-25 §5.1 R9). The `input_samples` block below is
# the plan-25 W3.A config-native data-sourcing form: a per-stage `files` map
# (train/val/test) on the data-sourcing setup module, with `${DATA_*}`
# placeholders so the placeholder-only preflight passes. A typical invocation
# FROM THE REPO ROOT (use `python -m salt.core.main` when the salt2 script is
# not installed) overrides the placeholders:
#
#   salt2 fit --config salt/core/configs/gn2v2-opendata.yaml \
#     --data.modules.input_samples.init_args.files.train $DATA/pp_output_train.h5 \
#     --data.modules.input_samples.init_args.files.val   $DATA/pp_output_val.h5 \
#     --norm_dict  $DATA/norm_dict.yaml \
#     --class_dict $DATA/class_dict.yaml
#
# The deprecated --data.train_file/--data.val_file/--data.test_file kwargs still
# work for one migration window (plan-25 O-ALIAS-WINDOW): if set with no
# `input_samples` block, the datamodule synthesises an implicit InputSamples.
#
# Optional (recommended): --data.modules.reader.init_args.schema $DATA/schema.yaml
# (from `salt2 schema dump`, design §2.6). `--norm_dict`/`--class_dict` are the
# Wave-1 one-flag fan-out (reproduce v1 use_class_dict, GN2.yaml:50,64); leave
# them unset for unweighted CE losses. attn_type stays torch-math here:
# flash-varlen is the M6 cluster follow-up (plan 05 hardware note).

name: GN2v2_opendata

data:
  batch_size: 1000
  num_workers: 8
  modules:
    # plan-25 W3.A data-sourcing: per-stage source files on the setup-only
    # InputSamples module (shape A — the parity-preserving default). Paths are
    # ${DATA_*} placeholders (placeholder-only preflight); override per stage.
    # `num` is the per-stage row cap (-1 = all, v1 semantics).
    input_samples:
      class_path: salt.core.data.InputSamples
      init_args:
        files:
          train: ${DATA_TRAIN_PATH}
          val: ${DATA_VAL_PATH}
          test: ${DATA_TEST_PATH}
        num: {train: -1, val: -1, test: -1}
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, truncate: 40}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              lifetimeSignedD0Significance,
              lifetimeSignedZ0SinThetaSignificance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    # lrs: == design §5.1 OneCycleLR block (the v1 ModelWrapper 'lrs_config'
    # kwarg, renamed to 'lrs' in M5 sub-wave D)
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 256
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks]} # registers live in the encoder in M2
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: torch-math} # flash-varlen: M6
          dense: {activation: ReLU, gated: false}
      split:
        class_path: salt.core.nn.Split # production task path (design §3.3)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, ujets, taujets] # open-data label order
          weight_source: null # v1 use_class_dict — override (see header)
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          weight_source: null # v1 use_class_dict — override (see header)
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency (design §3.3)
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
          # origin_weighting takes integer origin IDS in M2 (default
          # heavy: [3, 4, 5], fake: [1] == v1 hardcoded); the design §5.1
          # name-based form ({heavy: [FromB, ...]}) lands in M3
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

export: # export-ONLY half, consumed by `salt2 export` (design §5.1, §7); inert during fit/test
  model_name: GN2v2opendata # Athena name: no '_'/'-' (validated at export only)
  inputs:
    - { port: inputs.jets, name: jet_features } # [1, F] global
    - { port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks } # [L, F]
  # outputs: NONE — derived from the writers (M4.5 unified manifest): the
  # default TaskWriter declares GN2v2opendata_pb/_pc/_pu/_ptau (split_scalars
  # from the open-data 4-class head's class_names — reorder/extend the classes
  # and eval columns AND ONNX outputs move together), _TrackOrigin (argmax
  # int8) and _VertexIndex (vertex_union_find int8). Inspect with
  # `salt2 export --manifest` or `salt2 graph resolve [--annotate]`.

trainer:
  max_epochs: 40
  precision: 32-true # 16-mixed on GPU clusters (M6 follow-up)
