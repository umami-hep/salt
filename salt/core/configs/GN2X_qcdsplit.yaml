# GN2X with an on-the-fly QCD-split flavour labeller (7 classes,
# require_labels: False — unlabelled jets dropped, not raised). Three encoder
# streams: tracks + flow + truth_hadrons, feeding 3 task heads.

name: GN2X_qcdsplit

data:
  batch_size: 500
  num_workers: 20
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, truncate: 100}
          flow: {global_object: false, truncate: 100}
          truth_hadrons: {global_object: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt, eta]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
              leptonID,
            ]
          flow: [flow_pt, flow_energy, flow_deta, flow_dphi]
          truth_hadrons: [charge, pt, mass, energy, eta, phi, deta, dphi, dr, Lxy]
    labels:
      class_path: salt.core.data.Labels
      init_args:
        dtype_policy: int64-for-int
    ftag_labeller:
      class_path: salt.core.data.FtagLabeller
      init_args:
        # qcdll stands in for qcdxx, which is absent from this container's
        # ftag Flavours catalogue. class_names must match
        # jets_classification.class_names index-for-index.
        stream: jets
        label: flavour_label
        require_labels: False
        class_names: [hbb, hcc, top, qcdbb, qcdbx, qcdcx, qcdll]

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 3.0e-4, end: 5.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks, flow, truth_hadrons]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: &embed_dim 256
          dense: {hidden_layers: [256], activation: ReLU}
      flow_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: flow
          context: [normed.jets]
          out_dim: *embed_dim # equal embed width is a Concat constraint
          dense: {hidden_layers: [256], activation: ReLU}
      # third stream: feeds encoder attention but has no task head, so it is
      # not split back out below.
      truth_hadrons_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: truth_hadrons
          context: [normed.jets]
          out_dim: *embed_dim
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks, flow, truth_hadrons]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 8
          num_registers: 8
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: ReLU, gated: true, dropout: 0.1}
      split:
        # only tracks has per-token tasks
        class_path: salt.core.nn.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [hbb, hcc, top, qcdbb, qcdbx, qcdcx, qcdll]
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.33
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          weight: 0.75
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink

export:
  model_name: GN2Xqcdsplit # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}
    - {port: inputs.flow, name: flow_features, sequence: true, dyn_axis: n_flow}
    - {port: inputs.truth_hadrons, name: truth_hadron_features, sequence: true, dyn_axis: n_truth_hadrons}

trainer:
  max_epochs: 20
  precision: 32-true
