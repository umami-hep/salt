# Thin overlay on GN3V00.yaml: switches the encoder to RMSNorm + hybrid norm
# placement (deep-merged onto GN3V00's encoder block; everything else
# inherited). Stack GN3V00.yaml first, then this overlay.

name: GN3_Hybrid

model:
  class_path: salt.core.SaltModule
  init_args:
    modules:
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          norm: RMSNorm
          norm_type: hybrid
