# nan_regression.yaml — NaN-tolerant RegressionTaskModule in the v2 schema (M5
# sub-wave A3). The v2-native port of legacy salt/configs/nan_regression.yaml:
# an encoder-less DiPS body (init_nets + pool_net, NO encoder — v1
# saltmodel.py:90-93) feeding pooled regression heads whose TARGETS may contain
# NaN. The composed v1 nan_loss masks invalid (NaN) targets to 0 and reduces
# with torch.nanmean (v1 task.py:412-437); a head that expects NaN targets MUST
# use loss reduction: none so the per-element loss survives to the nanmean.
#
#   - reg_nan_norm   : single-target mean/std norm_params, NaN-tolerant
#   - reg_nan_ratio  : target_denominators ratio + custom_output_names,
#                      NaN-tolerant; pt_btagJes is a declared input Feature
#                      (ONNX de-scaling source, FD §3.3)
#   - reg_nan_seq    : per-token sequence regression over tracks, NaN-tolerant
#
# NO machine paths committed (design §5 placeholder policy). From the REPO ROOT:
#   python -m salt.core.main graph validate -c salt/core/configs/nan_regression.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: nan_regression

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {vector: true}
          tracks: {vector: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks # requires normed.tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      reg_nan_norm:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelLxy
          custom_output_names: output_std_norm
          norm_params: {mean: 1.0, std: 1.0}
          # reduction: none keeps the per-element loss for the NaN mask + nanmean
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_nan_ratio:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelLxy
          target_denominators: pt_btagJes # a declared input Feature (ONNX source)
          custom_output_names: output_ratio
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_nan_seq:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: tracks # per-token sequence regression (reads seq.x)
          input: seq.x
          sequence: true
          targets: dphi
          custom_output_names: dummyOutput_dPhi
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

writers:
  modules:
    # a per-token (tracks) head needs the pad-mask column; keep the base2.yaml
    # pad_mask writer. TaskWriter columns: <run>_<suffix> f4 per target.
    pad_mask:
      class_path: salt.core.writers.PadMaskWriter

export: # export-ONLY half (design §5.1, §7); inert during fit/test
  model_name: nanRegression # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features} # [1, F] global
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks} # [L, F]
  # outputs: NONE — derived from the writers (M4.5 unified manifest).

trainer:
  max_epochs: 2
