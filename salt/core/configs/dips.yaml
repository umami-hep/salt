# dips.yaml — DiPS / DeepSets in the v2 schema: init_nets + pool_net, NO
# encoder (design §5.1; v1 saltmodel.py:90-93,155-156). The v2-native port of
# the legacy CI smoke fixture salt/configs/legacy/dips.yaml (test_pipeline.py)
# and the shape every M5 regression config shares (encoder-less pooling).
#
# A single track stream is embedded, concatenated to one sequence (the v2
# analogue of v1 `flatten_tensor_dict(xs)`), then globally attention-pooled —
# the pool's `masks.registers` require is OPTIONAL, so with no encoder
# producing it the config plan-compiles (M5 encoder-less pooling). No `Split`
# and no track-stream tasks: the only head is the jet classifier, exactly the
# legacy fixture.
#
# NO machine paths are committed (design §5 placeholder policy). From the REPO
# ROOT (use `python -m salt.core.main` when the salt2 script is not installed):
#
#   salt2 fit --config salt/core/configs/dips.yaml \
#     --data.train_file /path/to/pp_output_train.h5 \
#     --data.val_file   /path/to/pp_output_train.h5 \
#     --model.modules.norm.init_args.norm_dict /path/to/norm_dict.yaml
#
# Static validation (no data) supplies required init_args data-free:
#   python -m salt.core.main graph validate -c salt/core/configs/dips.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: dips

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {vector: true}
          tracks: {vector: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs_config: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks # requires normed.tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: HadronConeExclTruthLabelID
          class_names: [ujets, cjets, bjets]
          dense: {hidden_layers: [128, 64, 32], activation: SiLU, dropout: 0.1}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

writers:
  modules:
    # DiPS has no sequence-stream task, so there is no pad mask to write —
    # delete the base2.yaml default (design §5.3 null-deletion). InputCopyWriter
    # and TaskWriter keep their jets-stream roles.
    pad_mask: null

export: # export-ONLY half, consumed by `salt2 export` (design §5.1, §7); inert during fit/test
  model_name: dips # Athena name: no '_'/'-' (validated at export only)
  inputs:
    - { port: inputs.jets, name: jet_features } # [1, F] global
    - { port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks } # [L, F]
  # outputs: NONE — derived from the writers (M4.5 unified manifest): the
  # default TaskWriter declares dips_pu/_pc/_pb (split_scalars from the head's
  # class_names). Inspect with `salt2 graph resolve -c <this file>`.

trainer:
  max_epochs: 2
