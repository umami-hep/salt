# Overlay on gn2v2-dummy.yaml: demonstrates the folded ONNX export path — a
# ClassProbs softmax, a SeqClassIndex argmax, and a Combination (pbc = pb+pc)
# minted in-graph and named by a declare-only OnnxExportSink, instead of an
# off-graph reduce manifest. Stack as:
#   salt2 graph plot --config gn2v2-dummy.yaml --config gn2v2-dummy-onnx-fold.yaml --mode onnx

model:
  modules:
    track_vertexing:
      class_path: salt.core.nn.tasks.VertexingTaskModule
      init_args:
        stream: tracks
        label: ftagTruthVertexIndex
        origin_label: ftagTruthOriginLabel
        context: pooled.global
        weight: 1.5
        dense: { hidden_layers: [16], activation: ReLU }
        expose: [fit, val] # opts vertexing out of ONNX here (no VertexIndex)
    # opts vertexing out of ONNX entirely, to demo the pbc Combination instead
    track_vertex_index: null
    jet_probs:
      class_path: salt.core.outputs.ClassProbs
      init_args: { task: jets_classification, stream: jets }
    # distinct leaf name: the base's track_origin_probs (SeqClassProbs, the TEST
    # H5 producer) already owns outputs.tracks.track_origin — the ONNX argmax
    # writes its own leaf so the two producers never collide
    track_origin_index:
      class_path: salt.core.outputs.SeqClassIndex
      init_args: { task: track_origin, stream: tracks, name: track_origin_index }
    pbc:
      class_path: salt.core.outputs.Combination
      init_args:
        source: outputs.jets.jets_classification
        name: pbc
        terms: { 0: 1.0, 1: 1.0 } # pbc = pb + pc

callbacks:
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink
    init_args:
      outputs:
        - { key: outputs.jets.jets_classification, names: [pb, pc, pu] }
        - { key: outputs.jets.pbc, name: pbc }
        - { key: outputs.tracks.track_origin_index, name: TrackOrigin, dtype: int8, per_token: true }
