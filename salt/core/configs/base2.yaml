# base2.yaml — salt v2 shared defaults (design §5, §5.3).
#
# Auto-loaded as a default config for every `salt2 fit` / `salt2 test`
# invocation (the v1 base.yaml mechanism, salt/core/main.py). Stacked user
# configs deep-merge on top: dict-typed sections (model.init_args.modules,
# data.modules, callbacks, writers) merge key-by-key, an entry set to null is
# deleted (DeepMergeParser + assembly-time filtering, design §5.3).

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  # Experiment loggers (Comet) are wired in M6 — design §5 keeps the v1
  # comet-before-lightning import order in salt/core/main.py meanwhile.
  logger: false
  log_every_n_steps: 50
  # The raw trainer.callbacks list is reserved for STOCK Lightning callbacks
  # only; salt callbacks belong in the top-level callbacks: dict below, whose
  # entries deep-merge across config files (design §5.3).

# Dict-keyed, deep-mergeable callback defaults (design §5.3): override one key
# (--callbacks.checkpoint.init_args.monitor_loss=...), add an entry from any
# config file, or delete one with `checkpoint: null`. Assembled into
# trainer.callbacks ahead of any stock list entries. The
# salt.core.callbacks.Checkpoint port (M5 sub-wave D) writes a checkpoint per
# epoch into <log_dir>/ckpts/ with the 'loss=' filename stem the salt2-test
# best-epoch glob keys on (per-task monitor via monitor_loss, design §5.3). The
# salt.core.callbacks.ProgressBar port (M5) is the stock TQDMProgressBar under
# a salt-owned name. The design §5.3 lr_monitor entry is STILL deferred:
# LearningRateMonitor needs a logger (Comet wiring is M6).
callbacks:
  checkpoint:
    class_path: salt.core.callbacks.Checkpoint
    init_args:
      # monitor_loss is BOTH the monitored metric and the filename loss tag;
      # the resulting stem 'epoch=NNN-loss=<val/loss>.ckpt' under ckpts/ is the
      # salt2-test no-ckpt_path fallback contract (salt/core/main.py
      # _best_checkpoint; v1 utils/cli.py:55-79) — keep the Checkpoint default
      # fname_string ('loss') and that glob in sync.
      monitor_loss: val/loss
  progress:
    class_path: salt.core.callbacks.ProgressBar
    init_args:
      refresh_rate: 50
  model_summary:
    class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
      max_depth: 2
  # design §4.4 run-dir artifacts: plan_<mode>.txt + graph_<stage>.{dot,svg}
  # written into the trainer log dir at fit/test start. Default-on; delete
  # with `artifacts: null`.
  artifacts:
    class_path: salt.core.callbacks.GraphArtifacts

# Prediction writers (design §8): assembled into ONE WriterCallback that owns
# the single eval H5 file ({ckpt_dir}/{ckpt_stem}__test_{sample}.h5, the v1
# path contract). The modules dict deep-merges across config files; an entry
# set to null is deleted (--writers.modules.pad_mask=null). Module ORDER is
# the per-group COLUMN order — inputs_copy -> tasks -> pad_mask reproduces the
# v1 PredictionWriter layout (input copies, task columns in model declaration
# order, the boolean mask last). TaskWriter/InputCopyWriter default to "every
# stream with a configured task" (v1 derive-from-the-model), so a new aux task
# is persisted automatically; narrowing TaskWriter streams trips the TEST
# dead-preds hard error for any prediction no writer consumes (design §4.2).
#
# M4.5 unified manifest: the writers are ALSO the ONNX output manifest —
# TaskWriter (onnx: true by default) declares the export outputs from the
# SAME task declarations that name the eval columns, so a new aux task lands
# in eval AND export with zero extra config (narrow with onnx/onnx_streams/
# onnx_tasks, rename with onnx_names). InputCopyWriter/PadMaskWriter are
# eval-only by design. Inspect the assembled manifest with
# `salt2 export --manifest` or `salt2 graph resolve [--annotate]`.
writers:
  output: "{ckpt_dir}/{ckpt_stem}__test_{sample}.h5"
  half_precision: false
  modules:
    inputs_copy: {class_path: salt.core.writers.InputCopyWriter}
    tasks: {class_path: salt.core.writers.TaskWriter}
    pad_mask: {class_path: salt.core.writers.PadMaskWriter}
