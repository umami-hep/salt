# Shared defaults auto-loaded for every `salt2 fit` / `salt2 test` invocation.
# Stacked user configs deep-merge on top: dict-typed sections merge key-by-key,
# an entry set to null is deleted. Ships trainer/callbacks only — no
# persistence layer; every model config must define its own `outputs:` section
# + H5OutputSink/OnnxExportSink callbacks.

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  # to disable tracking (local runs, CI/smoke fixtures), set
  # --trainer.logger false; `salt2 test` always forces logger=False.
  logger:
    class_path: lightning.pytorch.loggers.comet.CometLogger
    init_args: {project: salt}
  log_every_n_steps: 50
  # trainer.callbacks is reserved for stock Lightning callbacks only; salt
  # callbacks belong in the callbacks: dict below.

callbacks:
  checkpoint:
    class_path: salt.core.callbacks.Checkpoint
    init_args:
      # also the filename loss tag ('epoch=NNN-loss=<val/loss>.ckpt') that the
      # salt2-test no-ckpt_path fallback globs on — keep in sync with any
      # fname_string override.
      monitor_loss: val/loss
  progress:
    class_path: salt.core.callbacks.ProgressBar
    init_args:
      refresh_rate: 50
  # dropped automatically when no logger is attached (LearningRateMonitor
  # hard-raises on a logger-less trainer); delete explicitly with `lr_monitor: null`.
  lr_monitor:
    class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
  model_summary:
    class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
      max_depth: 2
  # writes plan_<mode>.txt + graph_<stage>.{dot,svg} into the trainer log dir
  # at fit/test start. Delete with `artifacts: null`.
  artifacts:
    class_path: salt.core.callbacks.GraphArtifacts
