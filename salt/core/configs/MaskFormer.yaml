# MaskFormer.yaml — the MaskFormer vertexing tagger in the v2 schema (M5-CONV,
# the flagship MaskFormer M5 config). The v2-native MIGRATED fixture for the
# legacy top-level salt/configs/MaskFormer.yaml.
#
# Queries -> truth hadrons: a single `tracks` constituent stream is embedded,
# run through a `TransformerEncoder` with `drop_registers: true` (registers
# visible to attention, stripped from `encoded.seq`; v1 MaskFormer.yaml:31), and
# decoded by a `MaskDecoder` (5 learnable object queries -> b/c/null class +
# per-track mask). The matched bundle:
#   - MaskDecoder           -> objects.{embed,class_logits,class_probs,masks}
#   - regression            -> preds.objects.regression (5-target, scaled by
#                              RegressionTargetScaler) + (FIT|VAL) the scaled
#                              targets.objects.regression for matching (FD §5.2)
#   - MaskFormerMatchedLoss -> matched.objects.* + losses.{object_class_ce,
#                              mask_dice, mask_ce, regression} (FIT|VAL only;
#                              the SINGLE owner of the object-class CE + mask +
#                              matched-regression losses, FD 1139,1158-1171)
#   - MaskFormerTargets     -> labels.objects.{object_class,masks} + raw
#                              regression labels (demand-gated, all modes; the
#                              object writer keeps it alive in TEST)
#   - MaskFormerObjectWriter-> TEST class probs + MaskIndex + object_masks group;
#                              ONNX preds.objects.regression -> leading_object (5
#                              suffixes) + objects.masks -> object_index (int8
#                              HadronIndex). MaskformerMetrics consumes matched.*
#
# `aux_loss: false` (v1 MaskFormer.yaml:39) — the §10 deep-supervision parking
# does NOT block this config.
#
# NOTE — the v1 architecture pools encoded.seq + objects.embed jointly
# (NodeQueryGAP, FD 1172-1174) for the jets_classification head; that joint pool
# is an M6 module (NodeQueryGAP is not in salt.core today), so this config pools
# encoded.seq alone for the jet head. The MaskFormer M5 deliverable is the
# decoder + matched loss + targets + object writer + metrics bundle, all of which
# this config exercises.
#
# NO machine paths committed (design §5 placeholder policy). Static validation
# (no data) FROM THE REPO ROOT (use `python -m salt.core.main`):
#   python -m salt.core.main graph validate --mode fit  -c salt/core/configs/MaskFormer.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml
#   python -m salt.core.main graph validate --mode test -c salt/core/configs/MaskFormer.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml
#   python -m salt.core.main graph validate --mode onnx -c salt/core/configs/MaskFormer.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: MaskFormer

data:
  batch_size: 4000
  num_workers: 40
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {vector: true}
          tracks: {vector: false}
          # the truth-hadron object group (v1 mf_config.object.name) the
          # MaskFormerTargets processor reads to build object_class + masks
          truth_hadrons: {vector: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}
    # the MaskFormer object targets (v1 mf_config, MaskFormer.yaml:164-181):
    # truth_hadrons -> labels.objects.{object_class,masks} + raw regression
    # labels; demand-gated (the object writer keeps it alive in TEST, FD 1090)
    mf_targets:
      class_path: salt.core.data.MaskFormerTargets
      init_args:
        object_stream: truth_hadrons # v1 object.name
        object_class: flavour # v1 object.class_label
        object_id: barcode # v1 object.id_label
        constituent_stream: tracks # v1 constituent.name
        constituent_id: ftagTruthParentBarcode # v1 constituent.id_label
        num_objects: 5 # == the decoder query bank
        # v1 object.object_classes -> {name: {raw, mapped}}, null LAST. The
        # null class key is quoted "null" (an unquoted YAML null: would parse to
        # a Python None key — MaskFormerTargets accepts both, but the string is
        # explicit; v1 MaskFormer.yaml:176)
        class_map:
          b: {raw: 5, mapped: 0}
          c: {raw: 4, mapped: 1}
          "null": {raw: -1, mapped: 2}
        # the per-object regression labels the object_regression head stacks +
        # scales (v1 RegressionTask reads labels["objects"][target])
        regression_targets: [pt, Lxy, deta, dphi, mass]

model:
  class_path: salt.core.SaltModule
  init_args:
    # v1 `lrs_config:` block (renamed to `lrs` in M5 sub-wave D)
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks # requires normed.tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: &embed_dim 256
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: *embed_dim
          num_layers: 4 # v1 MaskFormer.yaml:25
          attention: {num_heads: 8, attn_type: torch-math} # flash-varlen: M6
          dense: {activation: ReLU, gated: false}
          # registers visible to encoder attention, stripped from encoded.seq
          # (v1 MaskFormer.yaml:31 drop_registers: true; FD 1121-1125)
          num_registers: 1 # v1 MaskFormer sets none -> TransformerEncoder default 1 (transformer.py:559)
          drop_registers: true
      mask_decoder:
        class_path: salt.core.nn.MaskDecoder
        init_args:
          input: encoded.seq # register-free encoder output
          embed_dim: *embed_dim
          num_objects: 5 # v1 MaskFormer.yaml:36
          num_layers: 3 # v1 MaskFormer.yaml:38
          # v1 md_config (MaskFormer.yaml:40-43)
          md: {n_heads: 8, mask_attention: true, bidirectional_ca: true}
          class_net: {output_size: 3} # b, c, null — null LAST (v1 :49)
          mask_net: {} # Dense(embed_dim, embed_dim) (v1 :51-55)
      # the object-regression head — INSTANCE NAME `regression` so its port is
      # `preds.objects.regression` (v1 RegressionTask name: regression,
      # MaskFormer.yaml:88), the exact key the matched loss + object writer read.
      regression:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: objects
          input: objects.embed # the decoder query embeddings (per-object)
          sequence: true # per-object (M queries) regression
          targets: [pt, Lxy, deta, dphi, mass] # v1 MaskFormer.yaml:89
          # the RegressionTargetScaler per-target functional scaling (v1
          # MaskFormer.yaml:92-112; design §5.2 scaler)
          scaler:
            pt: {op: log, op_scale: 0.2}
            Lxy: {op: log, x_off: 1}
            deta: {op: linear, x_off: 1, op_scale: 10}
            dphi: {op: linear, x_off: 1, op_scale: 10}
            mass: {op: log, op_scale: 0.1}
          weight: 0.5 # v1 MaskFormer.yaml:90
          # v1 L1Loss reduction:none (MaskFormer.yaml:113-116); the matched loss
          # owns the object-regression loss component, but the head still
          # publishes preds.objects.regression + the scaled targets for matching
          loss: {class_path: torch.nn.L1Loss, init_args: {reduction: none}}
          # publish targets.objects.regression (the SCALED targets) in FIT|VAL so
          # the matched loss matcher uses them as a cost term (v1 stores
          # task.get_targets(labels) in labels["objects"][name],
          # maskformer_loss.py:329-332)
          publish_targets: true
          # expose preds.objects.regression in FIT|VAL (matched loss) + ONNX (the
          # object writer's leading_object reduce) but NOT TEST: v1 does NOT write
          # the object-regression predictions in eval (predictionwriter.py:241
          # skips objects-stream tasks; only class_probs/MaskIndex/masks are
          # written), so a TEST pred here would be an unconsumed dead-pred
          expose: [fit, val, onnx]
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      mf_matched_loss:
        class_path: salt.core.nn.MaskFormerMatchedLoss # FIT|VAL only
        init_args:
          num_classes: 2 # non-null classes (b, c); v1 loss_config.num_classes
          num_objects: 5 # == the decoder query bank M
          null_class_weight: 0.5
          # v1 loss_config.loss_weights (MaskFormer.yaml:58-63): the shipped v1
          # config uses mask_ce (binary cross-entropy, mask_ce_loss,
          # maskformer_loss.py:42,225-226), NOT mask_focal (sigmoid_focal_loss,
          # :67,223-224) — they are different loss functions; mask_ce is faithful
          loss_weights: {object_class_ce: 2.0, mask_ce: 10.0, mask_dice: 2.0, regression: 2.0}
      # split the (register-free) encoded.seq back into per-stream tensors so the
      # track_origin head reads encoded.tracks (design §3.3 production split path)
      split:
        class_path: salt.core.nn.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, ujets] # v1 output_size 3
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5 # v1 MaskFormer.yaml:127
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

writers:
  modules:
    inputs_copy: {class_path: salt.core.writers.InputCopyWriter}
    # the jet + track tasks ONLY — the object-class/mask/regression are owned by
    # the object writer + matched loss, NOT the TaskWriter. Narrow to jets+tracks
    # so the objects-stream regression head's preds.objects.regression is the
    # object writer's export port alone (no two-writer ONNX-port collision)
    tasks:
      class_path: salt.core.writers.TaskWriter
      init_args: {streams: [jets, tracks]}
    pad_mask: {class_path: salt.core.writers.PadMaskWriter}
    # the MaskFormer object writer (AM §3; FD 1186-1213): TEST class probs +
    # MaskIndex + object_masks group; ONNX leading_object + object_index reduces
    object_writer:
      class_path: salt.core.writers.MaskFormerObjectWriter
      init_args:
        object_classes: [b, c, "null"] # null LAST (v1 object.class_names; quoted string)
        object_stream: objects
        constituent_stream: tracks
        regression_task: regression # the leading_object ONNX source (preds.objects.regression)

callbacks:
  # MaskformerMetrics consumes matched.objects.* -> a FIT/VAL graph sink (FD
  # 1200-1202; keeps the matched loss alive under pruning)
  maskformer_metrics:
    class_path: salt.core.callbacks.MaskformerMetrics

export: # export-ONLY half (design §5.1, §7); inert during fit/test
  model_name: MFv2 # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features} # [1, F] global
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks} # [L, F]
  # outputs: NONE — derived from the writers (M4.5 unified manifest): the
  # TaskWriter declares MFv2_pb/_pc/_pu (jet flavour) + _TrackOrigin, and the
  # MaskFormerObjectWriter declares the leading_object 5 suffixes (from
  # preds.objects.regression) + object_index (HadronIndex int8, from
  # objects.masks). Inspect with `salt2 graph resolve -c <this file>`.

trainer:
  max_epochs: 40
