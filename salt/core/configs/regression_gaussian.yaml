# regression_gaussian.yaml — the gaussian RegressionTaskModule in the v2 schema
# (M5 sub-wave A3). The v2-native port of legacy salt/configs/regression_gaussian.yaml:
# an encoder-less DiPS body (init_nets + pool_net, NO encoder — v1
# saltmodel.py:90-93) feeding pooled GAUSSIAN regression heads (mu/sigma,
# output == 2 x targets, softplus variance, Gaussian NLL; v1 task.py:645). Two
# heads exercise the family surface:
#
#   - gaussian_regression                   : global head, mean/std norm_params
#                                             (v1 regression_gaussian.yaml:23)
#   - gaussian_regression_no_global_object  : per-token sequence head over tracks,
#                                             custom_output_names (v1 :37)
#
# Each head publishes ONE [B, 2R] (or [B, L, 2R]) array: the R means then the R
# stddevs (FD 1567-1568 one-array contract); the TaskWriter owns the `_stddev`
# suffix split. The ONNX stddev representation is the M4.5 deferral-(b)
# design-conformance (stddev = sqrt(softplus(var)) traced in-graph) — there is
# NO v1 ONNX golden (v1 onnx/to_onnx.py has zero gaussian handling).
#
# NO machine paths committed (design §5 placeholder policy). From the REPO ROOT:
#   python -m salt.core.main graph validate -c salt/core/configs/regression_gaussian.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: regression_gaussian

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {vector: true}
          tracks: {vector: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs_config: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks # requires normed.tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      gaussian_regression:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          gaussian: true # mu/sigma head, output_size == 2 (v1 task.py:645)
          targets: HadronConeExclTruthLabelPt
          norm_params: {mean: 1.0, std: 1.0}
          loss: GaussianNLLLoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      gaussian_regression_no_global_object:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: tracks # per-token sequence regression (reads seq.x)
          input: seq.x
          sequence: true
          gaussian: true
          targets: dphi
          custom_output_names: dummyOutput_dPhi
          norm_params: {mean: 1.0, std: 1.0}
          loss: GaussianNLLLoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule

writers:
  modules:
    # a per-token (tracks) gaussian head needs the pad-mask column; keep the
    # base2.yaml pad_mask writer. TaskWriter columns: <run>_<suffix> f4 per
    # output (R means + R _stddev per head).
    pad_mask:
      class_path: salt.core.writers.PadMaskWriter

export: # export-ONLY half (design §5.1, §7); inert during fit/test
  model_name: regressionGaussian # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features} # [1, F] global
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks} # [L, F]
  # outputs: NONE — derived from the writers (M4.5 unified manifest): the
  # default TaskWriter declares regressionGaussian_HadronConeExclTruthLabelPt +
  # _stddev (split_scalars) and the per-token dummyOutput_dPhi + _stddev. The
  # stddev = sqrt(softplus(var)) is traced in-graph (design-conformance, no v1
  # ONNX golden). Inspect with `salt2 graph resolve -c <this file>`.

trainer:
  max_epochs: 2
