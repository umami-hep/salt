# Hitz: HLT hits-based primary-vertex-z GaussianRegressionTask. A single
# `hits` constituent stream is embedded, encoded, globally pooled, and fed to
# a Gaussian regression head predicting TruthJetPVz (mean + softplus stddev).

name: Hitz

data:
  batch_size: 128
  num_workers: 4
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          hits: {global_object: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt, eta]
          hits: [layer, j, a, b]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-4, max: 1.0e-3, end: 1.0e-7, pct_start: 0.2}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, hits]
          global_object: jets
      hits_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: hits
          context: [normed.jets]
          out_dim: &embed_dim 32
          dense: {hidden_layers: [128, 128, 128], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [hits]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 6
          attention: {num_heads: 2, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      gaussian_regression:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          gaussian: true # mu/sigma head, output_size == 2
          targets: TruthJetPVz
          norm_params: {mean: 0.0, std: 37.81209182739258}
          loss: GaussianNLLLoss
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args: {tasks: [gaussian_regression]}

callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink

export:
  model_name: Hitz # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.hits, name: hit_features, sequence: true, dyn_axis: n_hits}

trainer:
  max_epochs: 100
  precision: 16-mixed
