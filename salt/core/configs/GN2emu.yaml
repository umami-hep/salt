# GN2emu: GN2 with two embedded streams (tracks + electrons) plus a 14-var
# soft-muon 'global' vector fed past the encoder and concatenated onto the
# pooled representation. FIT/TEST-only — no valid ONNX representation exists
# for the soft-muon global vector (see note above trainer: below).

name: GN2emu

data:
  batch_size: 1000
  num_workers: 40
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
          electrons: {global_object: false}
          # soft-muon vector stream: an ordinary [B, F] vector, no pad mask
          global: {global_object: true}
    features:
      class_path: salt.core.data.Features
      init_args:
        non_finite_to_num: true
        variables:
          jets: [pt_btagJes, eta_btagJes]
          global:
            [
              softMuon_pt,
              softMuon_dR,
              softMuon_eta,
              softMuon_phi,
              softMuon_qOverPratio,
              softMuon_momentumBalanceSignificance,
              softMuon_scatteringNeighbourSignificance,
              softMuon_pTrel,
              softMuon_ip3dD0,
              softMuon_ip3dZ0,
              softMuon_ip3dD0Significance,
              softMuon_ip3dZ0Significance,
              softMuon_ip3dD0Uncertainty,
              softMuon_ip3dZ0Uncertainty,
            ]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
          electrons:
            [
              pt,
              ptfrac,
              ptrel,
              dr,
              abs_eta,
              eta,
              phi,
              ftag_et,
              qOverP,
              d0RelativeToBeamspotSignificance,
              ftag_z0AlongBeamspotSignificance,
              ftag_ptVarCone30OverPt,
              numberOfPixelHits,
              numberOfSCTHitsInclDead,
              ftag_deltaPOverP,
              eProbabilityHT,
              deltaEta1,
              deltaPhiRescaled2,
              ftag_energyOverP,
              Rhad,
              Rhad1,
              Eratio,
              weta2,
              Rphi,
              Reta,
              wtots1,
              f1,
              f3,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks, electrons]
          global_object: jets
      # second normaliser: 'global' needs its own global_object slot (jets
      # already fills the one on `norm` above)
      norm_global:
        class_path: salt.core.nn.Normaliser
        init_args:
          streams: [global]
          global_object: global
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: &embed_dim 192
          dense: {hidden_layers: [256], activation: SiLU}
      electron_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: electrons
          context: [normed.jets]
          out_dim: *embed_dim # equal embed width is a Concat constraint
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks, electrons]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 6
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: SiLU, gated: false}
      split:
        # both tracks and electrons carry per-token tasks (origin + vertexing)
        class_path: salt.core.nn.Split
        init_args: {streams: [tracks, electrons]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      # order matters: pooled rep first, global features last — every task
      # below reads this augmented vconcat.global.
      vconcat:
        class_path: salt.core.nn.VectorConcat
        init_args:
          inputs: [pooled.global, normed.global]
          out: vconcat.global
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: vconcat.global
          label: flavour_label
          class_names: [bjets, cjets, ujets]
          dense: {hidden_layers: [128, 64, 32], activation: SiLU, dropout: 0.1}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: vconcat.global
          label: ftagTruthOriginLabel
          class_names: &origin_classes
            [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          dense: {hidden_layers: [128, 64, 32], activation: SiLU, dropout: 0.1}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: vconcat.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: SiLU, dropout: 0.1}
      electron_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: electrons
          context: vconcat.global
          label: ftagTruthOriginLabel
          class_names: *origin_classes
          weight: 0.5
          dense: {hidden_layers: [128, 64, 32], activation: SiLU, dropout: 0.1}
      electron_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: electrons
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: vconcat.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: SiLU, dropout: 0.1}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks, electrons]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing, electron_origin, electron_vertexing]
      modes: [test]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks, electrons]}

# no export: block — the soft-muon 'global' has no same-width Athena source
# to alias from (v1's clone-from-global_object trick only works when global
# matches jets' width, which it doesn't here), so GN2emu is not
# export-representable.

trainer:
  max_epochs: 40
