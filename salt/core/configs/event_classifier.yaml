# event_classifier.yaml — the HH ggF-vs-VBF event classifier + truth-mHH
# regression in the v2 schema (M5-CONV, event-level family). The v2-native
# MIGRATED fixture for the legacy top-level salt/configs/event_classifier.yaml.
#
# An EVENT-level model: the per-event reconstructed objects (`objects` — jets,
# leptons, ...) are embedded (init_nets, attach_global:false in v1 since the
# global object is `events`), run through a `TransformerEncoder` (v1
# event_classifier.yaml:22-36), globally attention-pooled, and fed to TWO heads
# on the `events` global stream:
#
#   - events_classification : ggF-vs-VBF 2-class flavour head (signalType label)
#   - mHH_regression        : truth-mHH ratio regression (truthMHH / mHH)
#
# THE M5 HEADLINE FEATURE — TEST de-scaling from a NON-feature label (design
# §3.3 fallback; matrix event_classifier row). The ratio denominator `mHH` is
# NOT a declared input Feature (the events stream carries [mBB] only,
# event_classifier.yaml:82-83), so:
#   - FIT|VAL : the head trains in ratio space (truthMHH / labels.events.mHH).
#   - TEST    : `run_inference` de-scales by reading labels.events.mHH (v1
#               get_h5 reads labels[input_name][denom], task.py:587-589) — the
#               §3.3 non-feature fallback this config is the canonical example of.
#   - ONNX    : a ratio denominator MUST be a declared input Feature (the export
#               graph has no label source; to_onnx.py:381-398). `mHH` is NOT a
#               feature here, so this head has NO ONNX export representation — v1
#               likewise never exported event_classifier to ONNX (it is an
#               event-level analysis model, not an Athena tagger). The config is
#               therefore validated fit + test ONLY; there is no `export:` block
#               (no Athena model_name, no positional inputs) — `salt2 graph
#               validate --mode onnx` would have nothing to trace and the
#               non-feature denominator would (correctly) fail an onnx bind.
#
# NO machine paths committed (design §5 placeholder policy). Static validation
# (no data) FROM THE REPO ROOT (use `python -m salt.core.main`):
#   python -m salt.core.main graph validate --mode fit -c salt/core/configs/event_classifier.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml
#   python -m salt.core.main graph validate --mode test -c salt/core/configs/event_classifier.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: event_classifier

data:
  batch_size: 1000
  num_workers: 4
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          # the global object is `events` (v1 global_object: events); the
          # reconstructed `objects` are the constituent sequence (v1 input_map:
          # events -> event_vars, objects -> objects_vars)
          events: {global_object: true, dataset: event_vars}
          objects: {global_object: false, dataset: objects_vars}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          # NB: `mHH` is deliberately NOT here — it is the ratio denominator the
          # mHH_regression head sources from labels.events.mHH in TEST (§3.3)
          events: [mBB]
          objects: [type, pt, eta, phi, mass, btag, tauId]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    # v1 `lrs_config:` block (renamed to `lrs` in M5 sub-wave D)
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [events, objects]
          global_object: events
      object_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: objects # requires normed.objects
          # v1 attach_global: false -> NO global context attached (the global
          # object is `events`, which is the regression/classification stream,
          # not a context for the object embedding; event_classifier.yaml:16)
          out_dim: &embed_dim 64
          dense: {hidden_layers: [256, 128, 64], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask
        init_args: {streams: [objects]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 6 # v1 event_classifier.yaml:25
          attention: {num_heads: 4, attn_type: torch-math} # flash-varlen: M6
          dense: {activation: ReLU, gated: false}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      events_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: events
          input: pooled.global
          label: signalType
          class_names: [ggF, VBF] # v1 event_classifier.yaml:51
          dense: {hidden_layers: [128, 64, 32], activation: ReLU, dropout: 0.1}
      mHH_regression:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: events
          input: pooled.global
          targets: truthMHH
          # the §3.3 fallback denominator: mHH is NOT an input Feature, so TEST
          # de-scaling reads labels.events.mHH (v1 task.py:587-589)
          target_denominators: mHH
          # v1 MSELoss reduction:none (event_classifier.yaml:67-68)
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule
      # plan-29 W5.2 conversion producers (design §6.2): mint outputs.* leaves the
      # auto-collect H5OutputSink discovers (event_classifier has NO ONNX export —
      # there is no OnnxExportSink, so these feed TEST H5 only). Demand-pruned from
      # FIT/VAL (FIT plan_hash unchanged).
      events_probs:
        class_path: salt.core.outputs.ClassProbs
        init_args: { task: events_classification, stream: events }
      # plan 34 W34.3: RegressionTaskModule.forward now publishes RAW (scaled) preds
      # in TEST/ONNX (the atomic forward-flip), so this is a REAL Regression
      # (RegressionDescaleOp) producer — it de-scales the raw preds back to physical
      # values, matching the legacy WriterCallback. The mHH ratio denominator is a
      # LABEL (not an input Feature) so TEST de-scaling reads labels.events.mHH
      # (v1 task.py:587-589); event_classifier has NO ONNX export. (Was an IDENTITY
      # TaskOutput passthrough pre-flip; the swap keeps de-scale running exactly ONCE.)
      mHH_reg_out:
        class_path: salt.core.outputs.Regression
        init_args:
          task: mHH_regression
          stream: events
          targets: truthMHH
          target_denominators: mHH

# plan-29 W5.2: the M4.5 WriterCallback (TaskWriter) is RETIRED for this config —
# the auto-collect H5OutputSink below is the live TEST persistence sink (the H5 side
# of the cutover). Null-merge deletes the base2.yaml default writers so the
# WriterCallback is not assembled.
writers:
  modules:
    inputs_copy: null
    tasks: null
    pad_mask: null

# plan-29 W5.2 auto-collect H5 sink (plan 31 §3.2): discovers the active conversion
# producers feeding the events stream (events_probs' pggF/pVBF + mHH_reg_out's
# de-scaled regression column) and assembles the eval H5 group from their
# output_columns() field manifest — no hand-listed columns. Both heads are on the
# GLOBAL `events` stream (no sequence-stream task), so write_pad_mask is false.
#
# NO export: block + NO OnnxExportSink — event_classifier is an event-level
# analysis model with a NON-feature ratio denominator (mHH), so it has no
# ONNX/Athena export representation (see the §3.3 ONNX note in the header).
# Validated fit + test only; there is no ONNX export sink to anchor onnx-mode demand.
callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
    init_args:
      collections: [events]
      copy_inputs: { events: [] }
      write_pad_mask: false

trainer:
  max_epochs: 30
