# regression.yaml — the RegressionTaskModule family in the v2 schema (M5
# sub-wave A). The v2-native port of the legacy salt/configs/regression.yaml:
# an encoder-less DiPS body (init_nets + pool_net, NO encoder — v1
# saltmodel.py:90-93, the shape EVERY regression config shares) feeding a
# pooled GLOBAL regression head. Three heads exercise the family surface:
#
#   - reg_normed     : mean/std norm_params, single target (v1 regression.yaml:23)
#   - reg_multinorm  : vector norm_params, two targets (v1 regression.yaml:36)
#   - reg_ratio      : target_denominators ratio + custom_output_names, with
#                      mode-split de-scaling (FD §3.3) — pt_btagJes is a declared
#                      input Feature, so the ONNX export graph can gather it by
#                      name; the v1 mHH case (event_classifier.yaml:65).
#
# NO machine paths are committed (design §5 placeholder policy). From the REPO
# ROOT (use `python -m salt.core.main` when the salt2 script is not installed):
#
#   salt2 fit --config salt/core/configs/regression.yaml \
#     --data.train_file /path/to/pp_output_train.h5 \
#     --data.val_file   /path/to/pp_output_train.h5 \
#     --model.modules.norm.init_args.norm_dict /path/to/norm_dict.yaml
#
# Static validation (no data) supplies required init_args data-free:
#   python -m salt.core.main graph validate -c salt/core/configs/regression.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: regression

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes, mass]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict: REQUIRED override (see header)
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks # requires normed.tracks
          context: [normed.jets] # v1 attach_global layout (design §9.2)
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      reg_normed:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          norm_params: {mean: 1.0, std: 1.0}
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_multinorm:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          norm_params: {mean: [1.0, 2.0], std: [3.0, 4.0]}
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_ratio:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          target_denominators: pt_btagJes # a declared input Feature (ONNX source)
          custom_output_names: pt
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_multiratio:
        # jets head, multi-output ratio norm (v1 regression.yaml:69
        # regression_multi_output_with_ratio_norm): two targets each divided
        # by a declared input Feature denominator (mass, pt_btagJes — both
        # ONNX-gatherable by name), with per-target custom_output_names.
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          target_denominators: [mass, pt_btagJes] # declared input Features (ONNX source)
          custom_output_names: [truthMass, truthPt]
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_seq_tracks:
        # per-token sequence head on the TRACKS stream (v1 regression.yaml:87
        # regression_multi_output_no_global_object). Encoder-less DiPS body has
        # no encoded.seq, so the per-token input is the StreamEmbed output
        # embed.tracks; sequence: true is set explicitly because the input is a
        # non-default key (inference would otherwise read it as global). PER F1b:
        # v1 has NO context_size on this head -> CONTEXT-FREE (no context key).
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: tracks
          input: embed.tracks # encoder-less per-token features (no pooled.global)
          sequence: true
          targets: [dphi, deta]
          custom_output_names: [dummyOutput_dPhi, dummyOutput_dEta]
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.core.nn.LossSum # losses.** narrowed by SaltModule
      # plan-29 W4 folded ONNX conversion producers (design §6.2): each regression
      # head's de-scaled ONNX prediction is published as an outputs.* leaf the
      # OnnxExportSink names; plan-29 W5.2 the auto-collect H5OutputSink ALSO collects
      # them (regression as an output this pass).
      #
      # W5 REGRESSION STOPGAP (plan 31 §5.2): these are IDENTITY TaskOutput passthroughs
      # because RegressionTaskModule.forward still DESCALES in TEST/ONNX (it is NOT
      # P1.5-flipped — the de-scale carve-out stays), so the identity passthrough emits
      # the already-DESCALED values = matches the legacy regression WriterCallback in
      # BOTH TEST H5 and ONNX. This MUST swap to a Regression (RegressionDescaleOp)
      # producer when RegressionTaskModule is later flipped to publish RAW targets (else
      # the identity passthrough would emit raw -> breaks both H5 and ONNX). Mirrors the
      # W2 identity-TaskOutput-before-P4 pattern.
      reg_normed_out: { class_path: salt.core.outputs.TaskOutput, init_args: { task: reg_normed, stream: jets } }
      reg_multinorm_out: { class_path: salt.core.outputs.TaskOutput, init_args: { task: reg_multinorm, stream: jets } }
      reg_ratio_out: { class_path: salt.core.outputs.TaskOutput, init_args: { task: reg_ratio, stream: jets } }
      reg_multiratio_out: { class_path: salt.core.outputs.TaskOutput, init_args: { task: reg_multiratio, stream: jets } }
      reg_seq_tracks_out: { class_path: salt.core.outputs.TaskOutput, init_args: { task: reg_seq_tracks, stream: tracks } }

# plan-29 W5.2: the M4.5 WriterCallback (TaskWriter) is RETIRED for this config — the
# auto-collect H5OutputSink below is the live TEST persistence sink. Null-merge deletes
# the base2.yaml default writers so the WriterCallback is not assembled.
writers:
  modules:
    inputs_copy: null
    tasks: null
    pad_mask: null

# plan-29 W4 declare-only ONNX sink (design §4.2): names the de-scaled regression
# leaves into the flat Athena output tuple, in v1/oracle ORDER (KEPT explicit — the
# ONNX side is unchanged from W4; the Athena physics names DIFFER from the H5 column
# names, so the explicit `names:` are the authority for the tuple).
# plan-29 W5.2 auto-collect H5 sink (plan 31 §3.2): discovers the regression identity
# producers (reg_*_out) and assembles the eval H5 groups from their output_columns()
# field manifest — the H5 columns are the task target/custom names ({run}_{suffix}),
# REPRODUCING the legacy regression WriterCallback schema EXACTLY (the pilot's
# hand-listed reg_normed/reg_multinorm_0 names DIVERGED from legacy and are replaced).
# H5 names per head: reg_normed -> HadronConeExclTruthLabelPt; reg_multinorm ->
# R10TruthLabel_R22v1_TruthJetMass/_TruthJetPt; reg_ratio -> pt; reg_multiratio ->
# truthMass/truthPt; reg_seq_tracks -> dummyOutput_dPhi/dEta (per-token).
callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
    init_args:
      collections: [jets, tracks]
      copy_inputs: {jets: [pt_btagJes, eta_btagJes, mass], tracks: [d0, z0SinTheta, dphi, deta, qOverP]}
      write_pad_mask: [tracks]
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink
    init_args:
      outputs:
        - { key: outputs.jets.reg_normed, names: [HadronConeExclTruthLabelPt] }
        - { key: outputs.jets.reg_multinorm, names: [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt] }
        - { key: outputs.jets.reg_ratio, names: [pt] }
        - { key: outputs.jets.reg_multiratio, names: [truthMass, truthPt] }
        - { key: outputs.tracks.reg_seq_tracks, names: [dummyOutput_dPhi, dummyOutput_dEta] }

export: # export-ONLY half, consumed by `salt2 export` (design §5.1, §7); inert during fit/test
  model_name: regression # Athena name: no '_'/'-' (validated at export only)
  inputs:
    - {port: inputs.jets, name: jet_features} # [1, F] global
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks} # [L, F]

trainer:
  max_epochs: 2
