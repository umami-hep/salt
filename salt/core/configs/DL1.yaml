# DL1: the simplest salt model. A single per-jet global feature vector -> a
# 3-layer MLP -> a 3-class flavour head. No constituents, no encoder, no pool.

name: DL1

data:
  batch_size: 2000
  num_workers: 15
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          # the only stream: a per-jet global vector (rank-2 [B, F], no pad mask)
          jets: {global_object: true}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets]
          global_object: jets
      # rank inferred from the bound input: normed.jets [B, F] -> embed.jets
      # [B, D] (no token axis, no context — the jets vector IS the global object).
      jets_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: jets
          out_dim: 64
          dense: {hidden_layers: [128, 128, 128], activation: Mish}
      # consumes embed.jets [B, D] directly (sequence: false) — no Concat,
      # encoder, Split, or pooling in between.
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: embed.jets
          sequence: false # [B, D] -> [B, n_classes] (vector head, not per-token)
          label: flavour_label
          class_names: [bjets, cjets, ujets]
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128], activation: Mish}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args: {tasks: [jets_classification]}

callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink

export:
  model_name: DL1 # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}

trainer:
  max_epochs: 100
  precision: 32-true
