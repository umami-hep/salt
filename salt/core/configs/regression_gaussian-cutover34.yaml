# Overlay on regression_gaussian.yaml: switches the eval path for its global +
# per-token gaussian heads to the get_output()-on-task + outputs:-section +
# dumb-sink architecture. Stack as:
#   salt2 test --config regression_gaussian.yaml --config regression_gaussian-cutover34.yaml ...

model:
  modules:
    # drop the old gaussian Regression producers — get_output on the task replaces them
    gaussian_out: null
    gaussian_seq_out: null

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args:
      streams: [jets, tracks]
      variables:
        jets: []
        tracks: []
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [gaussian_regression, gaussian_regression_no_global_object]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink
