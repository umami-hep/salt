# GN2XE — GN2X (Xbb 4-class tagger) with pairwise edge features injected into
# the transformer attention. Edge tensors are built on raw (un-normalised)
# track kinematics; the edge-enabled attention requires torch-math backend.

name: GN2XE

data:
  batch_size: 1000
  num_workers: 15
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, truncate: 100}
    features:
      class_path: salt.core.data.Features
      init_args:
        # EdgeFeatures needs eta/phi/pt (dR/kt/z) + subjetIndex among these,
        # resolved by name at bind.
        variables:
          jets: [pt, eta, mass]
          tracks:
            [
              pt,
              eta,
              phi,
              subjetIndex,
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int} # precomputed flavour_label (no labeller)

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 3.0e-4, end: 5.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      # pairwise edge features on the raw (un-normalised) tracks.
      edge_features:
        class_path: salt.core.nn.EdgeFeatures
        init_args:
          stream: tracks
          features: [dR, z, kt, subjetIndex, isSelfLoop]
      edge_embed:
        class_path: salt.core.nn.EdgeEmbed
        init_args:
          stream: tracks
          out_dim: &edge_embed_dim 32
          dense: {hidden_layers: [32], activation: &activation SiLU}
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets] # concats normed.jets into the track embed
          out_dim: &embed_dim 192
          dense: {hidden_layers: [256], activation: *activation}
      concat:
        # tracks is the only stream, so it is trivially streams[0] as
        # required by the edge-stream-first constraint.
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 6
          attention: {num_heads: 4, attn_type: torch-math} # edge attention requires torch-math
          dense: {activation: *activation, gated: false}
          edges: edges.tracks_emb
          edge_embed_dim: *edge_embed_dim
          update_edges: true # edge tensor is updated each layer
      split:
        class_path: salt.core.nn.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [hbb, hcc, top, qcd]
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128, 64, 32], activation: *activation, dropout: &dropout 0.1}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128, 64, 32], activation: *activation, dropout: *dropout}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: *activation, dropout: *dropout}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

callbacks:
  h5_output:
    class_path: salt.core.outputs.H5OutputSink
  onnx_export:
    class_path: salt.core.outputs.OnnxExportSink

export: # inert during fit/test; used only by ONNX export
  model_name: GN2XE # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    # dynamic sequence length — edge tensors are derived from this axis.
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}

trainer:
  max_epochs: 50
  precision: 32-true # edge attention requires torch-math, incompatible with flash-varlen/bf16
