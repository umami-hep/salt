# Overlay on gn2v2-dummy.yaml: the FULL get_output()-on-task section — all
# three heads (jets_classification, track_origin, track_vertexing) serialised to
# H5 and exported to ONNX via one RunTaskOutput. Replaces the base's mode-split
# jets_out/origin_out writers with a single all-modes run_tasks. The command
# wires the implicit H5 + ONNX sinks (plan 50 Phase B — no callbacks: sinks).
# Stack as:
#   salt test --config gn2v2-dummy.yaml --config gn2v2-dummy-cutover34.yaml ...

model:
  modules:
    # un-defer vertexing (the base defers it via expose: [fit, val]) so its
    # get_output mints the VertexIndex H5 column + ONNX int8 leaf.
    track_vertexing:
      class_path: salt.core.nn.tasks.VertexingTaskModule
      init_args:
        expose: null

outputs:
  # drop the base's mode-split writers; one RunTaskOutput over the full family
  jets_out: null
  origin_out: null
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args: {tasks: [jets_classification, track_origin, track_vertexing]}
