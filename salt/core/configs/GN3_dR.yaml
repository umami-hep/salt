# GN3_dR.yaml — thin overlay on GN3_baseline.yaml (M5-CONV, GN3 family).
# The v2-native port of legacy salt/configs/GN3_dev/GN3_dR.yaml.
#
# Retargets the `tracks` stream from the ghost-associated tracks to the
# dR-MATCHED tracks (v1 `input_map: {tracks: tracks_dr}`, GN3_dR.yaml:6) by
# overriding the reader group's `dataset` (the v2 home of v1's input_map; the
# served stream name `tracks` is unchanged so every downstream module/task is
# untouched). v1 also retargets the train/val/norm_dict files — those are
# machine paths supplied as `salt2 fit` overrides (design §5 placeholder policy),
# not committed here.
#
# Static validation (STACK the base first, then this overlay):
#   python -m salt.core.main graph validate \
#     -c salt/core/configs/GN3_baseline.yaml \
#     -c salt/core/configs/GN3_dR.yaml \
#     --set model.modules.norm.init_args.norm_dict=unused.yaml

name: GN3_dR

data:
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          # dR-matched tracks (v1 input_map: tracks -> tracks_dr)
          tracks: {vector: false, dataset: tracks_dr}
