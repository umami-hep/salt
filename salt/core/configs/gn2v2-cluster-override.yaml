# gn2v2-cluster-override.yaml — cluster deltas for the v2 half of the GN2
# before/after retraining gate (plan 09). Stacked ON TOP of the shipped
# gn2v2-opendata.yaml (deep-merge, design §5.3):
#
#   salt2 fit --config salt/core/configs/gn2v2-opendata.yaml \
#             --config salt/core/configs/gn2v2-cluster-override.yaml \
#             <data/norm/class-dict overrides as in the gn2v2-opendata header>
#
# Deltas vs gn2v2-opendata.yaml:
#   - name: GN2v2opendata (eval columns become GN2v2opendata_pb/_pc/_pu/_ptau,
#     distinguishable from the v1 run's GN2v1opendata_* columns)
#   - encoder attention: flash-varlen (the M6 cluster follow-up axis this
#     experiment exists to exercise; gn2v2-opendata ships torch-math)
#   - trainer: 10 epochs, 16-mixed, explicit gpu (base2 ships 'auto')
#   - checkpoint: save_top_k -1 == one checkpoint EVERY epoch — matches the
#     v1 salt.callbacks.Checkpoint policy (save_top_k=-1, checkpoint.py:27)
#     so the MATCHED final-epoch checkpoint policy (plan 09 condition 1) is
#     implementable on both sides: primary comparison = highest epoch=NNN,
#     best-val (lowest loss=) recorded as diagnostic only.
#
# NOTE on block repetition: the encoder and checkpoint entries are repeated
# IN FULL (not just the changed leaf). Cross-file deep-merge unions dict
# sections key-by-key at the entry level (DeepMergeParser); repeating the
# whole entry makes the override correct under both entry-replacement and
# deeper merges — the merged result is asserted via --print_config in the
# experiment smoke.
#
# CPU smoke (no flash kernels / no fp16 on CPU): stack CLI overrides on top —
#   --model.modules.encoder.init_args.attention='{"num_heads": 8, "attn_type": "torch-math"}' \
#   --trainer.accelerator cpu --trainer.precision 32-true

name: GN2v2opendata

model:
  class_path: salt.core.SaltModule
  init_args:
    modules:
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: flash-varlen}
          dense: {activation: ReLU, gated: false}

callbacks:
  # stack-neutral per-epoch loss CSV (<run dir>/loss_history.csv) — the v1
  # side attaches the SAME class via --trainer.callbacks+= (see
  # salt/utils/loss_history.py for why loggers can't supply this on v1)
  loss_history:
    class_path: salt.utils.loss_history.LossHistoryWriter
  checkpoint:
    class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/loss
      mode: min
      save_top_k: -1 # v1-matched: every epoch (base2.yaml ships top-1)
      # 'loss=' in the stem is the salt2-test no-ckpt_path fallback contract
      # (base2.yaml) — keep filename and that glob in sync.
      filename: "epoch={epoch:03d}-loss={val/loss:.5f}"
      auto_insert_metric_name: false

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 16-mixed
