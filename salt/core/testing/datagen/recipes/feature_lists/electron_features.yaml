# Shared electron (constituent) feature list -- a VARIABLE-SUPERSET of the
# GN2emu + GN3V01 `electrons` blocks (their union; GN3V01 declares
# d0RelativeToBeamspot which GN2emu omits, GN2emu declares
# ftag_z0AlongBeamspotSignificance, so both are present).
#
# Authoritative source: salt/utils/inputs.py write_dummy_file `ELECTRON_VARS`
# (29 float f4) + 2 int labels (ftagTruthOriginLabel, ftagTruthVertexIndex --
# GN2emu's electron_origin / electron_vertexing heads).
#
# mask_invalid: false -> invalid slots keep random (non-NaN) values.

- { name: pt,      type: distribution, dtype: f4, dist: lognormal }
- { name: ptfrac,  type: distribution, dtype: f4 }
- { name: ptrel,   type: distribution, dtype: f4 }
- { name: dr,      type: distribution, dtype: f4 }
- { name: abs_eta, type: distribution, dtype: f4 }
- { name: eta,     type: distribution, dtype: f4, dist: normal }
- { name: phi,     type: distribution, dtype: f4 }
- { name: ftag_et, type: distribution, dtype: f4, dist: lognormal }
- { name: qOverP,  type: distribution, dtype: f4 }
- { name: d0RelativeToBeamspot,             type: distribution, dtype: f4 }
- { name: d0RelativeToBeamspotSignificance, type: distribution, dtype: f4 }
- { name: ftag_z0AlongBeamspotSignificance, type: distribution, dtype: f4 }
- { name: ftag_ptVarCone30OverPt,           type: distribution, dtype: f4 }
- { name: numberOfPixelHits,        type: distribution, dtype: f4 }
- { name: numberOfSCTHitsInclDead,  type: distribution, dtype: f4 }
- { name: ftag_deltaPOverP,         type: distribution, dtype: f4 }
- { name: eProbabilityHT,           type: distribution, dtype: f4 }
- { name: deltaEta1,                type: distribution, dtype: f4 }
- { name: deltaPhiRescaled2,        type: distribution, dtype: f4 }
- { name: ftag_energyOverP,         type: distribution, dtype: f4 }
- { name: Rhad,   type: distribution, dtype: f4 }
- { name: Rhad1,  type: distribution, dtype: f4 }
- { name: Eratio, type: distribution, dtype: f4 }
- { name: weta2,  type: distribution, dtype: f4 }
- { name: Rphi,   type: distribution, dtype: f4 }
- { name: Reta,   type: distribution, dtype: f4 }
- { name: wtots1, type: distribution, dtype: f4 }
- { name: f1,     type: distribution, dtype: f4 }
- { name: f3,     type: distribution, dtype: f4 }

# --- int i4 labels (inputs.py:638-641) ---
- name: ftagTruthOriginLabel
  type: label
  dtype: i4
  classes: [0]
- name: ftagTruthVertexIndex
  type: label
  dtype: i4
  classes: [0]
