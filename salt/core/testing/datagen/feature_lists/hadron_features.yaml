# Shared truth-hadron object feature list. Seeded from example_schema.yaml.
# Carries the barcode (id, link target) + the flavour object-class label
# (classes [-1, 4, 5], invalid_fill -1) the maskformer recipe round-trips.
- { name: pt,   type: distribution, dtype: f4, dist: lognormal }
- { name: Lxy,  type: distribution, dtype: f4 }
- { name: deta, type: distribution, dtype: f4 }
- { name: dphi, type: distribution, dtype: f4 }
- { name: mass, type: distribution, dtype: f4, dist: lognormal }
- { name: barcode, type: id, dtype: i4, range: [0, 10000], scope: jet, unique: true }
- { name: flavour, type: label, dtype: i4, classes: [-1, 4, 5], sorted: true, invalid_fill: -1 }
