# config_recipes.yaml -- SINGLE SOURCE OF TRUTH mapping each salt TEST-SUITE
# config (the ones run by salt/tests/test_pipeline.py) to the dataset-generator
# recipe whose emitted groups + variables are a SUPERSET of that config's real
# declared `variables` (+ labels). The integration test
# (tests/test_config_integration.py) is parametrized over this mapping: for each
# (config, recipe) it generates the recipe, then constructs a real
# salt.data.SaltDataset using the config's ACTUAL variables block and reads a
# slice -- which fails (KeyError) if the recipe is not a true superset.
#
# `flags` are passed to the generator pipeline (they fan out to flavour_label
# class resolution + ClassDictWriter); they do not change which variable NAMES
# are emitted, so read-back validity holds regardless.
#
# Config paths are RELATIVE to the salt config root. Paths under `tests/configs/`
# are resolved by run_combined's fallback in test_pipeline.py; the integration
# test resolves both roots the same way.

recipes_dir: recipes          # relative to this file's directory
config_root: configs          # relative to the salt package dir
test_config_root: tests/configs

mapping:
  # ---- flavour_tagger (jets + tracks [+flows/flow][+electrons][+global->jets][+parameters->jets]) ----
  - { config: GN2/GN2.yaml,          recipe: flavour_tagger, flags: { inc_taus: true } }
  - { config: GN2/GN2_muP.yaml,      recipe: flavour_tagger, flags: {} }
  - { config: GN2/GN2emu.yaml,       recipe: flavour_tagger, flags: {} }
  - { config: GN2/GN2XE.yaml,        recipe: flavour_tagger, flags: { make_xbb: true } }
  - { config: GN3v01/GN3V00.yaml,    recipe: flavour_tagger, flags: { is_gn3: true } }
  - { config: GN3v01/GN3V01.yaml,    recipe: flavour_tagger, flags: { is_gn3: true } }
  - { config: legacy/dips.yaml,      recipe: flavour_tagger, flags: {} }
  - { config: regression.yaml,            recipe: flavour_tagger, flags: {} }
  - { config: nan_regression.yaml,        recipe: flavour_tagger, flags: {} }
  - { config: regression_gaussian.yaml,   recipe: flavour_tagger, flags: {} }
  - { config: regression_multi_target.yaml, recipe: flavour_tagger, flags: {} }
  - { config: regression_weighted.yaml,   recipe: flavour_tagger, flags: {} }
  - { config: flow.yaml,             recipe: flavour_tagger, flags: {} }
  - { config: param_concat.yaml,     recipe: flavour_tagger, flags: {}, test_config: true }
  - { config: param_featurewise.yaml, recipe: flavour_tagger, flags: {}, test_config: true }
  - { config: no_global_inputs.yaml, recipe: flavour_tagger, flags: {}, test_config: true }

  # ---- maskformer_truth_hadron (jets + tracks + truth_hadrons via objects remap) ----
  - { config: MaskFormer.yaml,       recipe: maskformer_truth_hadron, flags: {} }

  # ---- jets_only (single global jets stream) ----
  - { config: legacy/DL1.yaml,       recipe: jets_only, flags: {} }
