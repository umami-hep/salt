# RegressionTaskModule family: an encoder-less DiPS body (init_nets + pool,
# no encoder) feeding several regression head variants — plain norm_params,
# multi-target, ratio/denominator, and a per-token sequence head.

name: regression

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes, mass]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      reg_normed:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          norm_params: {mean: 1.0, std: 1.0}
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_multinorm:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          norm_params: {mean: [1.0, 2.0], std: [3.0, 4.0]}
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_ratio:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          target_denominators: pt_btagJes # a declared input Feature (ONNX source)
          custom_output_names: pt
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_multiratio:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          target_denominators: [mass, pt_btagJes] # declared input Features (ONNX source)
          custom_output_names: [truthMass, truthPt]
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_seq_tracks:
        # per-token head: encoder-less body has no encoded.seq, so this reads
        # embed.tracks directly; sequence: true is explicit since that key
        # would otherwise be inferred as global. No context (v1 has none).
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: tracks
          input: embed.tracks
          sequence: true
          targets: [dphi, deta]
          custom_output_names: [dummyOutput_dPhi, dummyOutput_dEta]
          loss: MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args:
      streams: [jets, tracks]
      variables:
        jets: [pt_btagJes, eta_btagJes, mass]
        tracks: [d0, z0SinTheta, dphi, deta, qOverP]
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [reg_normed, reg_multinorm, reg_ratio, reg_multiratio, reg_seq_tracks]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

export:
  model_name: regression # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}

trainer:
  max_epochs: 2
