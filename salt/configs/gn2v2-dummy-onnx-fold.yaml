# Overlay on gn2v2-dummy.yaml: demonstrates the folded ONNX export path — a
# ClassProbs softmax, a SeqClassIndex argmax, and a Combination (pbc = pb+pc)
# minted in-graph, each naming its own ONNX output through its manifest (the
# probs and the argmax index inherit their names from the source task; the
# combination names itself). The eval-H5 side rides the base's outputs: section
# (test-only); the ONNX tuple is collected from the conversion nodes below.
# Stack as:
#   salt graph plot --config gn2v2-dummy.yaml --config gn2v2-dummy-onnx-fold.yaml --mode onnx

model:
  modules:
    # the folded ONNX conversion producers (the base runs get_output for H5 only)
    jet_probs:
      class_path: salt.outputs.ClassProbs
      init_args: {task: jets_classification, stream: jets}
    # distinct leaf name so the ONNX argmax never collides with the section's
    # test-mode track_origin leaves
    track_origin_index:
      class_path: salt.outputs.SeqClassIndex
      init_args: {task: track_origin, stream: tracks, name: track_origin_index}
    pbc:
      class_path: salt.outputs.Combination
      init_args:
        source: outputs.jets.jets_classification
        name: pbc
        terms: {0: 1.0, 1: 1.0} # pbc = pb + pc

outputs:
  # eval-H5 only: the section declares no ONNX leaves, so the folded conversion
  # nodes above own the whole ONNX tuple
  jets_out:
    class_path: salt.outputs.RunTaskOutput
    init_args: {modes: [test]}
  origin_out:
    class_path: salt.outputs.RunTaskOutput
    init_args: {modes: [test]}

callbacks:
  # the ONNX sink is declared (not injected) because the section opts out of
  # export; its tuple is collected from the conversion nodes' manifests. The H5
  # sink stays implicit (wired by salt test over the outputs: section).
  onnx_export:
    class_path: salt.outputs.OnnxExportSink
