# Fine-tuning overlay TEMPLATE — add a NEW task head to a pretrained backbone.
#
# This is an OVERLAY, not a standalone config: stack it on a saved run's
# `config.yaml` and warm-start from that run's checkpoint. It bolts a brand-new
# classification head onto the pretrained backbone (reusing the learned jet
# representation) and trains only that head first, then optionally the whole
# network.
#
#   salt fit \
#     --config <saved_gn3large_config.yaml> \
#     --config salt/configs/finetune_gn3large_new_head.yaml \
#     --init_from <pretrained.ckpt> \
#     --data.train_file <new_campaign/train.h5> \
#     --data.val_file   <new_campaign/val.h5>
#
# Before running, REPLACE the placeholders above AND the label/class_names below
# with your real values. `label:` is a demand on your dataset — the `Labels`
# module must be able to serve `large_r_flavour_label` (rename it to your truth
# field). At startup the warm-start accounting reports the inherited modules as
# `loaded` and `large_r_jet_classification` as `new` (fresh init).
#
# Walk-through: docs/tutorials/finetuning.md (worked example B).

# 1. Module surgery — deep-merge a new head into the pretrained model's modules.
model:
  init_args:
    modules:
      large_r_jet_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global          # reuse the same pooled jet embedding the flavour head uses
          label: large_r_flavour_label  # TEMPLATE: the new label your target dataset must provide
          class_names: [hbb, hcc, top, qcd]  # TEMPLATE: your categories
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
          weight_source: null           # set {from_class_dict: <path>} to class-weight the head

# 2. A schedule that trains only the new head first, backbone frozen.
training_schedule:
  stages:
    head_warmup:
      epochs: 5
      trainable: [large_r_jet_classification]  # backbone + original heads frozen + eval()
      lrs:
        max: 1.0e-4
    full_finetune:
      frozen: []                               # unfreeze everything; remaining epochs
      lrs:
        initial: 1.0e-7
        max: 1.0e-5

trainer:
  max_epochs: 15
