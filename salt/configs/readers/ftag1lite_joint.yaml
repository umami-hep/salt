            event:
              # entry-axis event scalar repeated onto every jet row; feeds cuts.per_split
              prefix: EventInfoAuxDyn.
              jagged: false
              broadcast: true
              branches: {eventNumber: eventNumber}
          cuts:
            global_cuts:
              # Keep exactly the large-R jets one of GN3X's nine classes labels, so
              # FtagLabeller(require_labels: true) never sees an unlabelled jet (ftag/flavours.yaml;
              # R = R10TruthLabel_R22v1, B/C = Ghost{B,C}HadronsFinalCount): eligible iff
              # R in {1,6,7,10,11,12,16} (top 1/6/7, qcd* partition 10, hbb 11, hcc 12,
              # htautauhad 16) OR Wqq (R == 2 & B < 2 & C < 2). A cut root must be ONE
              # comparison (no `|`), hence one product; its last factor
              # (R-2)^2 + B(B-1) + C(C-1) is 0 iff R == 2 and B, C in {0, 1}. Float constants
              # promote the int32 branches to float64: no overflow, exact zero test.
              - "(R10TruthLabel_R22v1 - 1.0) * (R10TruthLabel_R22v1 - 6.0) * (R10TruthLabel_R22v1 - 7.0) * (R10TruthLabel_R22v1 - 10.0) * (R10TruthLabel_R22v1 - 11.0) * (R10TruthLabel_R22v1 - 12.0) * (R10TruthLabel_R22v1 - 16.0) * ((R10TruthLabel_R22v1 - 2.0) * (R10TruthLabel_R22v1 - 2.0) + GhostBHadronsFinalCount * (GhostBHadronsFinalCount - 1.0) + GhostCHadronsFinalCount * (GhostCHadronsFinalCount - 1.0)) == 0"
            per_split:
              # One corpus split by event number: 80% train, 10% val, 10% test (disjoint).
              train: ["eventNumber % 10 < 8"]
              val: ["eventNumber % 10 == 8"]
              test: ["eventNumber % 10 == 9"]
