# Reader config - DAOD_FTAG1LITE small-R (EMPFlow) AND large-R (UFO CSSK SoftDrop) jets as
# one row stream (`jets: both`): per event its small-R rows then its large-R rows, with an
# int64 `jets.jet_type` (0 small-R / 1 large-R). Scalar streams are the union of both
# sides (a one-sided field is NaN for floats, -1 for signed ints, on the other side's
# rows); jagged streams on both sides share fields and pad_max, and the small-R-only
# `towers` stream is all-padding on large-R rows. `small` matches readers/ftag1lite.yaml;
# `large` carries the large-R groups and cuts (no towers: they exist for small-R only).
# `jets: large_r` with this `large` block alone (and no `small`) reads large-R only.
#
# Two shipped FTAG1LITEReader configs, each self-contained (no include):
#   readers/ftag1lite.yaml        jets: small_r (AntiKt4EMPFlow)
#   readers/ftag1lite_joint.yaml  jets: both (small-R + AntiKt10UFOCSSKSoftDropBeta100Zcut10)
# Usage (source files from --data.train_file / --data.val_file or the datamodule's file keys):
#   salt fit --config readers/ftag1lite.yaml --config <model>.yaml \
#            --data.manifest '{train: /path/to/train_manifest.json, val: /path/to/val_manifest.json}'
#
# Both configs stream: the datamodule builds the reader's FTAG1LITEStreamingDataset instead
# of SaltDataset. Rows arrive in a different order; the batch object, the plan and
# everything downstream are unchanged.
#
# Containers: each source file's parent directory is one container (one directory per
# rucio container; a flat directory is one container). `shard_scope: owner` - each rank
# owns a disjoint set of containers and the combined super-batch across GPUs is
# stratified by container; owner needs `shuffle_pool_rows: null`. To stream per_rank
# instead (every rank reads every container, proportional per-rank batches drawn from a
# 100,000-row shuffle pool):
#   --data.modules.reader.init_args.shard_scope per_rank --data.modules.reader.init_args.shuffle_pool_rows 100000
# Validation and test always stream per_rank.
#
# `manifest:` is REQUIRED on the streaming path and is not set here (salt never chooses a
# storage location): pass it on the command line, as above, or in your own overlay. A
# single path is valid only when every stage reads the same corpus. An existing manifest
# is validated and read, a missing one is built at that path on rank 0 in prepare_data,
# and a stale one is a hard error - delete the file to rebuild.

data:
  iterable: true
  # Rows per reader call (one container block at a time).
  block_rows: 1024
  # Every container keeps one resident block, so a cap below the per-shard container
  # count would only force re-reads.
  max_live_streams: null  # null leaves the cap unasserted
  shuffle_stream: true
  modules:
    reader:
      class_path: salt.data.FTAG1LITEReader
      init_args:
        jets: both
        shard_scope: owner
        shuffle_pool_rows: null
        small:
          groups:
            jets:
              prefix: AntiKt4EMPFlowJetsAuxDyn.
              jagged: false
              branches:
                pt: pt
                eta: eta_calibrated
                phi: phi_calibrated
                mass: mass_calibrated
                # truth LABELS below (never features)
                HadronGhostTruthLabelID: HadronGhostTruthLabelID
                PartonTruthLabelID: PartonTruthLabelID
                ptFromTruthDressedWZJet: ptFromTruthDressedWZJet
                matchedToTruthDressedWZJet: matchedToTruthDressedWZJet
                flavour_label: HadronConeExclTruthLabelID
            tracks:
              # GN3V00 track inputs + 3 int32 truth LABEL branches (ftagTruth*)
              prefix: AntiKt4EMPFlowJetsAuxDyn.
              jagged: true
              pad_max: 100
              branches:
                d0: ft1l_trk_d0_bf16
                z0SinTheta: ft1l_trk_z0SinTheta_bf16
                dphi: ft1l_trk_dphi_bf16
                deta: ft1l_trk_deta_bf16
                qOverP: ft1l_trk_qOverP
                lifetimeSignedD0Significance: ft1l_trk_lifetimeSignedD0Significance_bf16
                lifetimeSignedZ0SinThetaSignificance: ft1l_trk_lifetimeSignedZ0SinThetaSignificance_bf16
                phiUncertainty: ft1l_trk_phiUncertainty_bf16
                thetaUncertainty: ft1l_trk_thetaUncertainty_bf16
                qOverPUncertainty: ft1l_trk_qOverPUncertainty_bf16
                numberOfPixelHits: ft1l_trk_numberOfPixelHits
                numberOfSCTHits: ft1l_trk_numberOfSCTHits
                numberOfInnermostPixelLayerHits: ft1l_trk_numberOfInnermostPixelLayerHits
                numberOfNextToInnermostPixelLayerHits: ft1l_trk_numberOfNextToInnermostPixelLayerHits
                numberOfInnermostPixelLayerSharedHits: ft1l_trk_numberOfInnermostPixelLayerSharedHits
                numberOfInnermostPixelLayerSplitHits: ft1l_trk_numberOfInnermostPixelLayerSplitHits
                numberOfPixelSharedHits: ft1l_trk_numberOfPixelSharedHits
                numberOfPixelSplitHits: ft1l_trk_numberOfPixelSplitHits
                numberOfSCTSharedHits: ft1l_trk_numberOfSCTSharedHits
                leptonID: ft1l_trk_leptonID
                muon_quality: ft1l_trk_muon_quality
                muon_qOverPratio: ft1l_trk_muon_qOverPratio_bf16
                muon_momentumBalanceSignificance: ft1l_trk_muon_momentumBalanceSignificance_bf16
                muon_scatteringNeighbourSignificance: ft1l_trk_muon_scatteringNeighbourSignificance_bf16
