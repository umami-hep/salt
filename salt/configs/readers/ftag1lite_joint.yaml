                eta: ft1l_tower_eta_bf16
                mass: ft1l_tower_mass_bf16
                phi: ft1l_tower_phi_bf16
                pt: ft1l_tower_pt_bf16
            event:
              # entry-axis event scalar repeated onto every jet row; feeds cuts.per_split
              prefix: EventInfoAuxDyn.
              jagged: false
              broadcast: true
              branches: {eventNumber: eventNumber}
          cuts:
            global_cuts:
              # Keep only jets one of the six ghost-flavour classes labels (ftag/flavours.yaml):
              # ghost in {4, 5, 15} always passes (>= 400); ghost == 0 passes iff
              # |parton-12| >= 9, i.e. parton <= 3 or >= 21; ghost == 0 with parton in
              # [4, 20] is an orphan jet and fails.
              - "HadronGhostTruthLabelID * 100 + abs(PartonTruthLabelID - 12) >= 9"
            per_split:
              # One corpus split by event number: 80% train, 10% val, 10% test (disjoint).
              train: ["eventNumber % 10 < 8"]
              val: ["eventNumber % 10 == 8"]
              test: ["eventNumber % 10 == 9"]
