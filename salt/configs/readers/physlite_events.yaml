# Reader fragment, EVENT axis — two DAOD_PHYSLITE samples (signal + background)
# combined by MultiSampleReader with proportional stratification.
#
# The PHYSLITE leg of `ttbar_vs_hh4b_event_tagger.yaml`; the other leg is
# `readers/easyjet_events.yaml`, which serves the SAME stream/field names off the
# easyjet AnalysisMiniTree ntuples produced from these very files:
#
#   salt fit -c ttbar_vs_hh4b_event_tagger.yaml -c readers/physlite_events.yaml
#
# A fragment, not a config: it declares only `data.modules.reader` and has no
# model, so it is never loaded alone. Fill in each sample's per-stage `sources:`
# before use.
#
# Schema notes:
#   - unroll: null — one row per event, so the jets are a per-event jagged token
#     sequence, exactly as on the easyjet side. (`readers/physlite_jets.yaml` is
#     the JET-axis PHYSLITE reader; same format, different sample axis.)
#   - PHYSLITE stores calibrated jet kinematics as flat dynamic decorations under
#     `AnalysisJetsAuxDyn.`, which is why this leg exists and a PHYS one cannot:
#     PHYS keeps the nominal four-momentum in the unsplit static aux container
#     `AntiKt4EMPFlowJetsAux.`, from which uproot can read no jet pt/eta/phi/m at
#     all.
#   - `EventInfoAuxDyn.` carries the per-event scalars. MultiSampleReader needs a
#     non-jagged stream to hang its injected `process` label on, and UprootReader
#     needs every group to name at least one real branch, so the `event` group is
#     load-bearing even though the model consumes no field from it.
#
# ⚠ THE TWO SAMPLES REACH THE TAGGER SCORES DIFFERENTLY — and that is the point.
#
#   Where a derivation puts the b-tagging output is a property of its p-tag, not
#   of the physics. The ttbar 601237 PHYSLITE at p7017 has the scores flattened
#   onto the jet as `AnalysisJetsAuxDyn.GN2v01_p{b,c,u}`. The HH4b 603404
#   PHYSLITE is only ever produced at p6026/p6187/p6697 (AMI: never at the
#   p7128/p7344 where PHYS exists), and those keep the scores in a separate
#   `BTagging_AntiKt4EMPFlow` container reached from each jet by the 1:1
#   ElementLink `AnalysisJetsAuxDyn.btaggingLink`.
#
#   So the signal sub-reader adds `join_branch`/`join_prefix`/`join_branches` and
#   the background one does not, and both serve `GN2v01_p{b,c,u}` as ordinary
#   fields of the `jets` stream in the same order. One model, one field contract,
#   two on-disk layouts — resolved in config, with no branch in the model.
#
#   (`join_*` is NOT `link_branch`/`target_prefix`. That pair is the 1:many case:
#   it BUILDS a constituent stream by dereferencing a link vector — PHYSLITE
#   `GhostTrack` -> `InDetTrackParticles`, see `readers/physlite_jets.yaml` — and
#   needs `unroll` to name a row object. A join augments elements that already
#   exist, so it is at home on the entry axis.)
#
# Preselection — what is applied here and what is NOT:
#
#   easyjet's bbbb resolved analysis writes only events passing
#   AT_LEAST_FOUR_JETS + AT_LEAST_TWO_BJETS, over a jet container already cut to
#   pt > 20 GeV, |eta| < 4.5 and NNJvt. PHYSLITE is uncut, so the two legs would
#   otherwise see different event samples.
#
#   The per-jet half of that selection is `constituent_cuts` with on_fail: drop —
#   a failing jet is removed and the row re-padded, which is what "the container
#   was pre-selected" means. The two EVENT-level multiplicity requirements are
#   the reader's row-level `cuts:`, written as reductions of the jets stream's
#   constituent axis:
#
#       sum(jets.valid) >= 4                          # >= 4 jets, post-jet-cuts
#       sum((log(...) > -0.385) & (abs(eta) < 2.5)) >= 2   # >= 2 at FixedCutBEff_85
#
#   `sum()` reduces AFTER the constituent cuts and AFTER truncation to
#   `truncate: 20`, so it counts the jets the model is actually handed. `log` and
#   `abs` are whitelisted, so the b-tag discriminant is spelled the way ATLAS
#   defines it, D = ln(pb / (0.2*pc + 0.8*pu)) > -0.385, rather than as the
#   equivalent ratio > exp(-0.385); `&` joins that to the |eta| < 2.5 b-tagging
#   ACCEPTANCE, which is tighter than the |eta| < 4.5 jet cut because GN2 needs
#   tracks. (The per-jet |eta| < 4.5 above is still two cuts: a constituent cut
#   has to stay a single comparison, and `&` is only legal where a comparison is
#   — inside a reduction.)
#
#   Measured closure (experiment 58, ttbar 601237, the same 10,000 events easyjet
#   read; reproduced from these very cuts in experiment 63): 9,842 events pass
#   ">= 4 jets" and 5,258 pass "+ >= 2 b-tags", against the 5,003 easyjet wrote —
#   +5.1%. The residual is overlap removal (needs the lepton collections and the
#   CP OR tool) plus easyjet's own b-jet-energy and muon-in-jet re-calibration,
#   which shifts jet pt and hence both counts. It is a real property of the two
#   formats, not a missing cut, and must not be chased by joining on event number.

data:
  train_file: train  # placeholders: MultiSampleReader sources per sample below
  val_file: val
  test_file: test
  modules:
    reader:
      class_path: salt.data.MultiSampleReader
      init_args:
        label_stream: event
        label_field: process
        samples:
          - name: signal
            label: 1
            reader:
              class_path: salt.data.UprootReader
              init_args:
                tree: CollectionTree
                unroll: null
                # the reproducible per-jet half of easyjet's preselection
                constituent_cuts: &physlite_jet_preselection
                  jets:
                    on_fail: drop
                    cuts:
                      - pt > 20000 # 20 GeV, PHYSLITE stores MeV
                      - eta < 4.5 # |eta| < 4.5: a cut is one comparison,
                      - eta > -4.5 #   so it is two cuts
                      - NNJvtPass > 0.5 # stored as int8 0/1
                # its two event-level halves, over the jets that survive above
                cuts: &physlite_event_preselection
                  global_cuts:
                    - expr: sum(jets.valid) >= 4
                      comment: easyjet AT_LEAST_FOUR_JETS
                    - expr: >-
                        sum((log(jets.GN2v01_pb / (0.2 * jets.GN2v01_pc
                        + 0.8 * jets.GN2v01_pu)) > -0.385)
                        & (abs(jets.eta) < 2.5)) >= 2
                      comment: easyjet AT_LEAST_TWO_BJETS, GN2v01 FixedCutBEff_85
                groups:
                  jets:
                    prefix: AnalysisJetsAuxDyn.
                    jagged: true
                    truncate: 20 # matches readers/easyjet_events.yaml
                    branches:
                      pt: pt
                      eta: eta
                      phi: phi
                      m: m
                      NNJvtPass: NNJvtPass # cut variable, not a model feature
                    # p6697 keeps the scores one ElementLink away (header)
                    join_branch: btaggingLink # -> AnalysisJetsAuxDyn.btaggingLink
                    join_prefix: BTagging_AntiKt4EMPFlowAuxDyn.
                    join_branches:
                      GN2v01_pb: GN2v01_pb
                      GN2v01_pc: GN2v01_pc
                      GN2v01_pu: GN2v01_pu
                  event: &physlite_event_group
                    prefix: EventInfoAuxDyn.
                    jagged: false
                    branches:
                      eventNumber: eventNumber
                      mcChannelNumber: mcChannelNumber
            # sources: {train: [...], val: [...], test: [...]}  # HH4b files
          - name: background
            label: 0
            reader:
              class_path: salt.data.UprootReader
              init_args:
                tree: CollectionTree
                unroll: null
                constituent_cuts: *physlite_jet_preselection
                cuts: *physlite_event_preselection
                groups:
                  jets:
                    prefix: AnalysisJetsAuxDyn.
                    jagged: true
                    truncate: 20
                    # p7017 flattens the scores onto the jet, so no join — the
                    # field names and their ORDER still match the signal leg
                    branches:
                      pt: pt
                      eta: eta
                      phi: phi
                      m: m
                      NNJvtPass: NNJvtPass
                      GN2v01_pb: GN2v01_pb
                      GN2v01_pc: GN2v01_pc
                      GN2v01_pu: GN2v01_pu
                  event: *physlite_event_group
            # sources: {train: [...], val: [...], test: [...]}  # ttbar files
