# Reader fragment — DAOD_FTAG1LITE POOL files, small-R EMPFlow jets.
#
# Stackable: `salt fit --config readers/ftag1lite.yaml --config <model>.yaml`
# (jsonargparse deep-merges configs left-to-right). Provide the source file(s)
# via --data.train_file / --data.val_file (or the datamodule's file keys).
#
# Schema notes:
#   - unroll: jets  -> one row per small-R jet; `[event][jet]` is flattened away.
#   - Jet-level scalars and track constituents both live under the jet
#     collection's aux store, so both groups share
#     prefix: AntiKt4EMPFlowJetsAuxDyn.
#   - Track lists are DIRECT double-jagged decorations (`ft1l_trk_*`), NOT
#     ElementLinks — no link_branch/target_prefix needed (contrast PHYSLITE).
#   - Track truth labels stay under v1 field names so the task heads' label
#     derivation holds (VertexingTaskModule derives the origin key by replacing
#     'VertexIndex' -> 'OriginLabel').

include:
  - ftag1lite_empflow.yaml

data:
  modules:
    reader:
      class_path: salt.data.UprootReader
      init_args:
        tree: CollectionTree
        unroll: jets
        groups:
          jets:
            prefix: AntiKt4EMPFlowJetsAuxDyn.
            jagged: false
            branches:
              pt: pt
              eta: eta_calibrated
              phi: phi_calibrated
              mass: mass_calibrated
              flavour_label: HadronConeExclTruthLabelID
          tracks:
            prefix: AntiKt4EMPFlowJetsAuxDyn.
            jagged: true
            pad_max: 40
            branches:
              d0: ft1l_trk_d0_bf16
              z0SinTheta: ft1l_trk_z0SinTheta_bf16
              d0Uncertainty: ft1l_trk_d0Uncertainty_bf16
              z0SinThetaUncertainty: ft1l_trk_z0SinThetaUncertainty_bf16
              lifetimeSignedD0Significance: ft1l_trk_lifetimeSignedD0Significance_bf16
              lifetimeSignedZ0SinThetaSignificance: ft1l_trk_lifetimeSignedZ0SinThetaSignificance_bf16
              pt: ft1l_trk_pt_bf16
              deta: ft1l_trk_deta_bf16
              dphi: ft1l_trk_dphi_bf16
              numberOfPixelHits: ft1l_trk_numberOfPixelHits
              numberOfSCTHits: ft1l_trk_numberOfSCTHits
              ftagTruthOriginLabel: ft1l_trk_ftagTruthOriginLabel
              ftagTruthVertexIndex: ft1l_trk_ftagTruthVertexIndex
