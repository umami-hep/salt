# Small-R EMPFlow flavour tagger trained directly on xAOD DAOD_FTAG1LITE POOL
# files via FTAG1LiteReader (no H5 pre-processing). Same model as
# gn2v2-opendata.yaml — only the reader differs. No ONNX export (fit/test only).

name: ftag1lite_empflow

data:
  batch_size: 1000
  num_workers: 4
  modules:
    reader:
      class_path: salt.data.FTAG1LiteReader
      init_args:
        jet_collection: AntiKt4EMPFlowJets
        tree: CollectionTree
        groups:
          jets:
            jagged: false
            branches:
              pt: pt
              eta: eta_calibrated
              phi: phi_calibrated
              mass: mass_calibrated
              flavour_label: HadronConeExclTruthLabelID
          tracks:
            jagged: true
            pad_max: 40
            branches:
              d0: ft1l_trk_d0_bf16
              z0SinTheta: ft1l_trk_z0SinTheta_bf16
              d0Uncertainty: ft1l_trk_d0Uncertainty_bf16
              z0SinThetaUncertainty: ft1l_trk_z0SinThetaUncertainty_bf16
              lifetimeSignedD0Significance: ft1l_trk_lifetimeSignedD0Significance_bf16
              lifetimeSignedZ0SinThetaSignificance: ft1l_trk_lifetimeSignedZ0SinThetaSignificance_bf16
              pt: ft1l_trk_pt_bf16
              deta: ft1l_trk_deta_bf16
              dphi: ft1l_trk_dphi_bf16
              numberOfPixelHits: ft1l_trk_numberOfPixelHits
              numberOfSCTHits: ft1l_trk_numberOfSCTHits
              # kept under v1 field names so the task heads' label-derivation
              # contracts hold (VertexingTaskModule derives the origin key via
              # label.replace('VertexIndex', 'OriginLabel'))
              ftagTruthOriginLabel: ft1l_trk_ftagTruthOriginLabel
              ftagTruthVertexIndex: ft1l_trk_ftagTruthVertexIndex
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt, eta, phi, mass]
          tracks:
            [
              d0,
              z0SinTheta,
              d0Uncertainty,
              z0SinThetaUncertainty,
              lifetimeSignedD0Significance,
              lifetimeSignedZ0SinThetaSignificance,
              pt,
              deta,
              dphi,
              numberOfPixelHits,
              numberOfSCTHits,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: 256
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, taujets, ujets]
          # HadronConeExclTruthLabelID -> 4-class index: 5=b->0, 4=c->1, 15=tau->2, 0=light->3
          label_map: {5: 0, 4: 1, 15: 2, 0: 3}
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
      modes: [test]
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

trainer:
  max_epochs: 40
  precision: 32-true
