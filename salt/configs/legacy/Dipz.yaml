# DIPZ Gaussian primary-vertex-z regression: the encoder-less sibling of hitz.
# A single `super_tracks` stream is embedded and globally pooled with no
# encoder, feeding one pooled Gaussian regression head (TruthJetPVz).

name: Dipz

data:
  batch_size: 2048
  num_workers: 4
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          super_tracks: {global_object: false}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [eta]
          super_tracks:
            [
              z0RelativeToBeamspot,
              pt,
              d0,
              deta,
              dphi,
              chiSquared,
              numberDoF,
              qOverP,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-4, max: 1.0e-3, end: 1.0e-7, pct_start: 0.2}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, super_tracks]
          global_object: jets
      super_track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: super_tracks
          context: [normed.jets]
          out_dim: 32
          dense: {hidden_layers: [128, 128, 128], activation: ReLU}
      concat:
        class_path: salt.model.modules.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [super_tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      gaussian_regression:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          gaussian: true # mu/sigma head, output_size == 2
          targets: TruthJetPVz
          norm_params: {mean: 0.0, std: 37.81209182739258}
          loss: GaussianNLLLoss
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args: {tasks: [gaussian_regression]}

export:
  model_name: Dipz # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.super_tracks, name: super_track_features, sequence: true, dyn_axis: n_super_tracks}

trainer:
  max_epochs: 40
  precision: 16-mixed
