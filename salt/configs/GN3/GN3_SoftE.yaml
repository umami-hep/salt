# Overlay on GN3V00.yaml: adds an electrons stream and a GN3 'global'
# post-pooling VectorConcat, rewiring every inherited task from pooled.global
# (256) to vconcat.global (258).
# Note: list-valued fields (norm.streams, concat.streams) are REPLACED, not
# merged, by cross-config deep-merge, so grown lists must be re-stated in full.

include:
  - GN3V00.yaml

name: GN3_SoftE

data:
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          electrons: {global_object: false}
          global: {global_object: true}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          # same 2 columns as jets, so the ONNX alias below is an identity clone
          global: [pt_btagJes, eta_btagJes]
          electrons:
            [
              pt,
              ptfrac,
              ptrel,
              dr,
              abs_eta,
              eta,
              phi,
              ftag_et,
              qOverP,
              d0RelativeToBeamspot,
              d0RelativeToBeamspotSignificance,
              ftag_ptVarCone30OverPt,
              numberOfPixelHits,
              numberOfSCTHitsInclDead,
              ftag_deltaPOverP,
              eProbabilityHT,
              deltaEta1,
              deltaPhiRescaled2,
              ftag_energyOverP,
              Rhad,
              Rhad1,
              Eratio,
              weta2,
              Rphi,
              Reta,
              wtots1,
              f1,
              f3,
            ]

model:
  class_path: salt.model.SaltModule
  init_args:
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          streams: [jets, tracks, flows, electrons]
          global_object: jets
      norm_global:
        class_path: salt.model.modules.Normaliser
        init_args:
          streams: [global]
          global_object: global
      electron_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: electrons
          context: [normed.jets]
          out_dim: 512
          dense: {hidden_layers: [512], activation: SiLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks, flows, electrons]}
      vconcat:
        class_path: salt.model.modules.VectorConcat
        init_args:
          inputs: [pooled.global, normed.global]
          out: vconcat.global
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args: {input: vconcat.global}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args: {context: vconcat.global}
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args: {context: vconcat.global}
      track_type:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args: {context: vconcat.global}
      jet_pt_regression:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args: {input: vconcat.global}

outputs:
  onnx_export:
    class_path: salt.outputs.OnnxExportSink
    init_args:
      model_name: GN3SoftE # Athena name: no '_'/'-'
      inputs:
        - {port: inputs.jets, name: jet_features}
        - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}
        - {port: inputs.flows, name: flow_features, sequence: true, dyn_axis: n_flows}
        - {port: inputs.electrons, name: electron_features, sequence: true, dyn_axis: n_electrons}
        # clones one Athena jet tensor into the global port (identity here, since
        # global==jets cols)
        - {port: inputs.global, alias: inputs.jets}
