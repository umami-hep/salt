# Thin overlay on GN3V00.yaml: switches the encoder to RMSNorm + hybrid norm
# placement (deep-merged onto GN3V00's encoder block; everything else
# inherited).

include:
  - GN3V00.yaml

name: GN3_Hybrid

model:
  class_path: salt.model.SaltModule
  init_args:
    modules:
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          norm: RMSNorm
          norm_type: hybrid
