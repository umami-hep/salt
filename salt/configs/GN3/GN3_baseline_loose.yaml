# Thin overlay on GN3_baseline.yaml: removes its track constituent cuts (loose
# tracks) via null-deletion.

include:
  - GN3_baseline.yaml

name: GN3_baseline_loose

data:
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        constituent_cuts: null # loose tracks: drop GN3_baseline's d0/shared-hit cuts
