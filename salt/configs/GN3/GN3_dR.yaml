# Thin overlay on GN3_baseline.yaml: retargets the `tracks` stream from the
# ghost-associated tracks to the dR-matched tracks (served stream name stays
# `tracks`, so downstream modules/tasks are untouched). Stack GN3_baseline.yaml
# first, then this overlay.

name: GN3_dR

data:
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          tracks: {global_object: false, dataset: tracks_dr}
