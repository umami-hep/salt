# GN3 dev baseline: base of the GN3_dev overlay stack (loose / dR / flow /
# LepID_SMT / tracklabel layer on top of this). A single track stream feeding
# 3 task heads with LossGLS (every weight == 1.0).

name: GN3_baseline

data:
  batch_size: 2000
  num_workers: 8
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, dataset: tracks_ghost}
        constituent_cuts:
          tracks:
            on_fail: mask # blank a failing track in place (slot + multiplicity kept)
            cuts:
              - d0 < 3.5
              # the FTAG shared-module count, previously the derived 'NSHARED'
              - (numberOfPixelSharedHits + numberOfSCTSharedHits / 2) < 1.1
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks: &gn3_baseline_track_vars
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 2.0e-8, max: 1.0e-4, end: 2.0e-6, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: lion
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: &embed_dim 256
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 4
          num_registers: 8
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: SiLU, gated: true}
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: &gn3_baseline_flavour [bjets, cjets, ujets, taujets]
          weight_source: null
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: &origin_classes
            [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight_source: null
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.model.modules.LossGLS

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

export:
  model_name: GN3baseline # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}

trainer:
  max_epochs: 20
  precision: 32-true
