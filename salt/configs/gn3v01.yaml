# GN3V01 flagship: exercises LossGLS (geometric-mean loss), hybrid norm
# placement, VectorConcat (a 'global' vector stream fed past the encoder and
# concatenated onto the pooled rep), and RegressionTaskModule, together.
# LossGLS requires every loss-producing task weight == 1.0.

name: GN3V01

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
          flows: {global_object: false}
          electrons: {global_object: false}
          # an ordinary [B, F] vector stream, no pad mask
          global: {global_object: true}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          # identity case: 'global' declares the same columns as jets, so the
          # ONNX alias below is an identity clone
          global: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
          flows: [pt, energy, deta, dphi, isCharged]
          electrons:
            [
              pt,
              ptfrac,
              ptrel,
              dr,
              abs_eta,
              eta,
              phi,
              ftag_et,
              qOverP,
              d0RelativeToBeamspot,
              d0RelativeToBeamspotSignificance,
              ftag_ptVarCone30OverPt,
              numberOfPixelHits,
              numberOfSCTHitsInclDead,
              ftag_deltaPOverP,
              eProbabilityHT,
              deltaEta1,
              deltaPhiRescaled2,
              ftag_energyOverP,
              Rhad,
              Rhad1,
              Eratio,
              weta2,
              Rphi,
              Reta,
              wtots1,
              f1,
              f3,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 2.0e-8, max: 1.0e-4, end: 2.0e-6, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: lion
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks, flows, electrons]
          global_object: jets
      # second normaliser: 'global' needs its own global_object slot (jets
      # already fills the one on `norm` above)
      norm_global:
        class_path: salt.model.modules.Normaliser
        init_args:
          streams: [global]
          global_object: global
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: 16
          dense: {hidden_layers: [16], activation: SiLU}
      flow_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: flows
          context: [normed.jets]
          out_dim: 16
          dense: {hidden_layers: [16], activation: SiLU}
      electron_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: electrons
          context: [normed.jets]
          out_dim: 16
          dense: {hidden_layers: [16], activation: SiLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks, flows, electrons]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: 16
          out_dim: 16
          num_layers: 2
          num_registers: 8
          norm: RMSNorm
          norm_type: hybrid
          attention: {num_heads: 2, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      # order matters: pooled rep first, global features last — every GN3
      # task reads this augmented vconcat.global.
      vconcat:
        class_path: salt.model.modules.VectorConcat
        init_args:
          inputs: [pooled.global, normed.global]
          out: vconcat.global
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: vconcat.global
          label: flavour_label
          class_names: [ghostbjets, ghostcjets, ghostsjets, ghostudjets, ghostgjets, ghosttaujets]
          weight_source: null
          dense: {hidden_layers: [16], activation: SiLU}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: vconcat.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight_source: null
          dense: {hidden_layers: [16], activation: SiLU}
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: vconcat.global
          dense: {hidden_layers: [16], activation: SiLU}
      track_type:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: vconcat.global
          label: ftagTruthTypeLabel
          label_map: {-2: 2, -3: 3, 5: 4, -5: 4, 6: 5, -6: 5}
          class_names: [NoTruth, Other, Pion, Kaon, Electron, Muon]
          dense: {hidden_layers: [16], activation: SiLU}
      # ratio target/denominator: pt_btagJes is a declared input Feature
      # (ONNX requires denominators to be declared inputs).
      jet_pt_regression:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: vconcat.global
          targets: ptFromTruthDressedWZJet
          target_denominators: pt_btagJes
          loss: {class_path: torch.nn.L1Loss, init_args: {reduction: none}}
          dense: {hidden_layers: [16], activation: SiLU}
      # 3-class b-jet charge folded from raw PdgId via a ~300-entry label_map
      jets_charge:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: vconcat.global
          label: HadronGhostInitialTruthLabelPdgId
          class_names: [bquark, antibquark, other]
          weight: 1 # the only weight LossGLS allows (== 1.0)
          label_map:
            {
              0: 2, 15: 2, -15: 2, 511: 1, -511: 0, 513: 1, -513: 0, 521: 1, -521: 0,
              523: 1, -523: 0, 10511: 1, -10511: 0, 531: 1, -531: 0, 541: 1, -541: 0,
              543: 1, -543: 0, 10551: 0, 100551: 0, 110551: 1, 20553: 1, 100553: 0,
              100555: 1, 200553: 0, 120553: 1, 551: 0, 553: 1, 555: 0, 431: 2, -431: 2,
              421: 2, -421: 2, 411: 2, -411: 2, 441: 2, 443: 2, 445: 2, 4122: 2,
              -4122: 2, 4132: 2, -4132: 2, 4114: 2, -4114: 2, 4232: 2, -4232: 2,
              4332: 2, -4332: 2, 10441: 2, 10443: 2, 20443: 2, 100441: 2, 100443: 2,
              30443: 2, 5122: 0, -5122: 1, 5132: 0, -5132: 1, 5232: 0, -5232: 1,
              5332: 0, -5332: 1, 4412: 2, 4422: 2, -4412: 2, -4422: 2, 4414: 2,
              4424: 2, -4414: 2, -4424: 2, 4432: 2, -4432: 2, 4434: 2, -4434: 2,
              4444: 2, -4444: 2, -4322: 2, 4322: 2, 5142: 0, 5242: 0, -5142: 1,
              -5242: 1, 5412: 0, 5422: 0, -5412: 1, -5422: 1, 5414: 0, 5424: 0,
              -5414: 1, -5424: 1, 5342: 0, -5342: 1, 5432: 0, -5432: 1, 5434: 0,
              -5434: 1, 5442: 0, -5442: 1, 5444: 0, -5444: 1, 5512: 0, -5512: 1,
              5522: 0, -5522: 1, 5514: 0, -5514: 1, 5532: 0, -5532: 1, 5534: 0,
              -5534: 1, 5542: 0, -5542: 1, 5544: 0, -5544: 1, 5554: 0, -5554: 1,
              20433: 2, -20433: 2, 10431: 2, -10431: 2, 4334: 2, -4334: 2, 4324: 2,
              -4324: 2, 4314: 2, -4314: 2, 4312: 2, -4312: 2, 4224: 2, -4224: 2,
              4222: 2, -4222: 2, 4214: 2, -4214: 2, 4212: 2, -4212: 2, 4112: 2,
              -4112: 2, 433: 2, -433: 2, 425: 2, -425: 2, 423: 2, -423: 2, 413: 2,
              -413: 2, 14122: 2, -14122: 2, 10433: 2, -10433: 2, 10423: 2, -10423: 2,
              10421: 2, -10421: 2, 10413: 2, -10413: 2, 10411: 2, -10411: 2, 4124: 2,
              -4124: 2, 20413: 2, -20413: 2, 20423: 2, -20423: 2, 9010443: 2, 435: 2,
              -435: 2, 415: 2, -415: 2, -5334: 1, 5334: 0, 5324: 0, -5324: 1, 5322: 0,
              -5322: 1, 5314: 0, -5314: 1, 5312: 0, -5312: 1, 5224: 0, -5224: 1,
              5222: 0, -5222: 1, 5214: 0, -5214: 1, 5212: 0, -5212: 1, 5114: 0,
              -5114: 1, 5112: 0, -5112: 1, 533: 1, -533: 0,
            }
          dense: {hidden_layers: [16], activation: SiLU}
      loss:
        class_path: salt.model.modules.LossGLS

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing, track_type, jet_pt_regression, jets_charge]
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

export:
  model_name: GN3V01 # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}
    - {port: inputs.flows, name: flow_features, sequence: true, dyn_axis: n_flows}
    - {port: inputs.electrons, name: electron_features, sequence: true, dyn_axis: n_electrons}
    # clones one Athena jet tensor into the global port (identity here, since
    # global==jets cols)
    - {port: inputs.global, alias: inputs.jets}

trainer:
  max_epochs: 2
