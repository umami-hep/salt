# GN2 with muP (Maximal Update Parametrization): hyper-parameters (LR, init
# scale) tuned at a small width transfer as the width grows. `mup: true` on
# track_embed/encoder + an explicit `model.init_args.mup.apply_to` module list.

name: GN2_muP

data:
  batch_size: 400
  num_workers: 40
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    # auto-swapped to mup.optim.MuAdamW because the mup block below is configured
    optimizer: AdamW
    mup:
      # shape_path is a REQUIRED override — generate with `salt mup-shapes`
      # and point fit/test/onnx at the resulting file.
      shape_path: shape_mup.bsh
      apply_to: [track_embed, encoder]
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: 256
          dense: {hidden_layers: [256], activation: ReLU}
          mup: true
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
          mup: true # swaps the out projection to a MuReadout
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, ujets]
          dense: {hidden_layers: [128, 64, 32], activation: ReLU, dropout: 0.1}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU, dropout: 0.1}
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU, dropout: 0.1}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

export: # inert during fit/test
  model_name: GN2muP # Athena name: no '_'/'-'
  inputs:
    - { port: inputs.jets, name: jet_features }
    - { port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks }
  # the MuReadout out-proj is folded to a plain nn.Linear at trace time, so
  # the ONNX graph is a standard transformer.

trainer:
  max_epochs: 40
  precision: 32-true
