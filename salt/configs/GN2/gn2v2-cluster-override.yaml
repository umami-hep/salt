# Cluster deltas for the v2 half of the GN2 before/after retraining gate.
# Stack on top of gn2v2-opendata.yaml:
#   salt fit --config salt/configs/gn2v2-opendata.yaml --config salt/configs/GN2/gn2v2-cluster-override.yaml ...
# Switches the encoder to flash-varlen attention, runs 10 epochs at 16-mixed
# on GPU, and checkpoints every epoch (save_top_k: -1) to match the v1 policy.

name: GN2v2opendata

model:
  class_path: salt.model.SaltModule
  init_args:
    modules:
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: 256
          out_dim: 128
          num_layers: 4
          attention: {num_heads: 8, attn_type: flash-varlen}
          dense: {activation: ReLU, gated: false}

callbacks:
  loss_history:
    class_path: salt.utils.loss_history.LossHistoryWriter
  checkpoint:
    class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/loss
      mode: min
      save_top_k: -1
      # keep in sync with the salt-test no-ckpt_path fallback glob (salt/configs/base2.yaml)
      filename: "epoch={epoch:03d}-loss={val/loss:.5f}"
      auto_insert_metric_name: false

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 16-mixed
