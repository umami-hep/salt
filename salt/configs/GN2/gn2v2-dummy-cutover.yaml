# Overlay on gn2v2-dummy.yaml: an H5-only eval (no ONNX export). The base wires
# jets_classification to both test + export; this overlay flips it to test-only
# so the run-free ONNX parse assembles NO tuple (matching a config that
# historically dropped its OnnxExportSink). H5 columns are unchanged. Stack as:
#   salt test --config salt/configs/GN2/gn2v2-dummy.yaml --config salt/configs/GN2/gn2v2-dummy-cutover.yaml ...

outputs:
  # H5-only: no RunTaskOutput opts into export, so no implicit ONNX sink is wired
  jets_out:
    class_path: salt.outputs.RunTaskOutput
    init_args: {modes: [test]}
