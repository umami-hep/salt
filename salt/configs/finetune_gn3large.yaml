# Fine-tuning overlay TEMPLATE — same-heads fine-tune of a pretrained tagger.
#
# This is an OVERLAY, not a standalone config: stack it on a saved run's
# `config.yaml` and warm-start from that run's checkpoint. It keeps the model's
# existing task heads and adapts them (plus, in the second stage, the whole
# network) to a new dataset.
#
#   salt fit \
#     --config <saved_gn3large_config.yaml> \
#     --config salt/configs/finetune_gn3large.yaml \
#     --init_from <pretrained.ckpt> \
#     --data.train_file <new_campaign/train.h5> \
#     --data.val_file   <new_campaign/val.h5>
#
# Before running, REPLACE the placeholders above with your real config,
# checkpoint, and data paths. The names in `trainable:` must be real
# `model.modules` keys of your base config — `jets_classification` is the
# flavour head across the GN3 family (see salt/configs/GN3V00.yaml).
#
# Walk-through: docs/tutorials/finetuning.md (worked example A).

training_schedule:
  stages:
    head_warmup:
      epochs: 5
      trainable: [jets_classification]  # complement (backbone + other heads) frozen + eval()
      lrs:
        max: 1.0e-4                      # per-stage lrs deep-merges over the base config's lrs
    full_finetune:
      frozen: []                         # unfreeze everything; epochs omitted = remaining epochs
      lrs:
        initial: 1.0e-7
        max: 1.0e-5

trainer:
  max_epochs: 15                         # 5 warm-up + 10 full fine-tune
