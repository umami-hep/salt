# MaskFormer vertexing tagger: a single `tracks` stream is embedded, encoded,
# and decoded by a `MaskDecoder` (5 learnable object queries -> b/c/null class
# + per-track mask), matched against truth hadrons via MaskFormerMatchedLoss.

name: MaskFormer

data:
  batch_size: 4000
  num_workers: 40
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
          # truth-hadron object group read by MaskFormerTargets to build
          # object_class + masks
          truth_hadrons: {global_object: false}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}
    mf_targets:
      class_path: salt.data.MaskFormerTargets
      init_args:
        object_stream: truth_hadrons
        object_class: flavour
        object_id: barcode
        constituent_stream: tracks
        constituent_id: ftagTruthParentBarcode
        num_objects: 5 # == the decoder query bank (declared label M dim)
        # opts in to object selection (PV-pin + truncate-to-5); the
        # truth_hadrons reader group is left untruncated above so this
        # selection owns the truncation, avoiding a double-truncate.
        max_objects: 5
        pv_class: 0 # b-class mapped index (the PV pin)
        # null class key is quoted "null" — an unquoted `null:` would parse
        # to a Python None key; MaskFormerTargets accepts both but this is
        # explicit. null must be LAST.
        class_map:
          b: {raw: 5, mapped: 0}
          c: {raw: 4, mapped: 1}
          "null": {raw: -1, mapped: 2}
        regression_targets: [pt, Lxy, deta, dphi, mass]

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: &embed_dim 256
          dense: {hidden_layers: [256], activation: ReLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: *embed_dim
          num_layers: 4
          attention: {num_heads: 8, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
          num_registers: 1
          drop_registers: true # registers visible to attention, stripped from encoded.seq
      mask_decoder:
        class_path: salt.model.modules.MaskDecoder
        init_args:
          input: encoded.seq # register-free encoder output
          embed_dim: *embed_dim
          num_objects: 5
          num_layers: 3
          md: {n_heads: 8, mask_attention: true, bidirectional_ca: true}
          class_net: {output_size: 3} # b, c, null — null LAST
          mask_net: {}
      # instance name `regression` so its port is `preds.objects.regression` —
      # the key the matched loss + object writer read.
      regression:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: objects
          input: objects.embed # decoder query embeddings (per-object)
          sequence: true # per-object (M queries) regression
          targets: [pt, Lxy, deta, dphi, mass]
          scaler:
            pt: {op: log, op_scale: 0.2}
            Lxy: {op: log, x_off: 1}
            deta: {op: linear, x_off: 1, op_scale: 10}
            dphi: {op: linear, x_off: 1, op_scale: 10}
            mass: {op: log, op_scale: 0.1}
          weight: 0.5
          loss: {class_path: torch.nn.L1Loss, init_args: {reduction: none}}
          # scaled targets published in FIT|VAL as a matcher cost term
          publish_targets: true
          # exposed for the matched loss (FIT|VAL) and the ONNX leading_object
          # reduce, but NOT TEST — no v2 writer emits per-object regression in
          # TEST yet, so exposing it there would be an unconsumed dead-pred.
          expose: [fit, val, onnx]
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      mf_matched_loss:
        class_path: salt.model.modules.MaskFormerMatchedLoss # FIT|VAL only
        init_args:
          num_classes: 2 # non-null classes (b, c)
          num_objects: 5 # == the decoder query bank M
          null_class_weight: 0.5
          # mask_ce (binary cross-entropy) is deliberately used, not mask_focal
          loss_weights: {object_class_ce: 2.0, mask_ce: 10.0, mask_dice: 2.0, regression: 2.0}
      # the SINGLE MaskFormer object reconstruction node, serving BOTH modes:
      # ONNX mints the export leaves outputs.objects.leading_object
      # (leading-object regression scalars) + outputs.tracks.HadronIndex
      # (reordered per-constituent index); TEST mints outputs.tracks.HadronIndex
      # from the RAW masks (the eval-H5 HadronIndex, indices_from_mask + pad->-1).
      # `index_name: HadronIndex` is the SINGLE source of the index name — the
      # h5_output object group / OnnxExportSink derive their column / ONNX suffix
      # from the leaf's terminal segment (no sink-side respelling).
      # Demand-gated: FIT/VAL prune it; the h5_output object group / OnnxExportSink
      # pull it into TEST / ONNX respectively. (Instance name kept for ONNX
      # plan-hash stability — it now serves TEST too.)
      maskformer_objects_onnx:
        class_path: salt.outputs.MaskFormerObjects
        init_args:
          n_reg: 5 # == len(regression.targets)
          regression_task: regression
          stream: objects
          constituent_stream: tracks
          index_name: HadronIndex # single-source: eval-H5 column + ONNX suffix derive from this
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [bjets, cjets, ujets]
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin]
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

callbacks:
  # consumes matched.objects.* -> keeps the matched loss alive under pruning
  maskformer_metrics:
    class_path: salt.callbacks.MaskformerMetrics
  h5_output:
    class_path: salt.outputs.H5OutputSink
    init_args:
      # the MaskFormer object eval-H5 groups, declared as generic structured
      # object groups fed from bundle leaves (the sink has no MaskFormer
      # knowledge): objects [B, M] (raw class probs + truth class_label),
      # object_masks [B, M, T] (truth mask + raw mask logits), and the tracks
      # HadronIndex column (from the MaskFormerObjects TEST reconstruction leaf).
      object_groups:
        - name: objects
          shape: [5] # == num_objects M (the decoder query bank)
          fields:
            - {leaf: objects.class_probs, suffixes: [pb, pc, pnull], dtype: f4}
            - {leaf: labels.objects.object_class, suffixes: [class_label], dtype: i8,
               prefix: false, kind: label}
        - name: object_masks
          shape: [5, tracks] # M, then the file constituent (tracks) width
          fields:
            - {leaf: labels.objects.masks, suffixes: [truth_mask], dtype: i8,
               prefix: false, kind: label}
            - {leaf: objects.masks, suffixes: [mask_logits], dtype: f4, prefix: false}
        - name: tracks # the reader stream the per-token HadronIndex column rides
          # single-source: the column suffix defaults to the leaf terminal (HadronIndex)
          fields:
            - {leaf: outputs.tracks.HadronIndex, dtype: i8}
  onnx_export:
    class_path: salt.outputs.OnnxExportSink
    init_args:
      outputs:
        - key: outputs.objects.leading_object
          names: [leading_objects_pt, leading_objects_Lxy, leading_objects_deta,
                  leading_objects_dphi, leading_objects_mass]
        # single-source: the ONNX suffix defaults to the leaf terminal (HadronIndex)
        - key: outputs.tracks.HadronIndex
          dtype: int8
          per_token: true

export:
  model_name: MFv2 # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}

trainer:
  max_epochs: 40
