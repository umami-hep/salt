name: regression_example

model:
  model:
    class_path: salt.models.SaltModel
    init_args:
      init_nets:
        - input_name: tracks
          dense_config:
            input_size: 21
            output_size: &embed_dim 128
            hidden_layers: [256]
            activation: &activation SiLU

      pool_net:
        class_path: salt.models.GlobalAttentionPooling
        init_args: { input_size: *embed_dim }

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: salt.models.MixtureDensityTask
              init_args:
                name: mdn_regression
                input_name: jets
                targets: HadronConeExclTruthLabelPt
                n_components: 4
                norm_params: { mean: 1.0, std: 1.0 }
                # no `loss` entry: the mixture NLL is constructed internally
                dense_config:
                  input_size: *embed_dim
                  output_size: 12 # must equal 3 * n_components
                  hidden_layers: [128, 64, 32]
                  activation: *activation

            - class_path: salt.models.MixtureDensityTask
              init_args:
                name: mdn_regression_no_global_object
                custom_output_names: dummyOutput_dPhi
                input_name: tracks
                targets: dphi
                n_components: 2
                norm_params: { mean: 1.0, std: 1.0 }
                dense_config:
                  input_size: *embed_dim
                  output_size: 6 # must equal 3 * n_components
                  hidden_layers: [128, 64, 32]
                  activation: *activation

data:
  variables:
    jets:
      - pt_btagJes
      - eta_btagJes
    tracks:
      - d0
      - z0SinTheta
      - dphi
      - deta
      - qOverP
      - IP3D_signed_d0_significance
      - IP3D_signed_z0_significance
      - phiUncertainty
      - thetaUncertainty
      - qOverPUncertainty
      - numberOfPixelHits
      - numberOfSCTHits
      - numberOfInnermostPixelLayerHits
      - numberOfNextToInnermostPixelLayerHits
      - numberOfInnermostPixelLayerSharedHits
      - numberOfInnermostPixelLayerSplitHits
      - numberOfPixelSharedHits
      - numberOfPixelSplitHits
      - numberOfSCTSharedHits
