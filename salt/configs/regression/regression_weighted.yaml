# Per-sample-weighted RegressionTaskModule family: an encoder-less DiPS body
# feeding pooled regression heads, each with a `sample_weight:` label that
# multiplies the per-element loss (so every weighted head needs loss
# reduction: none). One head (no_global_object) is a per-track sequence head
# with no weighting or pooling.

name: regression_weighted

data:
  batch_size: 100
  num_workers: 0
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt_btagJes, eta_btagJes, mass] # mass: reg_weighted_multi_ratio denominator
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 1.0e-3, end: 1.0e-5, pct_start: 0.01}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: 128
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.model.modules.Concat # one stream -> seq.x/seq.mask (no encoder)
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args:
          input: seq.x # the Concat output (encoder-less: no encoded.seq)
          out: pooled.global
      reg_weighted:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          norm_params: {mean: 1.0, std: 1.0}
          sample_weight: sample_weight # labels.jets.sample_weight (FIT|VAL)
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_weighted_multi:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          norm_params: {mean: [1.0, 2.0], std: [3.0, 4.0]}
          sample_weight: sample_weight # expanded across targets
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_weighted_ratio:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets: HadronConeExclTruthLabelPt
          target_denominators: pt_btagJes # a declared input Feature (ONNX source)
          custom_output_names: pt
          sample_weight: sample_weight
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_weighted_multi_ratio:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          targets:
            [R10TruthLabel_R22v1_TruthJetMass, R10TruthLabel_R22v1_TruthJetPt]
          target_denominators: [mass, pt_btagJes] # both declared input Features (ONNX sources)
          custom_output_names: [truthMass, truthPt]
          sample_weight: sample_weight # expanded across targets
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      reg_weighted_no_global_object:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          # per-track sequence head, reads embed.tracks directly (no pool), so
          # no global_object context; unweighted, so plain MSELoss (mean) is correct.
          stream: tracks
          input: embed.tracks
          sequence: true
          targets: [dphi, deta]
          custom_output_names: [dummyOutput_dPhi, dummyOutput_dEta]
          loss: torch.nn.MSELoss
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [reg_weighted, reg_weighted_multi, reg_weighted_ratio, reg_weighted_multi_ratio, reg_weighted_no_global_object]

export:
  model_name: regressionWeighted # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}
  # sample_weight is a FIT|VAL-only label, absent from the export graph.

trainer:
  max_epochs: 2
