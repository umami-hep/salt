# Particle Transformer (ParT, CMS, arXiv:2202.03772) expressed with Salt primitives.
# ParT = pairwise interaction bias (P-MHA) added to the pre-softmax attention logits
# (EdgeAttention) + standard multi-head attention + standard 2-layer FFN + a class-attention
# pooling head. No talking-heads, no LayerScale, no stochastic depth, no post-softmax gate.
# DeParT.yaml extends this baseline with the four DeParT tricks.
# Data/tasks follow the GN3 dataset (see GN3/GN3V00.yaml); edges use the track-pair
# features computable from that dump (dR/kt/z from pt + jet-relative deta/dphi).

name: ParT

data:
  batch_size: 1000
  num_workers: 20
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, dataset: tracks_ghost}
    features:
      class_path: salt.data.Features
      init_args:
        non_finite_to_num: true
        variables:
          jets: [pt_btagJes, eta_btagJes]
          tracks:
            [
              pt, # needed for the kt/z edge features
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              lifetimeSignedD0Significance,
              lifetimeSignedZ0SinThetaSignificance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
              leptonID,
              muon_quality,
              muon_qOverPratio,
              muon_momentumBalanceSignificance,
              muon_scatteringNeighbourSignificance,
            ]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-7, pct_start: 0.1, weight_decay: 1.0e-5}
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks]
          global_object: jets
      # pairwise edge features on the raw (un-normalised) tracks
      edge_features:
        class_path: salt.model.modules.EdgeFeatures
        init_args:
          stream: tracks
          features: [dR, kt, z, isSelfLoop]
      edge_embed:
        class_path: salt.model.modules.EdgeEmbed
        init_args:
          stream: tracks
          out_dim: &edge_embed_dim 32
          dense: {hidden_layers: [32], activation: &activation GELU}
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: &embed_dim 128
          dense: {hidden_layers: [256], activation: *activation}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [tracks]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 8
          norm: LayerNorm
          edges: edges.tracks_emb
          edge_embed_dim: *edge_embed_dim
          update_edges: true
          # keep one register as a NaN-guard for empty jets but drop it before pooling
          # (faithful ParT: the class-attention head sees only real constituents)
          drop_registers: true
          # standard 2-layer FFN (no gating)
          dense: {activation: *activation, gated: false}
          # faithful ParT self-attention: interaction bias only, no talking-heads, no gate
          attention: {num_heads: 8, talking_heads: false, edge_gate: false}
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [tracks]}
      # class-attention pooling head: a learned class token cross-attends to the constituents
      pool:
        class_path: salt.model.modules.ClassAttentionPooling
        init_args:
          input: encoded.seq
          out: pooled.global
          num_layers: 2
          ls_init: null # faithful ParT: no LayerScale (added only in DeParT)
          dense: {activation: *activation, gated: false}
          attention: {num_heads: 8}
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names:
            [ghostbjets, ghostcjets, ghostsjets, ghostudjets, ghostgjets, ghosttaujets]
          weight_source: null
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128, 64, 32], activation: *activation}
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight: 0.5
          weight_source: null
          loss: torch.nn.CrossEntropyLoss
          dense: {hidden_layers: [128, 64, 32], activation: *activation}
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          weight: 1.5
          dense: {hidden_layers: [128, 64, 32], activation: *activation}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [tracks]}
  onnx_export:
    class_path: salt.outputs.OnnxExportSink
    init_args:
      model_name: ParT # Athena name: no '_'/'-'
      inputs:
        - {port: inputs.jets, name: jet_features}
        # dynamic sequence length — edge tensors are derived from this axis.
        - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 4
  num_nodes: 4
  precision: bf16-mixed
