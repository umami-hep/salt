# Data-only overlay on GN3_baseline -> loose -> flow: adds lepton-ID +
# soft-muon-tagging track variables. The model graph is unchanged (StreamEmbed
# input width is inferred at bind time). Stack as:
#   salt ... -c GN3_baseline.yaml -c GN3_baseline_loose.yaml -c GN3_flow.yaml -c GN3_LepID_SMT.yaml

name: GN3_LepID_SMT

data:
  modules:
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              IP3D_signed_d0_significance,
              IP3D_signed_z0_significance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
              leptonID,
              muon_quality,
              muon_qOverPratio,
              muon_momentumBalanceSignificance,
              muon_scatteringNeighbourSignificance,
            ]
