# Minimal jet-flavour tagger trained directly on easyjet AnalysisMiniTree ROOT
# ntuples via EasyjetReader (no H5 pre-processing). Jets are a per-event
# jagged sequence, treated as a token sequence; the classification head runs
# per-jet on HadronConeExclTruthLabelID. No tracks — easyjet output has none.

name: easyjet_flavour

data:
  batch_size: 1000
  num_workers: 4
  modules:
    reader:
      class_path: salt.data.EasyjetReader
      init_args:
        tree: AnalysisMiniTree
        groups:
          jets:
            jagged: true
            truncate: 20
            branches:
              pt: recojet_antikt4PFlow_pt_NOSYS
              eta: recojet_antikt4PFlow_eta
              phi: recojet_antikt4PFlow_phi
              m: recojet_antikt4PFlow_m_NOSYS
              GN2v01_pb: recojet_antikt4PFlow_GN2v01_pb
              GN2v01_pc: recojet_antikt4PFlow_GN2v01_pc
              GN2v01_pu: recojet_antikt4PFlow_GN2v01_pu
              HadronConeExclTruthLabelID: recojet_antikt4PFlow_HadronConeExclTruthLabelID
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt, eta, phi, m, GN2v01_pb, GN2v01_pc, GN2v01_pu]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets]
      jet_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: jets
          out_dim: 128
          dense: {hidden_layers: [128], activation: ReLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [jets]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: 128
          out_dim: 128
          num_layers: 2
          attention: {num_heads: 4, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      split:
        class_path: salt.model.modules.Split
        init_args: {streams: [jets]}
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          label: HadronConeExclTruthLabelID
          class_names: [bjets, cjets, taujets, ujets]
          # HadronConeExclTruthLabelID -> 4-class index: 5=b->0, 4=c->1, 15=tau->2, 0=light->3
          label_map: {5: 0, 4: 1, 15: 2, 0: 3}
          dense: {hidden_layers: [128, 64], activation: ReLU}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [jets]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args: {tasks: [jets_classification], modes: [test]}
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args: {streams: [jets]} # jets is a padded sequence stream here

trainer:
  max_epochs: 20
  precision: 32-true
