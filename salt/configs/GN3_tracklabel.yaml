# Overlay on GN3_baseline -> loose -> flow -> LepID_SMT: adds a 10-class
# signed track_type head and a 7-class track_source head (no regression task
# in this variant). Stack with:
#   salt ... -c GN3_baseline.yaml -c GN3_baseline_loose.yaml -c GN3_flow.yaml \
#     -c GN3_LepID_SMT.yaml -c GN3_tracklabel.yaml

name: GN3_tracklabel

model:
  class_path: salt.model.SaltModule
  init_args:
    modules:
      track_type:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthTypeLabel
          label_map: {-6: 0, -5: 1, -3: 2, -2: 3, 0: 4, 1: 5, 2: 6, 3: 7, 5: 8, 6: 9}
          class_names:
            [NegMuon, NegElectron, NegKaon, NegPion, NoTruth, Other, Pion, Kaon, Electron, Muon]
          weight_source: null
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}
      track_source:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthSourceLabel
          # `Src`-prefixed: track_origin/track_type/track_source share the
          # `tracks` stream and their raw label names collide
          # (NoTruth, FromB/BC/C/Tau) — prefixing keeps output columns unique.
          class_names:
            [
              SrcNoTruth,
              SrcFromB,
              SrcFromBC,
              SrcFromC,
              SrcFromTau,
              SrcFromFragmentation,
              SrcFromSecondary,
            ]
          weight_source: null
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}

# run_tasks is a list, so cross-config merge REPLACES it — this overlay must
# restate the full 5-task list, not just the two heads it adds.
outputs:
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing, track_type, track_source]
