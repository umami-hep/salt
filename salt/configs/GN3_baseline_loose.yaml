# Thin overlay on GN3_baseline.yaml: removes its track selections (loose
# tracks) via null-deletion. Stack GN3_baseline.yaml first, then this overlay.

name: GN3_baseline_loose

data:
  modules:
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        selections: null # loose tracks: drop GN3_baseline's d0/NSHARED cuts
