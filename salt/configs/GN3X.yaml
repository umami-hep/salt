# Boosted GN3X: two-stream (tracks + flow) body feeding 3 task heads, with
# LossGLS (geometric mean), the lion optimiser, and an on-the-fly 9-class
# boosted-flavour labeller (classes derived from R10TruthLabel + ghost counts).

name: GN3XPV01

data:
  batch_size: 2500
  num_workers: 10
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, truncate: 100}
          flow: {global_object: false, truncate: 100}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          jets: [pt, eta, mass]
          tracks:
            [
              d0,
              z0SinTheta,
              dphi,
              deta,
              qOverP,
              lifetimeSignedD0Significance,
              lifetimeSignedZ0SinThetaSignificance,
              phiUncertainty,
              thetaUncertainty,
              qOverPUncertainty,
              numberOfPixelHits,
              numberOfSCTHits,
              numberOfInnermostPixelLayerHits,
              numberOfNextToInnermostPixelLayerHits,
              numberOfInnermostPixelLayerSharedHits,
              numberOfInnermostPixelLayerSplitHits,
              numberOfPixelSharedHits,
              numberOfPixelSplitHits,
              numberOfSCTSharedHits,
              leptonID,
            ]
          flow: [flow_pt, flow_energy, flow_deta, flow_dphi]
    labels:
      class_path: salt.core.data.Labels
      init_args:
        dtype_policy: int64-for-int
    ftag_labeller:
      class_path: salt.core.data.FtagLabeller
      init_args:
        # class_names must match jets_classification.class_names index-for-index.
        stream: jets
        label: flavour_label
        require_labels: True
        class_names: [htautauhad, hbb, hcc, top, qcdbb, qcdbx, qcdcx, qcdll, Wqq]

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 2.0e-8, max: 1.0e-5, end: 2.0e-6, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: lion
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets, tracks, flow]
          global_object: jets
      track_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: tracks
          context: [normed.jets]
          out_dim: &embed_dim 16
          dense: {hidden_layers: [16], activation: ReLU}
      flow_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: flow
          context: [normed.jets]
          out_dim: *embed_dim # equal embed width is a Concat constraint
          dense: {hidden_layers: [16], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks, flow]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 16
          num_layers: 2
          num_registers: 8
          attention: {num_heads: 2, attn_type: torch-math}
          dense: {activation: ReLU, gated: true, dropout: 0.1}
      split:
        # only tracks has per-token tasks
        class_path: salt.core.nn.Split
        init_args: {streams: [tracks]}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      jets_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          label: flavour_label
          class_names: [htautauhad, hbb, hcc, top, qcdbb, qcdbx, qcdcx, qcdll, Wqq]
          # explicit per-class weights (a loss kwarg, distinct from the
          # per-task scalar weight LossGLS requires to stay at 1.0)
          loss:
            class_path: torch.nn.CrossEntropyLoss
            init_args:
              weight: [8.0, 2.0, 2.0, 4.0, 20.0, 20.0, 10.0, 1.5, 16.0]
          dense: {hidden_layers: [16], activation: ReLU}
      track_origin:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          label: ftagTruthOriginLabel
          class_names: [Pileup, Fake, Primary, FromB, FromBC, FromC, FromTau, OtherSecondary]
          weight_source: null
          dense: {hidden_layers: [16], activation: ReLU}
      track_vertexing:
        class_path: salt.core.nn.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel # declared dependency for origin-weighted loss
          context: pooled.global
          dense: {hidden_layers: [16], activation: ReLU}
      loss:
        class_path: salt.core.nn.LossGLS

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [jets, tracks]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing]
  pad_mask:
    class_path: salt.core.outputs.PadMaskWriter
    init_args: {streams: [tracks]}

export:
  model_name: GN3XPV01 # Athena name: no '_'/'-'
  inputs:
    - {port: inputs.jets, name: jet_features}
    - {port: inputs.tracks, name: track_features, sequence: true, dyn_axis: n_tracks}
    - {port: inputs.flow, name: flow_features, sequence: true, dyn_axis: n_flow}

trainer:
  max_epochs: 25
  precision: 32-true
