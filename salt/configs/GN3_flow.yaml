# Overlay on GN3_baseline.yaml (+ GN3_baseline_loose.yaml): adds a pflow
# stream. Note the served stream is `flow`, mapped from the `flows` H5
# dataset. Feeds the encoder attention but has no task, so it is not split
# out. List-valued init_args (Normaliser/Concat streams) replace rather than
# merge across configs, so the full lists are re-stated here. Stack as:
#   salt ... -c GN3_baseline.yaml -c GN3_baseline_loose.yaml -c GN3_flow.yaml

name: GN3_flow

data:
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          jets: {global_object: true}
          tracks: {global_object: false, dataset: tracks_ghost}
          flow: {global_object: false, dataset: flows}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          flow: [pt, energy, deta, dphi, isCharged]

model:
  class_path: salt.core.SaltModule
  init_args:
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          streams: [jets, tracks, flow]
          global_object: jets
      flow_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: flow
          context: [normed.jets]
          out_dim: 256
          dense: {hidden_layers: [256], activation: SiLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [tracks, flow]}
