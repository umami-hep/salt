# HH ggF-vs-VBF event classifier + truth-mHH regression. Event-level model:
# per-event reconstructed objects are embedded, encoded, pooled, and fed to
# two heads on the `events` global stream. No ONNX export — the mHH_regression
# ratio denominator (mHH) is not a declared input Feature, only a label, so it
# has no export-time source (fit/test only).

name: event_classifier

data:
  batch_size: 1000
  num_workers: 4
  modules:
    reader:
      class_path: salt.core.data.H5StructuredReader
      init_args:
        groups:
          events: {global_object: true, dataset: event_vars}
          objects: {global_object: false, dataset: objects_vars}
    features:
      class_path: salt.core.data.Features
      init_args:
        variables:
          # mHH is deliberately absent — mHH_regression sources it from
          # labels.events.mHH in TEST instead (see header).
          events: [mBB]
          objects: [type, pt, eta, phi, mass, btag, tauId]
    labels:
      class_path: salt.core.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.core.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.core.nn.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [events, objects]
          global_object: events
      object_embed:
        class_path: salt.core.nn.StreamEmbed
        init_args:
          stream: objects
          out_dim: &embed_dim 64
          dense: {hidden_layers: [256, 128, 64], activation: ReLU}
      concat:
        class_path: salt.core.nn.Concat
        init_args: {streams: [objects]}
      encoder:
        class_path: salt.core.nn.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 6
          attention: {num_heads: 4, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      pool:
        class_path: salt.core.nn.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      events_classification:
        class_path: salt.core.nn.tasks.ClassificationTaskModule
        init_args:
          stream: events
          input: pooled.global
          label: signalType
          class_names: [ggF, VBF]
          dense: {hidden_layers: [128, 64, 32], activation: ReLU, dropout: 0.1}
      mHH_regression:
        class_path: salt.core.nn.tasks.RegressionTaskModule
        init_args:
          stream: events
          input: pooled.global
          targets: truthMHH
          target_denominators: mHH # label, not a Feature — see header
          loss: {class_path: torch.nn.MSELoss, init_args: {reduction: none}}
          dense: {hidden_layers: [128, 64, 32], activation: ReLU}
      loss:
        class_path: salt.core.nn.LossSum

outputs:
  inputs_copy:
    class_path: salt.core.outputs.InputCopyWriter
    init_args: {streams: [events]}
  run_tasks:
    class_path: salt.core.outputs.RunTaskOutput
    init_args: {tasks: [events_classification, mHH_regression], modes: [test]}

trainer:
  max_epochs: 30
