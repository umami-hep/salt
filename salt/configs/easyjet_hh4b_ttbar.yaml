# Event-level signal-vs-background classifier trained directly on two
# per-sample easyjet AnalysisMiniTree ROOT ntuples via MultiSampleReader (no
# UPP/umami pre-resampling). Signal (HH->4b, mc23) and background (ttbar,
# mc20) are read by their own EasyjetReader sub-readers and proportionally
# interleaved, with a per-event sample label injected as raw.event.process.
# Only branches common to both campaigns are used.

name: easyjet_hh4b_ttbar

data:
  batch_size: 1000
  num_workers: 4
  # placeholder stage keys — ignored by MultiSampleReader, which sources per
  # sample via `sources:` below; these only satisfy the datamodule's
  # non-None file check.
  train_file: train
  val_file: val
  test_file: test
  modules:
    reader:
      class_path: salt.data.MultiSampleReader
      init_args:
        label_stream: event
        label_field: process
        samples:
          - name: signal
            label: 1
            reader:
              class_path: salt.data.EasyjetReader
              init_args:
                tree: AnalysisMiniTree
                groups: &ej_groups
                  jets:
                    jagged: true
                    truncate: 20
                    branches:
                      pt: recojet_antikt4PFlow_pt_NOSYS
                      eta: recojet_antikt4PFlow_eta
                      phi: recojet_antikt4PFlow_phi
                      m: recojet_antikt4PFlow_m_NOSYS
                      GN2v01_pb: recojet_antikt4PFlow_GN2v01_pb
                      GN2v01_pc: recojet_antikt4PFlow_GN2v01_pc
                      GN2v01_pu: recojet_antikt4PFlow_GN2v01_pu
                  event:
                    jagged: false
                    branches:
                      eventNumber: eventNumber
                      mcChannelNumber: mcChannelNumber
            # sources: REQUIRED override per stage — signal files
          - name: background
            label: 0
            reader:
              class_path: salt.data.EasyjetReader
              init_args:
                tree: AnalysisMiniTree
                groups: *ej_groups
            # sources: REQUIRED override per stage — ttbar files
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets: [pt, eta, phi, m, GN2v01_pb, GN2v01_pc, GN2v01_pu]
    labels:
      class_path: salt.data.Labels
      init_args: {dtype_policy: int64-for-int}

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-7, max: 5.0e-4, end: 1.0e-5, pct_start: 0.01, weight_decay: 1.0e-5}
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          # norm_dict must be supplied via CLI/override at fit time.
          streams: [jets]
      jet_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: jets
          out_dim: &embed_dim 128
          dense: {hidden_layers: [128], activation: ReLU}
      concat:
        class_path: salt.model.modules.Concat
        init_args: {streams: [jets]}
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: *embed_dim
          out_dim: &out_dim 128
          num_layers: 2
          attention: {num_heads: 4, attn_type: torch-math}
          dense: {activation: ReLU, gated: false}
      pool:
        # event representation: globally attention-pool the jet tokens (no Split)
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args: {input: encoded.seq, out: pooled.global}
      events_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: event
          input: pooled.global
          label: process
          class_names: [background, signal] # index 0 = bg (label 0), 1 = signal
          dense: {hidden_layers: [128, 64, 32], activation: ReLU, dropout: 0.1}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args: {streams: [event]}
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args: {tasks: [events_classification], modes: [test]}

trainer:
  max_epochs: 20
  precision: 32-true
