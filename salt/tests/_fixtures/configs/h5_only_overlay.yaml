# TEST FIXTURE — not a shipped config. Overlay on salt/configs/gn2v2-opendata.yaml
# flipping the task family to test-only, so the run-free ONNX parse assembles no
# tuple at all. H5 columns are unchanged.

outputs:
  # H5-only: no RunTaskOutput opts into export, so no ONNX leaf is minted; null
  # the shipped config's inherited onnx_export sink too, or a zero-leaf
  # OnnxExportSink would contradict "no ONNX tuple" (post-shim, sinks are
  # declared unconditionally in outputs:, not implicitly wired on export opt-in).
  jets_out:
    class_path: salt.outputs.RunTaskOutput
    init_args: {modes: [test]}
  onnx_export: null
