# NEGATIVE fixture (plan 03 stage F): identical to toy.yaml except head.embed_key
# is typo'd ('embed.y' instead of 'embed.x'). `salt graph validate` must fail with
# a §4.1-quality ConnectivityError naming the consumer ('head'), the missing key,
# and the did-you-mean suggestion ('embed.x').
modules:
  source:
    class_path: salt.tests._fixtures.toys.ToySource
    init_args: {n_features: 8}
  embed:
    class_path: salt.tests._fixtures.toys.ToyEmbed
    init_args: {in_dim: 8, out_dim: 16}
  labels:
    class_path: salt.tests._fixtures.toys.ToyWildcardLabels
    init_args: {fields: [x], n_classes: 3}
  head:
    class_path: salt.tests._fixtures.toys.ToyHead
    init_args: {in_dim: 16, n_classes: 3, embed_key: embed.y}  # <-- typo
  writer:
    class_path: salt.tests._fixtures.toys.ToyWriter
    init_args: {key: preds.x}

sources:
  raw.x: {shape: [B, 8], dtype: float32}

sinks:
  fit: [losses.total]
  val: [losses.total]
  test: [preds.x]
  onnx: [preds.x]

schema: [raw.x, labels.x]
