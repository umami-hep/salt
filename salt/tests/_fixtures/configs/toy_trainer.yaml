# TEST FIXTURE — not a shipped config. The toy trainer config the `salt graph`
# tests compile (salt/tests/unit/graph/test_graph_cli.py, unit/test_cli.py):
# an in-memory reader (no data file) feeding the real Features/Labels processors,
# three model modules, and a TEST-only terminal sink. Exercises symbolic dims,
# kind typing, mode-gated ports, an optional port, `labels.**` wildcard
# narrowing against the reader's schema, and the derived per-mode sinks
# (loss.total in FIT/VAL; the writer in TEST; every preds.* key in ONNX).
name: toy_graph

data:
  batch_size: 8
  num_workers: 0
  modules:
    reader:
      class_path: salt.tests._fixtures.toys.ToyReader
      init_args: {n_features: 8, n_classes: 3}
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          x: [f0, f1, f2, f3, f4, f5, f6, f7]
    labels:
      class_path: salt.data.Labels

model:
  class_path: salt.model.SaltModule
  init_args:
    lrs: {initial: 1.0e-4, max: 1.0e-3, end: 1.0e-5, pct_start: 0.1}
    modules:
      embed:
        class_path: salt.tests._fixtures.toys.ToyEmbed
        init_args: {in_dim: 8, out_dim: 16}
      head:
        class_path: salt.tests._fixtures.toys.ToyHead
        init_args: {in_dim: 16, n_classes: 3}
      loss:
        class_path: salt.model.modules.LossSum

outputs:
  # the TEST persistence sink: a terminal consumer of preds.x (+ meta.rows),
  # pruned from every other mode
  writer:
    class_path: salt.tests._fixtures.toys.ToyWriter
    init_args: {key: preds.x}

trainer:
  logger: false
