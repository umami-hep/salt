# Toy M1 graph config (format: salt/core/cli.py module docstring; plan 03 stage F).
# Five-module toy graph exercising the full kernel: symbolic dims, kind typing,
# mode-gated ports, optional ports, wildcard narrowing, and a test-only terminal
# writer. No physics (M1 scope).
modules:
  source:
    class_path: salt.tests.core.toys.ToySource
    init_args: {n_features: 8}
  embed:
    class_path: salt.tests.core.toys.ToyEmbed
    init_args: {in_dim: 8, out_dim: 16}
  labels:
    class_path: salt.tests.core.toys.ToyWildcardLabels
    init_args: {fields: [x], n_classes: 3}
  head:
    class_path: salt.tests.core.toys.ToyHead
    init_args: {in_dim: 16, n_classes: 3}
  writer:
    class_path: salt.tests.core.toys.ToyWriter
    init_args: {key: preds.x}

# framework-provided dataset boundary (design §3.1)
sources:
  raw.x: {shape: [B, 8], dtype: float32}

# per-mode demand anchors (design §3.1): losses drive fit/val, preds drive test/onnx
sinks:
  fit: [losses.total]
  val: [losses.total]
  test: [preds.x]
  onnx: [preds.x]

# flat key universe for wildcard narrowing (design §2.2 rule (d))
schema: [raw.x, labels.x]
