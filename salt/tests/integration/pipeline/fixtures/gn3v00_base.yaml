config: GN3/GN3V00.yaml
gpu: true
fit:
  args:
    - "--trainer.max_epochs=1"
# do_eval=do_onnx=False in MATRIX (fit-only; formerly the producer for the
# deleted chained finetune_same_heads row) —
# no eval/onnx keys for this row. The `inference:` block below is the
# ONNX-name contract the folded inference gate checks for fit=True rows
# without a do_onnx leg.
inference:
  expected_outputs:
    - GN3V00_pb
    - GN3V00_pc
    - GN3V00_ps
    - GN3V00_pud
    - GN3V00_pg
    - GN3V00_ptau
    - GN3V00_ptFromTruthDressedWZJet
    - GN3V00_TrackOrigin
    - GN3V00_VertexIndex
    - GN3V00_TrackType
