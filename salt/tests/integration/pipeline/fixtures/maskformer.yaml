config: MaskFormer.yaml
gpu: true
eval:
  # object groups (objects/object_masks, tracks_ghost VertexIndex) aren't curated
  # here: jets/tracks columns are the containment floor; the ONNX leaves are the
  # authoritative record of the object outputs.
  expected_outputs:
    jets:
      - MaskFormer_pb
      - MaskFormer_pc
      - MaskFormer_ps
      - MaskFormer_pud
      - MaskFormer_pg
      - MaskFormer_ptau
      - target_jets_classification
      - MaskFormer_lead_vertex_pt
      - MaskFormer_lead_vertex_mass
    # VertexIndex lands in the physical group `tracks_ghost` (reader `dataset:`
    # rename, resolved in H5OutputSink open_schema), not a literal `tracks`.
    tracks_ghost:
      - MaskFormer_VertexIndex
onnx:
  # Exact ordered tuple (test_onnx_output_names_match_expected asserts equality).
  # OnnxExportSink._resolve_leaves groups leaves by manifest source (`outputs:`
  # first, then model.modules in declaration order), globals before per-token
  # WITHIN each group. Group 1: jets_classification's 6 class probs (track_origin
  # dropped, so no per-token leaf). Group 2: maskformer_objects' 5
  # leading_objects_* then mf_lead_vertex's 2 lead_vertex_* (globals), then
  # maskformer_objects' VertexIndex (per-token) last.
  expected_outputs:
    - MFv2_pb
    - MFv2_pc
    - MFv2_ps
    - MFv2_pud
    - MFv2_pg
    - MFv2_ptau
    - MFv2_leading_objects_pt
    - MFv2_leading_objects_Lxy
    - MFv2_leading_objects_deta
    - MFv2_leading_objects_dphi
    - MFv2_leading_objects_mass
    - MFv2_lead_vertex_pt
    - MFv2_lead_vertex_mass
    - MFv2_VertexIndex
