config: MaskFormer.yaml
gpu: true
eval:
  # object-level groups (objects/object_masks + the tracks HadronIndex
  # leaf) are real MaskFormer outputs too but are not curated here — the
  # jets/tracks task columns below are the containment floor; the ONNX
  # leaves (incl. the leading_objects_* leaves, ruling 2) are the
  # authoritative record of the object outputs.
  expected_outputs:
    jets:
      - MaskFormer_pb
      - MaskFormer_pc
      - MaskFormer_pu
      - target_jets_classification
    tracks:
      - MaskFormer_pPileup
      - MaskFormer_pFake
      - MaskFormer_pPrimary
      - MaskFormer_pFromB
      - MaskFormer_pFromBC
      - MaskFormer_pFromC
      - MaskFormer_pFromTau
      - MaskFormer_pOtherSecondary
      - target_track_origin
onnx:
  expected_outputs:
    - MFv2_pb
    - MFv2_pc
    - MFv2_pu
    - MFv2_TrackOrigin
    - MFv2_leading_objects_pt
    - MFv2_leading_objects_Lxy
    - MFv2_leading_objects_deta
    - MFv2_leading_objects_dphi
    - MFv2_leading_objects_mass
    - MFv2_HadronIndex
xfail:
  export: "check_onnx: NaN in torch output for MFv2_leading_objects_pt at lengths={'tracks': 0} and {'tracks': 1} — a real torch/ONNX zero-token divergence, not a harness bug. Fit and eval are green."
