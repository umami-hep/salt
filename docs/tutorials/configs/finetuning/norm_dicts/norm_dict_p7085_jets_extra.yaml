# Norm dict for worked example 3, which widens the `jets` collection by ONE
# variable, `mass`. Complete and usable: `finetune_gn3large_add_jet_vars.yaml`
# fits and evaluates against this file as shipped.
#
# `Normaliser.preflight` (`salt/model/modules/norm.py`) requires every
# configured stream's every `features.variables` entry to have a {mean, std}
# entry here, and fails loud rather than silently if one is missing. The
# overlay's jets list is [pt_btagJes, eta_btagJes, mass]; all three are below.
#
# Provenance of the body: copied VERBATIM (byte-for-byte, this header excluded)
# from the bundle checkpoint's own norm dict —
#   /data/ccra-data/projects/salt-improvements/studies/2026_06_11_modularise-salt/studies/2026_07_19_fine-tuning-approaches/experiments/08_demo_gn3large_sameheads_finetune/model/norm_dict_v2.yaml
#   sha256: 82929f1946f8bfb86e6f822d509df59044fe622da3ef5c5f961207a2ac49d698
# (same body + sha as `docs/tutorials/configs/finetuning/gn3large_base.yaml`'s
# own `norm_dict_v2.yaml` reference), plus exactly ONE appended entry,
# `jets.mass`. Nothing else differs from that dict.
#
# `jets.mass` is not in the bundle's dict and not in p7085's own
# `norm_dict_260331.yaml` — it is an input the pretrained model does not read,
# so neither dict has stats for it. The values below were computed over the
# first 1,000,000 jets of `pp_output_train_260331_split_127.h5` on 2026-09-06
# at salt `94eb2d9b68d98f64e75342f7d136dd764a4f2cda`, and are the same values
# the tutorial's own DIAS run of worked example 3 used.
#
# Keyed by STREAM name (`tracks`, not `tracks_ghost`; `jets`, `tracks`, `flows`,
# `electrons` — matching `Normaliser(streams: [...])`, not the p7085 h5 dataset
# names). This dict feeds `norm_p7085` ONLY (the fresh Normaliser this overlay
# introduces in place of the bundle's `norm`) — it is not consumed by `norm`,
# `norm_calo`, or any other example's normaliser in this study.
#
# Sanity check (PyYAML only, no salt import needed):
#   python3 -c 'import yaml; d=yaml.safe_load(open("norm_dict_p7085_jets_extra.yaml")); assert {k: len(v) for k, v in d.items()} == {"jets": 3, "tracks": 24, "flows": 5, "electrons": 28}, {k: len(v) for k, v in d.items()}'
