# Fine-tuning overlay — add ONE new task head to the public GN3Large baseline:
# a 5-class b/c-charge jet classification head, `jets_bccharge`. Nothing else
# changes (input streams, other heads, normaliser, embeds, encoder, pool are
# all untouched and stay loaded from the checkpoint).
#
# Expected `--init_from` accounting: **11 loaded / 1 new / 0 dropped** — every
# existing module survives (the norm/embeds/concat/encoder/split/pool plus the
# five original task heads), and only `jets_bccharge` is fresh.
#
# Why `input: pooled.global` (not `vconcat.global`): the folded 5-class
# `label_map` below is copied from `salt/configs/GN3EPCLV01.yaml`, but
# GN3EPCLV01 is a `vconcat`/`norm_global`-style config and GN3Large is not —
# GN3Large has no `vconcat` stream, only `pooled.global` (see
# `jets_classification` in `gn3large_base.yaml`). So the head is wired the way
# `salt/configs/GN3/GN3_Charge.yaml` wires its charge head (onto the pooled jet
# embedding), not the way GN3EPCLV01 wires its own `jets_bccharge`.
#
# Why `weight_source: null`: GN3EPCLV01's `jets_bccharge` sets `weight: 1` as a
# `LossGLS`-only knob (LossGLS is the only loss that consults per-task
# `weight:`, and `1` is the value it requires when a task's contribution
# shouldn't be up- or down-weighted). GN3Large's `loss` module is `LossSum`
# (plain unweighted sum of per-task losses), so there is no `weight:` knob to
# set here, and `weight_source` (which reads observation weights from the
# `class_dict`) does not apply either: the class_dict's weights are computed in
# raw-PDG-id space, not in this folded 5-class space, so they would not line up
# with `class_names` below.
#
# The `label_map` folds 194 raw `HadronGhostInitialTruthLabelPdgId` PDG ids down
# to 5 classes (`[bquark, antibquark, cquark, anticquark, other]`); copied
# VERBATIM from `salt/configs/GN3EPCLV01.yaml`'s own `jets_bccharge.label_map`
# (same 194 entries, same b/c-charge folding — that mapping is data-driven, not
# specific to GN3EPCLV01's wiring).
#
# ⚠️ Coverage is NOT enforced by salt. `ClassificationTaskModule`'s remap loop
# (`salt/model/modules/tasks/classification.py`, around the `label_map`
# handling) leaves any PDG id ABSENT from `label_map` UNCHANGED — it does not
# raise or fall back to `other`. A raw PDG id ≥ 5 that reaches the loss
# uncategorised then crashes `CrossEntropyLoss` (out-of-range class index).
# Salt has no built-in check for this. Before training on a new sample, verify
# every `HadronGhostInitialTruthLabelPdgId` value that occurs in it is a key of
# this `label_map` — the tutorial's experiment does this as a `data`-stage
# check on the real files, it is not part of this config.
#
#   export GN3LARGE=<dir with converted.ckpt, config_v2.yaml, norm_dict_v2.yaml>
#   salt fit \
#     --config $GN3LARGE/config_v2.yaml \
#     --config docs/tutorials/configs/finetuning/finetune_gn3large_add_charge_head.yaml \
#     --init_from $GN3LARGE/converted.ckpt \
#     --model.init_args.modules.norm.init_args.norm_dict=$GN3LARGE/norm_dict_v2.yaml \
#     --data.modules.input_samples.init_args.files.train=<train.h5> \
#     --data.modules.input_samples.init_args.files.val=<val.h5>
#
# No second norm-dict override here — this overlay adds a task head, not an
# input stream, so `norm` and its dict are untouched (unlike worked example 1,
# which adds the `calo` stream and needs a `norm_calo` dict).
#
# `docs/tutorials/configs/finetuning/gn3large_base.yaml` is the in-repo mirror of
# `config_v2.yaml` and can be used in its place — CI parses this overlay
# against it. Preview the merged config (freeze graph, per-stage
# trainable/frozen sets) with `salt merge-config`.
#
# The `head_warmup` stage trains the new head TOGETHER WITH every existing
# head, on top of the frozen, `eval()`-mode backbone (norm, all stream embeds,
# concat, encoder, split, pool): this lets `jets_bccharge` learn from a stable
# jet representation while giving the pre-existing heads a chance to adapt
# their finetuned readout without the backbone moving under them. `full_finetune`
# then unfreezes everything at a gentle LR.
#
# Do NOT override `name:` here — pre/post eval columns must line up with the
# base run's name.
#
# Walk-through: docs/tutorials/finetuning.md (worked example 2).

model:
  init_args:
    modules:
      jets_bccharge:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global          # GN3Large has no `vconcat`/`norm_global`: wire to the pooled embedding
          label: HadronGhostInitialTruthLabelPdgId
          class_names: [bquark, antibquark, cquark, anticquark, other]
          weight_source: null           # class_dict weights are in raw-PDG space, not the folded 5-class space
          label_map:
            {
              0: 4, 15: 4, -15: 4, 511: 1, -511: 0, 513: 1, -513: 0, 521: 1, -521: 0,
              523: 1, -523: 0, 10511: 1, -10511: 0, 531: 1, -531: 0, 541: 1, -541: 0,
              543: 1, -543: 0, 10551: 4, 100551: 4, 110551: 4, 20553: 4, 100553: 4,
              100555: 4, 200553: 4, 120553: 4, 551: 4, 553: 4, 555: 4, 431: 2,
              -431: 3, 421: 2, -421: 3, 411: 2, -411: 3, 441: 4, 443: 4, 445: 4,
              4122: 2, -4122: 3, 4132: 2, -4132: 3, 4114: 2, -4114: 3, 4232: 2,
              -4232: 3, 4332: 2, -4332: 3, 10441: 4, 10443: 4, 20443: 4, 100441: 4,
              100443: 4, 30443: 4, 5122: 0, -5122: 1, 5132: 0, -5132: 1, 5232: 0,
              -5232: 1, 5332: 0, -5332: 1, 4412: 2, 4422: 2, -4412: 3, -4422: 3,
              4414: 2, 4424: 2, -4414: 3, -4424: 3, 4432: 2, -4432: 3, 4434: 2,
              -4434: 3, 4444: 2, -4444: 3, -4322: 3, 4322: 2, 5142: 0, 5242: 0,
              -5142: 1, -5242: 1, 5412: 0, 5422: 0, -5412: 1, -5422: 1, 5414: 0,
              5424: 0, -5414: 1, -5424: 1, 5342: 0, -5342: 1, 5432: 0, -5432: 1,
              5434: 0, -5434: 1, 5442: 0, -5442: 1, 5444: 0, -5444: 1, 5512: 0,
              -5512: 1, 5522: 0, -5522: 1, 5514: 0, -5514: 1, 5532: 0, -5532: 1,
              5534: 0, -5534: 1, 5542: 0, -5542: 1, 5544: 0, -5544: 1, 5554: 0,
              -5554: 1, 20433: 2, -20433: 3, 10431: 2, -10431: 3, 4334: 2, -4334: 3,
              4324: 2, -4324: 3, 4314: 2, -4314: 3, 4312: 2, -4312: 3, 4224: 2,
              -4224: 3, 4222: 2, -4222: 3, 4214: 2, -4214: 3, 4212: 2, -4212: 3,
              4112: 2, -4112: 3, 433: 2, -433: 3, 425: 2, -425: 3, 423: 2, -423: 3,
              413: 2, -413: 3, 14122: 2, -14122: 2, 10433: 2, -10433: 3, 10423: 2,
              -10423: 3, 10421: 2, -10421: 3, 10413: 2, -10413: 3, 10411: 2,
              -10411: 3, 4124: 2, -4124: 3, 20413: 2, -20413: 3, 20423: 2,
              -20423: 3, 9010443: 2, 435: 2, -435: 3, 415: 2, -415: 3, -5334: 1,
              5334: 0, 5324: 0, -5324: 1, 5322: 0, -5322: 1, 5314: 0, -5314: 1,
              5312: 0, -5312: 1, 5224: 0, -5224: 1, 5222: 0, -5222: 1, 5214: 0,
              -5214: 1, 5212: 0, -5212: 1, 5114: 0, -5114: 1, 5112: 0, -5112: 1,
              533: 1, -533: 0,
            }
          dense: {hidden_layers: [128, 64, 32], activation: SiLU}

outputs:
  run_tasks:
    init_args:
      tasks: [jets_classification, track_origin, track_vertexing, track_type, jet_pt_regression, jets_bccharge]   # list replaces: restate all six

training_schedule:
  stages:
    head_warmup:
      epochs: 3
      trainable: [jets_bccharge, jets_classification, track_origin, track_vertexing, track_type, jet_pt_regression]
      lrs: {max: 1.0e-4}
      early_stop: {monitor: val/loss, mode: min, patience: 1}
    full_finetune:
      frozen: []
      lrs: {initial: 1.0e-7, max: 1.0e-5}
      early_stop: {monitor: val/loss, mode: min, patience: 2}

trainer:
  max_epochs: 8
  precision: 16-mixed
