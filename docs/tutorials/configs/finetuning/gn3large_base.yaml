# Mirror of the public GN3Large checkpoint bundle's ``config_v2.yaml``
# (CERNBox https://cernbox.cern.ch/s/39Qui940MGt4jyM).
#
# DO NOT EDIT BY HAND -- regenerate with:
#   python -m salt.scripts.regen_gn3large_config \
#       --source <bundle>/config_v2.yaml \
#       --output docs/tutorials/configs/finetuning/gn3large_base.yaml
#
# Source bundle sha256 (as shipped on CERNBox, before this rewrite):
#   config_v2.yaml:  85cd266060567be95146057bfca69746e4ae5d027673097644f494f3c9766d48
#   converted.ckpt:  cbc411f65c9250ec59ce2d7bb269725b3244a0f0b7f6d1bdc354a44e44c4e501
#   norm_dict_v2.yaml: 82929f1946f8bfb86e6f822d509df59044fe622da3ef5c5f961207a2ac49d698
#
# Rewrites applied to the stale bundle file (see regen_gn3large_config.py):
#   1. 20 dead class paths under the removed `salt.core` package rewritten
#      to their current-core equivalent (CLASS_PATH_MAP, see dc97af9).
#   2. The top-level `export:` alias (retired by 9c7e807) moved under
#      `outputs:` as a new `onnx_export` entry, appended after `pad_mask`.
#   3. The `callbacks:` block deleted -- output sinks are not Lightning
#      Callbacks; the h5 sink is wired implicitly by `salt test`.
#   4. `norm_dict` rewritten from a machine-local absolute path to the
#      relative sibling `norm_dict_v2.yaml`.
#
# The bundle's own `config_v2.yaml` (the file re-uploaded to CERNBox/EOS) is
# this file minus this header -- everything from `name: GN4_big` onward.
#
# body-sha256: a6fa290750298207d3407c5e11bd2bc144500af97183d14099aaa8ef82c16e66
#
# `norm_dict` above is a relative path: run `salt fit`/`salt test` from the
# bundle directory, or override it explicitly, e.g.
#   --model.init_args.modules.norm.init_args.norm_dict=$GN3LARGE/norm_dict_v2.yaml
#
# `trainer.precision: 32-true` is kept verbatim, matching the original
# training run. The shipped fine-tuning overlays set `16-mixed` instead:
# GN3Large's encoder uses `attn_type: flash-varlen`, which only runs in
# fp16/bf16 on GPU.
#
# A config whose class paths still start with `salt.core` is the pre-2026-09
# bundle file and must be replaced with this one (or a fresh
# `--check`-passing regeneration).
name: GN4_big
data:
  batch_size: 100
  num_workers: 0
  modules:
    input_samples:
      class_path: salt.data.InputSamples
      init_args:
        files:
          train: SET_AT_RUNTIME
          val: SET_AT_RUNTIME
          test: SET_AT_RUNTIME
        num:
          train: -1
          val: -1
          test: -1
    reader:
      class_path: salt.data.H5StructuredReader
      init_args:
        groups:
          jets:
            global_object: true
          tracks:
            global_object: false
            dataset: tracks_ghost
          flows:
            global_object: false
          electrons:
            global_object: false
    features:
      class_path: salt.data.Features
      init_args:
        variables:
          jets:
          - pt_btagJes
          - eta_btagJes
          tracks:
          - d0
          - z0SinTheta
          - dphi
          - deta
          - qOverP
          - lifetimeSignedD0Significance
          - lifetimeSignedZ0SinThetaSignificance
          - phiUncertainty
          - thetaUncertainty
          - qOverPUncertainty
          - numberOfPixelHits
          - numberOfSCTHits
          - numberOfInnermostPixelLayerHits
          - numberOfNextToInnermostPixelLayerHits
          - numberOfInnermostPixelLayerSharedHits
          - numberOfInnermostPixelLayerSplitHits
          - numberOfPixelSharedHits
          - numberOfPixelSplitHits
          - numberOfSCTSharedHits
          - leptonID
          - muon_quality
          - muon_qOverPratio
          - muon_momentumBalanceSignificance
          - muon_scatteringNeighbourSignificance
          flows:
          - pt
          - energy
          - deta
          - dphi
          - isCharged
          electrons:
          - pt
          - ptfrac
          - ptrel
          - dr
          - abs_eta
          - eta
          - phi
          - ftag_et
          - qOverP
          - d0RelativeToBeamspot
          - d0RelativeToBeamspotSignificance
          - ftag_ptVarCone30OverPt
          - numberOfPixelHits
          - numberOfSCTHitsInclDead
          - ftag_deltaPOverP
          - eProbabilityHT
          - deltaEta1
          - deltaPhiRescaled2
          - ftag_energyOverP
          - Rhad
          - Rhad1
          - Eratio
          - weta2
          - Rphi
          - Reta
          - wtots1
          - f1
          - f3
    labels:
      class_path: salt.data.Labels
      init_args:
        dtype_policy: int64-for-int
model:
  class_path: salt.model.SaltModule
  init_args:
    lrs:
      initial: 1.0e-06
      max: 0.0001
      end: 1.0e-08
      pct_start: 0.05
      weight_decay: 1.0e-05
    optimizer: AdamW
    modules:
      norm:
        class_path: salt.model.modules.Normaliser
        init_args:
          norm_dict: norm_dict_v2.yaml
          streams:
          - jets
          - tracks
          - flows
          - electrons
          global_object: jets
      track_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: tracks
          context:
          - normed.jets
          out_dim: 1024
          dense:
            hidden_layers:
            - 512
            activation: SiLU
      flow_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: flows
          context:
          - normed.jets
          out_dim: 1024
          dense:
            hidden_layers:
            - 512
            activation: SiLU
      electron_embed:
        class_path: salt.model.modules.StreamEmbed
        init_args:
          stream: electrons
          context:
          - normed.jets
          out_dim: 1024
          dense:
            hidden_layers:
            - 512
            activation: SiLU
      concat:
        class_path: salt.model.modules.Concat
        init_args:
          streams:
          - tracks
          - flows
          - electrons
      encoder:
        class_path: salt.model.modules.TransformerEncoder
        init_args:
          dim: 1024
          out_dim: 256
          num_layers: 8
          num_registers: 8
          norm: RMSNorm
          attention:
            num_heads: 8
            attn_type: flash-varlen
          dense:
            activation: SiLU
            gated: true
          norm_type: hybrid
      split:
        class_path: salt.model.modules.Split
        init_args:
          streams:
          - tracks
      pool:
        class_path: salt.model.modules.GlobalAttentionPooling
        init_args:
          input: encoded.seq
          out: pooled.global
      jets_classification:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: jets
          input: pooled.global
          dense:
            hidden_layers:
            - 128
            - 64
            - 32
            activation: SiLU
          label: flavour_label
          class_names:
          - ghostbjets
          - ghostcjets
          - ghostsjets
          - ghostudjets
          - ghostgjets
          - ghosttaujets
          weight_source: null
      track_origin:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          dense:
            hidden_layers:
            - 128
            - 64
            - 32
            activation: SiLU
          label: ftagTruthOriginLabel
          class_names:
          - Pileup
          - Fake
          - Primary
          - FromB
          - FromBC
          - FromC
          - FromTau
          - OtherSecondary
          weight_source: null
      track_vertexing:
        class_path: salt.model.modules.tasks.VertexingTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          dense:
            hidden_layers:
            - 128
            - 64
            - 32
            activation: SiLU
          label: ftagTruthVertexIndex
          origin_label: ftagTruthOriginLabel
      track_type:
        class_path: salt.model.modules.tasks.ClassificationTaskModule
        init_args:
          stream: tracks
          context: pooled.global
          dense:
            hidden_layers:
            - 128
            - 64
            - 32
            activation: SiLU
          label: ftagTruthTypeLabel
          class_names:
          - NoTruth
          - Other
          - Pion
          - Kaon
          - Electron
          - Muon
          label_map:
            -2: 2
            -3: 3
            5: 4
            -5: 4
            6: 5
            -6: 5
          weight_source: null
      jet_pt_regression:
        class_path: salt.model.modules.tasks.RegressionTaskModule
        init_args:
          stream: jets
          input: pooled.global
          dense:
            hidden_layers:
            - 128
            - 64
            - 32
            activation: SiLU
          targets: ptFromTruthDressedWZJet
          target_denominators: pt_btagJes
          loss:
            class_path: torch.nn.L1Loss
            init_args:
              reduction: none
      loss:
        class_path: salt.model.modules.LossSum
outputs:
  inputs_copy:
    class_path: salt.outputs.InputCopyWriter
    init_args:
      streams:
      - jets
      - tracks
  run_tasks:
    class_path: salt.outputs.RunTaskOutput
    init_args:
      tasks:
      - jets_classification
      - track_origin
      - track_vertexing
      - track_type
      - jet_pt_regression
  pad_mask:
    class_path: salt.outputs.PadMaskWriter
    init_args:
      streams:
      - tracks
  onnx_export:
    class_path: salt.outputs.OnnxExportSink
    init_args:
      model_name: GN4big
      inputs:
      - port: inputs.jets
        name: jets_features
      - port: inputs.tracks
        name: tracks_features
        sequence: true
        dyn_axis: n_tracks
      - port: inputs.flows
        name: flows_features
        sequence: true
        dyn_axis: n_flows
      - port: inputs.electrons
        name: electrons_features
        sequence: true
        dyn_axis: n_electrons
trainer:
  max_epochs: 1
  precision: 32-true
