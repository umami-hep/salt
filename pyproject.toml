[project]
name = "salt-ml"
description = "Multimodal and Multiclass Machine Learning for High Energy Physics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "atlas-ftag-tools==0.3.3",
  "comet_ml>=3.58.3",
  "filelock>=3.29.4",
  "h5py>=3.16.0",
  "jsonargparse[signatures,argcomplete]>=4.49.0",
  "lightning==2.6.5",
  "lion-pytorch>=0.2.4",
  "numpy>=2.3.2",  # upper-bounded to <2.4 by puma-hep; 2.3.x has cp314 wheels
  "onnx==1.22.0",
  "onnxruntime==1.27.0",
  "onnxscript>=0.7.0",
  "puma-hep==0.5.3",
  # hard import at salt module load since the MaskFormer-update wave
  # (salt/model/nn/matcher.py) — without it every CI test job dies at
  # conftest import (feature/modular-core pipelines red since 2026-07-10)
  "py-lap-solver>=0.1.4",
  "rich>=15.0.0",
  "scipy>=1.18.0",
  # torch stays in the 2.12 minor: the prebuilt flash-attn wheel is built against
  # torch2.12 (cu126/cp314). 2.12.1 is the latest 2.12.x and is what
  # torchvision==0.27.1 requires.
  "torch==2.12.1",
  "torchmetrics==1.9.0",
  "torchvision==0.27.1",
  "tqdm>=4.68.3",
  "umami-preprocessing==0.3.1",
]

[project.optional-dependencies]
# ROOT reader extra: the single config-driven `UprootReader` serves every ROOT
# format (xAOD POOL, easyjet ntuples, pre-flattened per-jet ntuples), so one
# `root` extra pulls the uproot/awkward it needs — `pip install 'salt[root]'`.
root = [
  "uproot>=5.7.4",
  "awkward>=2.9.1",
]
muP = [
  "aiobotocore==2.24.2",
  "boto3==1.40.18",
  "botocore==1.40.18",
  "mup>=1.0.0",
  "s3fs==2024.10.0",
  "s3path>=0.5.0",
  "tensorboard>=2.20.0",
]
flash = [
  "flash-attn==2.8.3",
  "ninja>=1.11.1.1",
  "packaging",
  "wheel",
]

[dependency-groups]
dev = [
  "coverage>=7.10.6",
  "ipykernel>=6.30.1",
  "mypy>=1.18.1",
  "pre-commit>=4.3.0",
  "pydoclint>=0.7.3",
  "pytest_notebook>=0.10.0",
  "pytest-cov>=7.0.0",
  "pytest-randomly>=4.0.1",
  "pytest>=8.4.2",
  "ruff>=0.13.0",
]
docs = [
  "indicomb2==0.2",
  "mkdocs==1.5.3",
  "mkdocs-autorefs==1.4.0",
  "mkdocs-git-revision-date-localized-plugin",
  "mkdocs-markdownextradata-plugin>=0.2.5",
  "mkdocs-material==9.4.7",
  "mkdocstrings[python]==0.28.2",
]

[tool.uv]
default-groups = []

[project.urls]
"Homepage" = "https://gitlab.cern.ch/aft/algorithms/salt"
"Issue Tracker" = "https://gitlab.cern.ch/aft/algorithms/salt/-/issues"

[project.scripts]
setup_mup = "salt.model.mup:setup_mup"
salt = "salt.main:main"

[tool.setuptools]
packages = { find = { include = ["salt*"] } }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "salt.__version__" }

[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
preview = true
lint.select = ["ALL"]
lint.ignore = [
  "COM", "D100", "D102", "D105", "D205", "D401", "EM", "FIX", "FBT",
  "S101", "S404", "S602", "PLR2004", "PLR0912", "PLR0914", "CPY001", "TRY003",
  "G004", "N802", "C901", "DTZ005", "DTZ007", "INP", "EXE002",
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204",
  "T201", "PLW1514", "PTH123", "RUF017", "PLR6301", "ISC001", "S307",
  "PT027", "NPY002", "PT009", "PLW1641", "PLR0904", "N817", "S603", "PD011",
  "S113", "TCH", "PT011", "PLR1702", "S108", "PTH207", "S607", "E203", "SIM115", "PLR0913",
  "PLR0917", "A005", "ANN401", "PLR0915", "RUF015", "PLR6104", "TD003",
]
exclude = [
  "salt/tests/*",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.per-file-ignores]
"salt/tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "PT019"]

[tool.mypy]
exclude = '^salt/tests/.*\.py$'

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "CRITICAL"
filterwarnings = ["ignore::DeprecationWarning"]
# salt/tests/unit mirrors salt/ 1:1 (genuine unit tests); salt/tests/integration
# holds the gate harnesses + any test that builds/runs a full model or reads real
# data. Shared fixtures live in salt/tests/_fixtures (imported as
# salt.tests._fixtures.*, not collected).
testpaths = ["salt/tests"]

[tool.coverage.report]
omit = ["**/mup_utils/*"]
