pre-commit:
  stage: lint
  needs: []
  image: registry.cern.ch/docker.io/library/python:3.14
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - python -m pip install uv
    - uv sync --only-group dev
    - uv run --no-sync pre-commit run --all-files

# Stdlib-only mirror-convention check, split out of the unit-test job so it
# runs fast in lint — no container, no pytest, no dependency install.
structure-check:
  stage: lint
  needs: []
  image: registry.cern.ch/docker.io/library/python:3.14
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - python salt/tests/unit/test_mirror_convention.py
