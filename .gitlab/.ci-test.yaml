.test-template:
  stage: tests
  needs: [build_docker_test]
  image: "$CI_REGISTRY_IMAGE/temporary_images:${CI_COMMIT_REF_SLUG}-test"
  artifacts:
    when: always
    paths:
      - .coverage*
      - reports/
    reports:
      junit: reports/*.xml
  before_script:
    - |
      # -p no:nb_regression: the nb_regression plugin in the image uses the
      # removed pytest_collect_file(path,...) hook and crashes collection on the
      # image's pytest — disable it (salt's tests aren't notebooks) so every test
      # job can collect. Pre-existing breakage, not new.
      run_test() {
        coverage run -p --source salt -m pytest -p no:nb_regression --show-capture=stdout --junitxml="${JUNIT_FILE:-report.xml}" "$@"
      }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# --------------------------- UNIT TESTS ---------------------------
# salt/tests/unit mirrors salt/ 1:1 — fast on CPU. The conftest GPU-guard
# keeps the heavy salt/tests/integration gates OUT of this job (they need
# --run-integration).
modular-unit-tests:
  extends: .test-template
  script:
    # TEMP DIAGNOSTIC (reader-unification CI-red triage): localize the deterministic
    # jsonargparse deep-merge breakage. (a) spike in isolation, (b) full suite with
    # pytest-randomly disabled. Both non-fatal (|| echo marker) so the real run below
    # still reports. Remove once root-caused.
    - echo "===DIAG_SPIKE_ISOLATION_BEGIN==="; run_test salt/tests/unit/test_jsonargparse_spike.py && echo "===DIAG_SPIKE_ISOLATION=PASS===" || echo "===DIAG_SPIKE_ISOLATION=FAIL==="
    - echo "===DIAG_NORANDOMLY_BEGIN==="; run_test salt/tests/unit -p no:randomly && echo "===DIAG_NORANDOMLY=PASS===" || echo "===DIAG_NORANDOMLY=FAIL==="
    - JUNIT_FILE=reports/modular-unit.xml run_test salt/tests/unit

# --------------- CPU INTEGRATION GATES ---------------
# The W34/W5 section-path gates live under salt/tests/integration but are
# `cpu_always` (pure-CPU, data-free static schema + ONNX-trace-fold checks). The
# conftest marks them CI-load-bearing — they must NEVER be silently skipped — yet
# `modular-unit-tests` (salt/tests/unit only) doesn't collect them, so without
# this job they never run in CI. These gate the W34.4d cutover: the migrated
# configs' `outputs:`-section H5/ONNX schema == legacy authority. Run WITHOUT
# --run-integration so only the cpu_always tests execute (any GPU-only sibling
# in these files is skipped on the CPU runner).
modular-integration-cpu-gates:
  extends: .test-template
  script:
    - JUNIT_FILE=reports/modular-int-outputs-section.xml run_test salt/tests/integration/test_outputs_section.py
    - JUNIT_FILE=reports/modular-int-regression-e2e.xml run_test salt/tests/integration/test_regression_e2e.py
    - JUNIT_FILE=reports/modular-int-gaussian-e2e.xml run_test salt/tests/integration/test_regression_gaussian_e2e.py
    - JUNIT_FILE=reports/modular-int-config-schema.xml run_test salt/tests/integration/test_config_h5_schema_parity.py
    - JUNIT_FILE=reports/modular-int-onnx-fold-classification.xml run_test salt/tests/integration/test_onnx_fold_classification.py
    - JUNIT_FILE=reports/modular-int-onnx-fold-objects.xml run_test salt/tests/integration/test_onnx_fold_objects.py
    - JUNIT_FILE=reports/modular-int-inference-e2e.xml run_test salt/tests/integration/test_inference_e2e.py

# --------------------- GPU RUNNER (k8s-gpu) SMOKE ---------------------
# Proves the GPU path end-to-end on CERN's k8s-gpu fleet: GPU visible, our salt
# test image actually ships CUDA torch, and a real training runs on the GPU
# (fast_dev_run on the synthetic gn2v2-dummy config — the same generator +
# override pattern the unit suite uses). `tags: [k8s-gpu]` selects the GPU
# runner; we keep the .test-template salt image (overrides the runner's default
# AlmaLinux9). FAIR USE: keep k8s-gpu jobs <= 5 in parallel.
gpu-smoke:
  extends: .test-template
  tags:
    - k8s-gpu
  # The k8s-gpu fleet serves an A100-PCIE-40GB MIG slice with driver 570.x /
  # CUDA 12.8. The image's torch must be built for CUDA <= 12.8 — see
  # setup/Dockerfile, pinned to cuda12.6 + flash-attn cu126 for exactly this.
  # (A cuda13.0 image fails here with "driver too old, found 12080".)
  # Blocking (allow_failure removed): if torch can't see the GPU, fail loudly.
  # FAIR USE: keep k8s-gpu jobs <= 5 in parallel.
  script:
    - nvidia-smi || echo "nvidia-smi not in image (ok as long as torch sees CUDA below)"
    - python -c "import torch; print('cuda_available:', torch.cuda.is_available()); print('torch built for CUDA:', torch.version.cuda); assert torch.cuda.is_available(), 'GPU runner gave no CUDA device to torch — check the image CUDA major is <= the runner driver (nvidia-smi above)'; print('gpu:', torch.cuda.get_device_name(0))"
    - |
      # Synthetic training data for the gn2v2-dummy config (deterministic,
      # same generators the unit suite uses — salt/tests/unit/test_main.py).
      python - <<'EOF'
      from pathlib import Path
      from salt.schema import dump_schema, save_schema
      from salt.testing.inputs import write_dummy_file
      from salt.tests._fixtures.gn2v2_fixture import write_parity_norm_dict
      base = Path("gpu_smoke_data")
      base.mkdir(exist_ok=True)
      nd, cd = base / "norm_dict.yaml", base / "class_dict.yaml"
      write_parity_norm_dict(nd, cd)
      h5 = base / "pp_output_train.h5"
      write_dummy_file(h5, nd)
      save_schema(dump_schema(h5), base / "schema.yaml")
      EOF
    - salt fit
      --config salt/configs/gn2v2-dummy.yaml
      --data.train_file=gpu_smoke_data/pp_output_train.h5
      --data.val_file=gpu_smoke_data/pp_output_train.h5
      --data.modules.reader.init_args.schema=gpu_smoke_data/schema.yaml
      --model.modules.norm.init_args.norm_dict=gpu_smoke_data/norm_dict.yaml
      --trainer.accelerator=gpu
      --trainer.logger=false
      --trainer.fast_dev_run=2
      --trainer.default_root_dir=gpu_smoke_out
