.test-template:
  stage: tests-cpu
  # build_docker_test is a parallel:matrix job, so the dependency must name the
  # cell. Test jobs pull the unsuffixed `-test` tag, which only V2H publishes —
  # so V2H is the one to wait for. Depending on the bare job name here would
  # fail pipeline creation.
  needs:
    - job: build_docker_test
      parallel:
        matrix:
          - VARIANT: V2H
  image: "$CI_REGISTRY_IMAGE/temporary_images:${CI_COMMIT_REF_SLUG}-test"
  artifacts:
    when: always
    paths:
      - .coverage*
      - reports/
    reports:
      junit: reports/*.xml
  before_script:
    - |
      # -p no:nb_regression: the nb_regression plugin in the image uses the
      # removed pytest_collect_file(path,...) hook and crashes collection on the
      # image's pytest — disable it (salt's tests aren't notebooks) so every test
      # job can collect. Pre-existing breakage, not new.
      run_test() {
        coverage run -p --source salt -m pytest -p no:nb_regression --show-capture=stdout --junitxml="${JUNIT_FILE:-report.xml}" "$@"
      }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# --------------------------- UNIT TESTS ---------------------------
# salt/tests/unit mirrors salt/ 1:1 — fast on CPU. The conftest GPU-guard
# keeps the heavy salt/tests/integration suite OUT of this job (they need
# --run-integration).
modular-unit-tests:
  extends: .test-template
  script:
    - JUNIT_FILE=reports/modular-unit.xml run_test salt/tests/unit

# --------------- CPU INTEGRATION ---------------
# The whole (restructured) integration tree — pipeline/ (the config-lifecycle
# matrix + inference) and multistage_training/ — in ONE pytest invocation.
# Without --run-integration only the `cpu_always` tests execute; GPU-only
# siblings are skipped by the conftest. A new cpu_always file is picked up
# automatically — there is no per-file list to keep in sync, and no `set -e`
# truncation (the old modular-integration-cpu-gates job named 8 files and
# aborted on the first red one, so the remaining 7 never reported), because
# pytest reports every test and the junit artifact carries them individually.
# `-m "not gpu"` excludes only the GPU-marked matrix rows (they run in
# integration-gpu below) — there is no separate `pipeline` marker or job split
# any more; the matrix and everything else run here as one suite.
integration-cpu:
  extends: .test-template
  needs:
    - job: build_docker_test
      parallel:
        matrix:
          - VARIANT: V2H
    - job: modular-unit-tests          # user directive: integration behind units
  script:
    - JUNIT_FILE=reports/integration-cpu.xml run_test salt/tests/integration -m "not gpu"

# --------------------- GPU RUNNER (k8s-gpu) ---------------------
# Replaces gpu-smoke. Proves the GPU path on shipped configs rather than on a
# derived test config: once tests-gpu runs real matrix rows, a separate smoke
# job training a throwaway config is redundant. The rows use
# --trainer.accelerator=auto, so they take the GPU with no config change.
# `-m gpu` selects the GPU_ROWS subset — defined in
# salt/tests/integration/pipeline/test_pipeline.py now that pipeline.py has
# been merged into it — chosen from rows that are green on CPU, so a
# device-dependent XPASS on a strict=True xfail can't turn into a second
# unexplained red job.
# `tags: [k8s-gpu]` selects the GPU runner; we keep the .test-template salt
# image (overrides the runner's default AlmaLinux9). FAIR USE: keep k8s-gpu
# jobs <= 5 in parallel.
integration-gpu:
  extends: .test-template
  stage: tests-gpu
  tags:
    - k8s-gpu
  # This job runs on the V2H (cu126) image: .test-template pulls the UNSUFFIXED
  # `temporary_images:<ref>-test` tag, which .ci-build.yaml deliberately keeps
  # pointing at V2H — the k8s-gpu fleet publishes only that tag, and a CUDA-13
  # (T2B) image cannot be assumed to run on this fleet. Consequence: T2B is
  # built by CI and never GPU-tested, exactly as before this change.
  #
  # The one-line preamble below is the whole GPU-availability check: it turns
  # a silent CPU fallback into a red job, and `torch.version.cuda` as the
  # assertion message keeps the driver-mismatch diagnostic — when it fires,
  # the message IS the image's CUDA major, the number to compare against the
  # runner's driver. The old job's 30-line assert essay, nvidia-smi fallback
  # and synthetic-data heredoc are gone; the matrix rows are the GPU exercise
  # now.
  script:
    - python -c "import torch; assert torch.cuda.is_available(), torch.version.cuda"
    - JUNIT_FILE=reports/integration-gpu.xml run_test salt/tests/integration -m gpu
