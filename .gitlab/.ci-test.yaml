.test-template:
  stage: tests
  needs: [build_docker_test]
  image: "$CI_REGISTRY_IMAGE/temporary_images:${CI_COMMIT_REF_SLUG}-test"
  artifacts:
    when: always
    paths:
      - .coverage*
      - reports/
    reports:
      junit: reports/*.xml
  before_script:
    - |
      # -p no:nb_regression: the nb_regression plugin in the image uses the
      # removed pytest_collect_file(path,...) hook and crashes collection on the
      # image's pytest — disable it (salt's tests aren't notebooks) so EVERY test
      # job (legacy v1 + modular) can collect. Pre-existing breakage, not new.
      run_test() {
        coverage run -p --source salt -m pytest -p no:nb_regression --show-capture=stdout --junitxml="${JUNIT_FILE:-report.xml}" "$@"
      }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# --------------------------- UNIT TESTS ---------------------------
unit-tests:
  extends: .test-template
  script:
    - JUNIT_FILE=reports/unit-attention.xml run_test salt/tests/test_attention.py
    - JUNIT_FILE=reports/unit-cli.xml run_test salt/tests/test_cli.py
    - JUNIT_FILE=reports/unit-datasets.xml run_test salt/tests/test_datasets.py
    - JUNIT_FILE=reports/unit-edges.xml run_test salt/tests/test_edges.py
    - JUNIT_FILE=reports/unit-featurewise.xml run_test salt/tests/test_featurewise.py
    - JUNIT_FILE=reports/unit-initnet.xml run_test salt/tests/test_initnet.py
    - JUNIT_FILE=reports/unit-masks.xml run_test salt/tests/test_masks.py
    - JUNIT_FILE=reports/unit-models.xml run_test salt/tests/test_models.py
    - JUNIT_FILE=reports/unit-optimizer.xml run_test salt/tests/test_optimizer.py
    - JUNIT_FILE=reports/unit-posenc.xml run_test salt/tests/test_posenc.py
    - JUNIT_FILE=reports/unit-transformer.xml run_test salt/tests/test_transformer.py
    - JUNIT_FILE=reports/unit-union_find.xml run_test salt/tests/test_union_find.py
    - JUNIT_FILE=reports/unit-utils.xml run_test salt/tests/test_utils.py

# --------------------- MODULAR (v2) CORE TESTS ---------------------
# The salt/core v2 modular refactor. salt/tests/unit mirrors salt/core 1:1
# (data/, graph/, nn/, onnx/, writers/) — fast on CPU. The conftest GPU-guard
# keeps the heavy salt/tests/integration gates OUT of this job (they need
# --run-integration). The parity control (parity_gn2, ~9 fast bitwise checks)
# guards the modular model code against drift.
modular-unit-tests:
  extends: .test-template
  script:
    - JUNIT_FILE=reports/modular-unit.xml run_test salt/tests/unit

modular-parity-control:
  extends: .test-template
  script:
    - JUNIT_FILE=reports/modular-parity-gn2.xml run_test salt/tests/integration/test_parity_gn2.py --run-integration

# --------------------- GPU RUNNER (k8s-gpu) SMOKE ---------------------
# Proves the GPU path end-to-end on CERN's k8s-gpu fleet before moving the heavy
# jobs there: GPU visible, our salt test image actually ships CUDA torch, and a
# real training runs on the GPU (accelerator=auto -> cuda). `tags: [k8s-gpu]`
# selects the GPU runner; we keep the .test-template salt image (overrides the
# runner's default AlmaLinux9). FAIR USE: keep k8s-gpu jobs <= 5 in parallel.
gpu-smoke:
  extends: .test-template
  tags:
    - k8s-gpu
  # The k8s-gpu fleet serves an A100-PCIE-40GB MIG slice with driver 570.x /
  # CUDA 12.8. The image's torch must be built for CUDA <= 12.8 — see
  # setup/Dockerfile, pinned to cuda12.6 + flash-attn cu126 for exactly this.
  # (A cuda13.0 image fails here with "driver too old, found 12080".)
  # Blocking (allow_failure removed): if torch can't see the GPU, fail loudly.
  # FAIR USE: keep k8s-gpu jobs <= 5 in parallel.
  script:
    - nvidia-smi || echo "nvidia-smi not in image (ok as long as torch sees CUDA below)"
    - python -c "import torch; print('cuda_available:', torch.cuda.is_available()); print('torch built for CUDA:', torch.version.cuda); assert torch.cuda.is_available(), 'GPU runner gave no CUDA device to torch — check the image CUDA major is <= the runner driver (nvidia-smi above)'; print('gpu:', torch.cuda.get_device_name(0))"
    - JUNIT_FILE=reports/gpu-gn2.xml run_test salt/tests/test_pipeline.py::test_GN2

